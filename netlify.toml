[build]
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Discovery pipeline: allow more time for source fetch + LLM call (max Netlify allows is 26s)
[functions."discovery-pipeline"]
  timeout = 26

# Motivations-Benachrichtigungen — läuft stündlich in UTC 15–18 (= 17–20 Uhr CET/CEST)
[functions."motivate"]
  schedule = "0 15,16,17,18 * * *"

# /admin → admin.html (200 rewrite so the URL stays /admin in the browser)
[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# /studio → /admin (redirect legacy studio URL to the unified admin panel)
[[redirects]]
  from = "/studio"
  to   = "/admin"
  status = 301

# SPA fallback — serve index.html for all unmatched paths (except /admin and functions)
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
  conditions = {Path = {not = ["/.netlify/*", "/admin", "/admin.html", "/studio.html", "/sw.js", "/manifest.webmanifest", "/icon-*.png"]}}

