function _fmtScheduleDetail(a){const parts=[];const DAY={mo:'Mo',di:'Di',mi:'Mi',do:'Do',fr:'Fr',sa:'Sa',so:'So'};const fmtDays=ds=>(ds||[]).map(d=>DAY[d]||d).join(', ');const sch=a.schedule;if(sch){if(sch.dates&&sch.dates.length>0){const dl=sch.dates.slice(0,5).map(d=>{let s=d.date;if(d.startTime)s+=' '+d.startTime;if(d.endTime)s+='–'+d.endTime+' Uhr';return esc(s)});parts.push('📅 '+dl.join(', '))}if(sch.period&&!(sch.dates&&sch.dates.length))parts.push(`📅 ${esc(sch.period.from)} – ${esc(sch.period.to)}`);if(sch.recurrence){const r=sch.recurrence;const pat={weekly:'Wöchentlich',biweekly:'2-wöchentlich',monthly:'Monatlich',daily:'Täglich',other:'Wiederkehrend'}[r.pattern]||r.pattern;let s=pat;if(r.days&&r.days.length)s+=' '+fmtDays(r.days);if(r.startTime)s+=' '+r.startTime+' Uhr';parts.push('🔁 '+esc(s))}if(sch.regularHours&&sch.regularHours.length){const hl=sch.regularHours.map(h=>{let s=fmtDays(h.days);if(h.open&&h.close)s+=': '+h.open+'–'+h.close+' Uhr';return esc(s)});parts.push('🕐 '+hl.join(', '))}}if(!sch||!sch.period){if(a.operatingPeriod)parts.push(`📅 ${esc(a.operatingPeriod.from)} – ${esc(a.operatingPeriod.to)}`)}if(a.openingHours&&!(sch&&sch.regularHours&&sch.regularHours.length))parts.push('🕐 '+esc(a.openingHours));if(!parts.length)return '';return `<div style="background:#e7f7e4;border-radius:14px;padding:14px 16px;margin:14px 0">${parts.map(p=>`<div class="meta" style="margin:3px 0">${p}</div>`).join('')}</div>`}

function _cardScheduleHint(a){const sch=a.schedule,op=a.operatingPeriod;if(!sch&&!op)return'';const{iso:today,wd:todayWd}=_berlDate();const parts=[];const period=(sch&&sch.period)||op;if(period&&period.from&&period.to){const fmtD=s=>{const[y,m,d]=s.split('-');return`${d}.${m}.${y}`};if(period.to>=today)parts.push(period.from<=today?`bis ${fmtD(period.to)}`:`${fmtD(period.from)}–${fmtD(period.to)}`)}if(sch&&sch.dates&&sch.dates.length){const fut=sch.dates.filter(d=>d.date>=today).slice(0,1);if(fut.length){const d=fut[0];const[y,m,day]=d.date.split('-');let s=`${day}.${m}.`;if(d.date.slice(0,4)!==today.slice(0,4))s+=y;if(d.startTime)s+=' '+d.startTime;if(d.endTime)s+='–'+d.endTime+' Uhr';parts.push(s)}}const exc=sch&&(sch.exceptions||[]).find(e=>e.date===today);if(exc){if(exc.closed)parts.push('heute geschlossen');else if(exc.open&&exc.close)parts.push(`Heute ${exc.open}–${exc.close} Uhr`)}else{const reg=sch&&(sch.regularHours||[]).find(h=>Array.isArray(h.days)&&h.days.includes(todayWd));if(reg&&reg.open&&reg.close)parts.push(`Heute ${reg.open}–${reg.close} Uhr`)}if(!parts.length)return'';return`<div class="meta" style="color:#289c4e;font-size:12px;margin-top:4px">${esc(parts.join(' · '))}</div>`}

// Maps an RTDB activity record to the PWA activity shape.
// All new fields (tagline, eyebrow, lat, lng) are optional — old records still work.
function _toActivity(key, d) {
  const imgs = d.imageUrls;
  const img = !imgs ? ''
    : typeof imgs === 'string' ? imgs
    : Array.isArray(imgs) ? (imgs[0] || '')
    : (imgs['0'] || Object.values(imgs)[0] || '');
  return {
    id: key,
    name: d.title || key,
    title: d.tagline || '',
    provider: d.providerName || d.city || '',
    category: d.category ? d.category.toLowerCase() : 'other',
    location: (() => {
      const vn = d.location && typeof d.location === 'object' ? d.location.venueName || '' : '';
      const city = d.city || '';
      if (vn) return city ? `${vn} · ${city}` : vn;
      // Try to extract a venue name from the first token of the Nominatim address.
      // Only use it when the token has no digits (rules out "Hansaring 97") and is
      // meaningfully long, so we never show a bare street number in cards.
      const addr = d.location && typeof d.location === 'object' ? d.location.address || '' : '';
      if (addr) {
        const first = addr.split(',')[0].trim();
        if (first && first.length > 3 && !/\d/.test(first) && first.toLowerCase() !== city.toLowerCase()) {
          return city ? `${first} · ${city}` : first;
        }
      }
      return d.district || city || (typeof d.location === 'string' ? d.location : '');
    })(),
    price: _fmtPrice(d.price),
    priceData: (d.price && typeof d.price === 'object') ? d.price : null,
    lat: d.lat || null,
    lng: d.lng || null,
    img,
    tag: d.eyebrow || (d.category ? _catLabel(d.category) : ''),
    description: d.description || '',
    website: d.website || null,
    instagram: d.instagram || null,
    bookingUrl: d.bookingUrl || null,
    schedule: d.schedule || null,
    operatingPeriod: d.operatingPeriod || null,
    openingHours: d.openingHours || null,
    address: (d.location && typeof d.location === 'object' && d.location.address) ? d.location.address : null,
    publishedAt: d.publishedAt || null,
    tags: d.tags || null,
    additionalCategories: d.additionalCategories || null,
  };
}

// Loads active activities via the Netlify function (server-side Admin SDK).
// On success, replaces the demo A array. On error or empty result, demo data
// stays visible (never a blank screen).
async function _loadActivities() {
  try {
    const res = await fetch('/.netlify/functions/activities');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const rows = Object.entries(data.activities || {})
      .map(([key, val]) => _toActivity(key, val));
    _activitiesLoaded = true;
    if (rows.length > 0) {
      A.splice(0, A.length, ...rows);
      if (!A.find(a => a.id === S.selected)) S.selected = A[0].id;
      save();
    }
    render();
  } catch (e) {
    console.warn('[someday] Activities endpoint unavailable:', e.message);
    _activitiesLoaded = true;
    render();
  }
}

          if (res.status === 401) {
            token = await user.getIdToken(true);
            res   = await fetch('/.netlify/functions/user-data', {
              headers: { 'Authorization': `Bearer ${token}` },
            });
          }
          if (res.ok) {
            _userData = await res.json();
            // Bootstrap RTDB profile for users who signed in via Google but have no profile node yet.
            // user-profile preserves existing fields (createdAt etc.) — safe to call every first login.
            if (!(_userData.profile && (_userData.profile.displayName || _userData.profile.username)) && user.displayName) {
              try {
                await fetch('/.netlify/functions/user-profile', {
                  method: 'POST',
                  headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ displayName: user.displayName }),
                });
                // Re-fetch so the rest of the session sees the new profile
                const res2 = await fetch('/.netlify/functions/user-data', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res2.ok) _userData = await res2.json();
              } catch (e) { console.warn('[someday] profile bootstrap failed:', e.message); }
            }
          } else {
            const msg = res.status === 503
              ? 'Dienst vorübergehend nicht verfügbar. Bitte versuche es später erneut.'
              : res.status === 401
              ? 'Sitzung abgelaufen – bitte melde dich erneut an.'
              : `Soziale Daten konnten nicht geladen werden (HTTP ${res.status}).`;
            _userData = { _error: true, _status: res.status, _message: msg };
          }
        } catch (e) {
          console.warn('[someday] user-data unavailable:', e.message);
        }
      }
      _authReady = true;
      render();
      // Process pending deep-links (after login)
      if (user) {
        try {
          const pendingAdd = sessionStorage.getItem('someday_pending_add');
          if (pendingAdd) {
            sessionStorage.removeItem('someday_pending_add');
            _handleAddFriend(pendingAdd);
          }
        } catch {}
        try {
          const pendingConnect = sessionStorage.getItem('someday_pending_connect');
          if (pendingConnect) {
            sessionStorage.removeItem('someday_pending_connect');
            _loadConnectPreview(pendingConnect);
          }
        } catch {}
        try {
          const pendingJoin = sessionStorage.getItem('someday_pending_joinspace');
          if (pendingJoin) {
            sessionStorage.removeItem('someday_pending_joinspace');
            _joinSpaceViaLink(pendingJoin);
          }
        } catch {}
      }
    });
  } catch (e) {
    console.warn('[someday] Firebase Auth init failed:', e.message);
    _authReady = true;
  }
  return _fbAuth;
}

async function _signIn() {
  const email = ($('auth-email') || {}).value || '';
  const pw    = ($('auth-pw')    || {}).value || '';
  const errEl = $('auth-err');
  if (!email || !pw) { if (errEl) errEl.textContent = 'Please enter email and password.'; return; }
  if (errEl) errEl.textContent = '';
  try {
    const auth = _initFirebaseAuth();
    await auth.signInWithEmailAndPassword(email, pw);
  } catch (e) {
    const errEl2 = $('auth-err');
    if (errEl2) errEl2.textContent = e.message || 'Sign-in failed.';
  }
}

async function _signOut() {
  try { if (_fbAuth) await _fbAuth.signOut(); }
  catch (e) { console.warn('[someday] sign-out error:', e.message); }
}

async function _exportData() {
  if (!_currentUser) return;
  const btn = document.getElementById('gdpr-export-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Exporting…'; }
  try {
    const token = await _currentUser.getIdToken();
    const res = await fetch('/.netlify/functions/user-export', {
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (!res.ok) { alert('Export failed: ' + res.status); return; }
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'someday-data.json';
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Export error: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Export my data'; }
  }
}

async function _deleteAccount() {
  if (!_currentUser) return;
  if (!confirm('Delete your account and all personal data permanently? This cannot be undone.')) return;
  const btn = document.getElementById('gdpr-delete-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }
  try {
    const token = await _currentUser.getIdToken();
    const res = await fetch('/.netlify/functions/user-delete', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (!res.ok) { alert('Delete failed: ' + res.status); return; }
    await _fbAuth.signOut();
  } catch (e) {
    alert('Delete error: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Delete my account'; }
  }
}

// Google Sign-In.
// Uses popup first — popup stays on the same page and avoids Safari ITP cookie
// issues that break the redirect flow in PWA standalone mode and iOS Safari.
// Falls back to redirect if the popup is blocked (some corporate/strict browsers).
async function _signInWithGoogle() {
  const errEl = $('auth-err');
  if (errEl) errEl.textContent = '';
  try {
    const auth = _initFirebaseAuth();
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
    } catch (popupErr) {
      if (popupErr.code === 'auth/popup-blocked' || popupErr.code === 'auth/cancelled-popup-request') {
        if (errEl) errEl.textContent = 'Popup blocked — redirecting to Google…';
        await auth.signInWithRedirect(provider);
      } else if (popupErr.code === 'auth/popup-closed-by-user') {
        // User dismissed the popup — no error message needed.
      } else {
        throw popupErr;
      }
    }
  } catch (e) {
    if (errEl) errEl.textContent = e.message || 'Google sign-in failed.';
  }
}

async function _signUp() {

  if (errEl) errEl.textContent = '';
  try {
    const auth = _initFirebaseAuth();
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    const token = await cred.user.getIdToken();
    await fetch('/.netlify/functions/user-profile', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ displayName: name.trim() }),
    });
  } catch (e) {
    const errEl2 = $('auth-err');
    if (errEl2) errEl2.textContent = e.message || 'Sign-up failed.';
  }
}

function _fmtPollDate(date, time) {
  if (!date) return _t('poll_date_open');
  try {
    const d = new Date(date + 'T00:00:00');
    const loc = _lang === 'de' ? 'de-DE' : 'en-GB';
    const ds = d.toLocaleDateString(loc, { weekday: 'short', day: 'numeric', month: 'short' });
    return time ? ds + ', ' + time : ds;
  } catch { return date + (time ? ' ' + time : ''); }
}

    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = isError ? '#7c1a1a' : '#183b28';
  el.style.color = '#fff';
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, isError ? 4000 : 3000);
}

function _pollToast(msg) {
  let el = document.getElementById('poll-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'poll-toast';
    el.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#183b28;color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;font-weight:700;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 3000);
}

// Returns a stable per-event guest ID stored in localStorage.
// Changing your display name does not create a new identity.
function getGuestId(eventId) {
  const key = 'vivo_guest_' + eventId;
  let id = localStorage.getItem(key);
  if (!id) {
    id = Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
    localStorage.setItem(key, id);
  }
  return id;
}

// Returns the invite token for a given event from URL params or localStorage.
function _getStoredInviteToken(eventId) {
  const params = new URLSearchParams(window.location.search);
  if (params.get('e') === eventId && params.get('t')) return params.get('t');
  return localStorage.getItem('vivo_invite_' + eventId) || null;
}

// Fetches fresh event + user data after a vote or RSVP change.
async function _refreshUserData() {
  if (!_currentUser) return;
  try {
    const token = await _currentUser.getIdToken();
    const res   = await fetch('/.netlify/functions/user-data', {
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (res.ok) { _userData = await res.json(); render(); }
  } catch (e) { console.warn('[someday] data refresh error:', e.message); }
}

// Fetches fresh event data for a guest via invite token.
async function _refreshGuestEventData(eventId, inviteToken) {
  try {
    const res = await fetch(
      `/.netlify/functions/guest-event?eventId=${encodeURIComponent(eventId)}&token=${encodeURIComponent(inviteToken)}`
    );
    if (res.ok) {
      const data   = await res.json();
      _guestEventData = { ...data.event, id: eventId };
      render();
    }
  } catch (e) { console.warn('[someday] guest data refresh error:', e.message); }
}

function buildPollSection(ev) {
  if (!ev || !ev.poll) return '';
  const poll = ev.poll;
  const isCreator = _currentUser && ev.createdBy === _currentUser.uid;

  if (!poll.active && poll.confirmedOption) {
    const opt = poll.options && poll.options[poll.confirmedOption];
    return `<h2 class="section">${_t('poll_section_title')}</h2>
    <div class="poll-card confirmed">
      <div class="poll-card-date">${_t('poll_confirmed_toast').split('!')[0]}:
        ${_fmtPollDate(opt ? opt.date : ev.date, opt ? opt.time : ev.time)}</div>
    </div>`;
  }

  if (!poll.active) return '';

  const options = poll.options ? Object.entries(poll.options) : [];
  const allVoterIds = new Set(options.flatMap(([, o]) => o.votes ? Object.keys(o.votes) : []));
  const totalVoters = allVoterIds.size;
  const voterKey = (_currentUser && !_currentUser.isAnonymous)
    ? _currentUser.uid
    : 'g_' + getGuestId(ev.id);
  const myVotes = new Set();
  options.forEach(([optId, o]) => { if (o.votes && o.votes[voterKey]) myVotes.add(optId); });

  const anonName = !_currentUser ? (localStorage.getItem('vivo_poll_anon_name') || '') : '';
  const anonHeader = !_currentUser ? `
    <div style="background:#fff;border-radius:12px;border:1px solid var(--line);padding:16px;margin-bottom:12px">
      <p class="small" style="margin:0 0 8px;font-weight:500">${_t('poll_vote_as')}</p>
      <input type="text" id="poll-anon-inp" value="${esc(anonName)}"
        placeholder="Dein Name, z.B. Max Mustermann"
        oninput="localStorage.setItem('vivo_poll_anon_name',this.value)"
        class="field" style="margin-bottom:10px">
      <p class="small" style="margin:0;text-align:center">
        oder <button onclick="nav('Profile')" style="border:0;background:none;color:#277c42;font-weight:700;cursor:pointer">Einloggen</button>
        — dann wird dein Name automatisch verwendet
      </p>
    </div>` : '';

  const uidToName = {};
  if (ev.rsvps) Object.values(ev.rsvps).forEach(r => { if (r.userId) uidToName[r.userId] = r.name; });
  if (_currentUser) uidToName[_currentUser.uid] = (_userData && _userData.profile && _userData.profile.displayName) || _currentUser.displayName || (_currentUser.email ? _currentUser.email.split('@')[0] : 'Du');

  const cards = options.map(([optId, opt]) => {
    const voteCount = opt.votes ? Object.keys(opt.votes).length : 0;
    const pct = totalVoters > 0 ? Math.round(voteCount / totalVoters * 100) : 0;
    const iVoted = myVotes.has(optId);
    const safeTime = (opt.time || '').replace(/'/g, "\\'");
    const voterNames = Object.entries(opt.votes || {}).map(([k, v]) => {
      if (v === true) return uidToName[k] || null;
      return (v && v.name) ? v.name : null;
    }).filter(Boolean);
    const MAX_SHOWN = 4;
    const namesHtml = voterNames.length
      ? `<div class="small" style="margin-top:6px;line-height:1.4">
           ${voterNames.slice(0, MAX_SHOWN).map(n => esc(n)).join(', ')}${voterNames.length > MAX_SHOWN ? ` +${voterNames.length - MAX_SHOWN}` : ''}
         </div>` : '';
    return `<div class="poll-card${iVoted ? ' i-voted' : ''}">
      <div class="poll-card-head">
        <div class="poll-card-date">${_fmtPollDate(opt.date, opt.time)}</div>
        <div class="poll-card-votes">${voteCount} Stimme${voteCount !== 1 ? 'n' : ''}</div>
      </div>
      <div class="poll-bar-wrap"><div class="poll-bar" style="width:${pct}%"></div></div>
      ${namesHtml}
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
        <button class="btn ${iVoted ? '' : 'secondary'} full"
          onclick="togglePollVote('${esc(ev.id)}','${esc(optId)}')">
          ${iVoted ? _t('poll_voted') : _t('poll_vote_btn')}
        </button>
        ${isCreator ? `<button class="btn secondary full" style="color:#5CB87A;border-color:#5CB87A"
          onclick="confirmPollOption('${esc(ev.id)}','${esc(optId)}','${esc(opt.date)}','${safeTime}')">
          ${_t('poll_confirm_btn')}
        </button>` : ''}
      </div>
    </div>`;
  }).join('');

  return `<h2 class="section">${_t('poll_section_title')} <span class="tag">${totalVoters}</span></h2>
  ${anonHeader}${cards || '<div class="empty">Noch keine Optionen</div>'}`;
}

async function togglePollVote(eventId, optionId) {
  const inviteToken = _getStoredInviteToken(eventId);

  if (_currentUser && !_currentUser.isAnonymous) {
    // ── Authenticated user ─────────────────────────────────────────────────
    try {
      const token = await _currentUser.getIdToken();
      const res   = await fetch('/.netlify/functions/poll-vote', {
        method:  'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body:    JSON.stringify({ eventId, optionId, inviteToken }),
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        _pollToast('Fehler: ' + (d.error || `HTTP ${res.status}`));
        return;
      }
      await _refreshUserData();
    } catch (e) { console.error('[someday] poll vote error:', e); _pollToast('Fehler beim Abstimmen'); }
  } else {
    // ── Guest user ─────────────────────────────────────────────────────────
    const nameInp = document.getElementById('poll-anon-inp');
    const name    = (nameInp ? nameInp.value.trim() : '') || localStorage.getItem('vivo_poll_anon_name') || '';
    if (!name) {
      if (nameInp) { nameInp.focus(); nameInp.style.borderColor = '#e74c3c'; setTimeout(() => nameInp.style.borderColor = '', 2500); }
      _pollToast('Bitte gib zuerst deinen Namen ein');
      return;
    }
    if (!inviteToken) {
      _pollToast('Kein gültiger Einladungslink — bitte nutze den Original-Link');
      return;
    }
    localStorage.setItem('vivo_poll_anon_name', name);
    const guestId = getGuestId(eventId);
    try {
      const res = await fetch('/.netlify/functions/poll-vote', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ eventId, optionId, inviteToken, guestId, guestName: name }),
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        _pollToast('Fehler: ' + (d.error || `HTTP ${res.status}`));
        return;
      }
      await _refreshGuestEventData(eventId, inviteToken);
    } catch (e) { console.error('[someday] poll vote error:', e); _pollToast('Fehler beim Abstimmen'); }
  }
}

async function confirmPollOption(eventId, optionId, date, time) {
  if (!_currentUser || !_currentUser.uid) return;
  if (!confirm('Diesen Termin für alle bestätigen?')) return;
  try {
    const token = await _currentUser.getIdToken();
    const res = await fetch('/.netlify/functions/poll-confirm', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ eventId, optionId, date, time: time || null }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      _pollToast('Fehler: ' + (d.error || `HTTP ${res.status}`));
      return;
    }
    _pollToast(_t('poll_confirmed_toast'));
    await _refreshUserData();
  } catch(e) { console.error('confirmPollOption:', e); _pollToast('Fehler: ' + e.message); }
}

function _parseTime(t) {
  if (!t) return 18;
  const [h, m] = t.split(':').map(Number);
  return h + (m || 0) / 60;
}

const _rsvpToLabel = { dabei: 'Going', vielleicht: 'Maybe', nein: "Can't", created: 'Going' };
const _labelToRsvp = { Going: 'dabei', Maybe: 'vielleicht', "Can't": 'nein' };

const _spaceColors = [
  ['#d8f5d5','#268547'], ['#dce8f5','#265985'], ['#f5e8d8','#855226'],
  ['#e8d8f5','#622685'], ['#f5d8e8','#854265'], ['#d8f5f2','#267a85'],
];

function _spaceSaveTargets() {
  const targets = ['Just for me'];
  if (_userData && _userData.spaces) {
    Object.values(_userData.spaces).forEach(sp => { if (sp && sp.name) targets.push(sp.name); });
  }
  return targets;
}

function _spaceFormTargets() {
  if (!_userData || !_userData.spaces) return [];
  return Object.entries(_userData.spaces)
    .filter(([, sp]) => sp && sp.name)
    .map(([id, sp]) => ({ id, name: sp.name }));
}

function _realCalOwners() {
  const owners = { Personal: ['#f9dce6','#b34d76'] };
  if (_userData && _userData.spaces) {
    let i = 0;
    Object.values(_userData.spaces).forEach(sp => {
      if (sp && sp.name && sp.name !== 'Personal') {
        owners[sp.name] = _spaceColors[i % _spaceColors.length];
        i++;
      }
    });
  }
  return owners;
}

function _fbCalEntries() {
  if (!_userData) return [];
  const { events, userEvents, spaces, spaceEvents } = _userData;
  if (!events || !userEvents) return [];
  const eventSpaceName = {};
  if (spaceEvents && spaces) {
    Object.entries(spaceEvents).forEach(([spaceId, evts]) => {
      const name = (spaces[spaceId] || {}).name;
      if (!name) return;
      Object.keys(evts || {}).forEach(evId => {
        if (!eventSpaceName[evId]) eventSpaceName[evId] = name;
      });
    });
  }
  return Object.entries(userEvents).map(([id, status]) => {
    const ev = events[id];
    if (!ev || !ev.date) return null;
    return {
      id,
      date:      ev.date,
      start:     _parseTime(ev.time),
      end:       _parseTime(ev.time) + 1,
      title:     `${ev.emoji || ''} ${ev.title || ''}`.trim(),
      owner:     eventSpaceName[id] || 'Personal',
      _fbStatus: status,
      _firebase: true,
    };
  }).filter(Boolean);
}

function _pendingInvites() {
  if (!_userData) return [];
  const { invites, events, userEvents } = _userData;
  if (!invites || !events) return [];
  return Object.keys(invites)
    .filter(id => !userEvents[id])
    .map(id => ({ id, event: events[id] }))
    .filter(x => x.event);
}

function _pendingSpaceInvites() {
  if (!_userData || !_userData.spaceInvites) return [];
  return Object.entries(_userData.spaceInvites).map(([spaceId, inv]) => ({ spaceId, ...inv }));
}

      ];
  allEntries.forEach(e => {
    if (e.owner && !owners[e.owner])
      owners[e.owner] = _spaceColors[Object.keys(owners).length % _spaceColors.length];
  });
  const layers    = S.layers.filter(l => l in owners);
  const visLayers = layers.length ? layers : Object.keys(owners);
  const es        = allEntries.filter(e => visLayers.includes(e.owner));
  const _today = new Date();
  const _dow   = (_today.getUTCDay() + 6) % 7;
  const _mon   = new Date(Date.UTC(_today.getUTCFullYear(), _today.getUTCMonth(), _today.getUTCDate() - _dow));
  const start  = new Date(Date.UTC(_mon.getUTCFullYear(), _mon.getUTCMonth(), _mon.getUTCDate() + 7 * S.week));
  const days      = Array.from({length:7}, (_, i) => {
    const d = new Date(start); d.setUTCDate(start.getUTCDate() + i);
    return d.toISOString().slice(0, 10);
  });
  const label = `${days[0].slice(5)} – ${days[6].slice(5)} · ${start.getUTCFullYear()}`;
  const toggleChip = t =>
    `<button class="${S.layers.includes(t)?'on':''}" onclick="S.layers=S.layers.includes('${t}')?S.layers.filter(x=>x!=='${t}'):[...S.layers,'${t}'];save();render()">` +
    `<span style="color:${(owners[t]||[])[1]||'#333'}">●</span> ${esc(t)}</button>`;
  const pendInvites = _pendingInvites();
  const inviteSection = pendInvites.length ? `
    <h2 class="section" style="color:#c0392b">${_t('cal_pending')} (${pendInvites.length})</h2>
    <div class="stack" style="margin-bottom:20px">
      ${pendInvites.map(({id, event:ev}) => `
        <div class="rowcard"><div class="between"><div>
          <strong>${esc((ev.emoji||'')+' '+(ev.title||''))}</strong>
          <div class="small">${esc(ev.date||'')} ${esc(ev.time||'')}${ev.location?' · '+esc(ev.location):''}</div>
        </div><div style="display:flex;gap:6px">
          ${['dabei','vielleicht','nein'].map(s =>
            `<button class="chip" onclick="_rsvp('${id}','${s}')">${{dabei:'✓ Going',vielleicht:'Maybe',nein:'✗'}[s]}</button>`
          ).join('')}
        </div></div></div>`).join('')}
    </div>` : '';
  const SLOT_H = 50;
  const weekView = () => `<div class="calendar-scroll"><div class="calendar">
    <div class="cal-head">${days.map((d,i) =>
      `<button class="cal-day" onclick="openCreate('personal','','${d}')">${(_t('cal_days')||['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])[i]}<br>${Number(d.slice(-2))}</button>`
    ).join('')}</div>
    ${Array.from({length:14},(_,i) => `<div class="cal-time" style="top:${i*SLOT_H}px">${i+8}:00</div>`).join('')}
    ${Array.from({length:7}, (_,i) => `<div class="cal-line" style="left:${i*100/7}%"></div>`).join('')}
    ${es.filter(e => days.includes(e.date) && e.start >= 8 && e.start < 22).map(e => {
      const overlap = es.filter(f => f !== e && f.date === e.date && f.start < e.end && f.end > e.start);
      const side    = overlap.length && e.start >= overlap[0].start ? 1 : 0;
      const w       = overlap.length ? 6.8 : 13.6;
      const [bg, fg] = owners[e.owner] || ['#f0f0f0','#333'];
      return `<button class="cal-event" onclick="openEvent('${e.id}')"
        style="left:calc(${days.indexOf(e.date)*100/7 + side*6.8}% + 2px);
               width:calc(${w}% - 3px);top:${(e.start-8)*SLOT_H}px;
               height:${Math.max(25,(e.end-e.start)*SLOT_H-2)}px;
               background:${bg};border-color:${fg};color:${fg}">
        ${esc(e.title)}<br>${formatHour(e.start)}</button>`;
    }).join('')}
  </div></div>`;
  const monthView = () => {
    const firstDay = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), 1));
    const offset   = (firstDay.getUTCDay() + 6) % 7;
    const lastDay  = new Date(Date.UTC(firstDay.getUTCFullYear(), firstDay.getUTCMonth()+1, 0)).getUTCDate();
    const cells    = Array.from({length: offset + lastDay}, (_, i) =>
      i < offset ? '' : new Date(Date.UTC(firstDay.getUTCFullYear(), firstDay.getUTCMonth(), i-offset+1)).toISOString().slice(0,10)
    );
    return `<div class="monthgrid">
      ${(_t('cal_days_short')||['M','T','W','T','F','S','S']).map(d => `<div class="small" style="text-align:center">${d}</div>`).join('')}
      ${cells.map(d => `<div class="monthcell" onclick="${d ? `openCreate('personal','','${d}')` : ''}">
        ${d ? Number(d.slice(-2)) : ''}
        ${es.filter(e => e.date === d).slice(0,3).map(e => {
          const [bg, fg] = owners[e.owner] || ['#f0f0f0','#333'];
          return `<div class="monthlabel" onclick="event.stopPropagation();openEvent('${e.id}')"
            style="background:${bg};color:${fg}">${esc(e.title)}</div>`;
        }).join('')}
      </div>`).join('')}
    </div>`;
  };
  const signedInNote = isReal
    ? `<p class="footnote">${_t('cal_footnote')}</p>`
    : `<p class="footnote">${_t('cal_demo')}</p>`;
  return `<div class="content">
    <div class="between"><h1 class="headline">${_t('cal_title')}</h1>${segment('calView',['Week','Month'])}</div>
    <div class="toggle">${Object.keys(owners).map(toggleChip).join('')}</div>
    <div class="between" style="margin:20px 0">
      <button class="chip" onclick="set({week:S.week-1})">←</button>
      <button class="chip" onclick="set({week:0})" style="font-size:11px">${_t('cal_today')}</button>
      <strong>${label}</strong>
      <button class="chip" onclick="set({week:S.week+1})">→</button>
    </div>
    ${button(_t('cal_new_event'), "openCreate('personal')", 'secondary full')}
    <div style="height:15px"></div>
    ${S.calView === 'Week' ? weekView() : monthView()}
    ${inviteSection}
    ${signedInNote}
  </div>`;
}

async function _rsvp(eventId, fbStatus, guestName) {
  if (_userData && _userData.userEvents) _userData.userEvents[eventId] = fbStatus;
  render();
  if (!_currentUser) return;
  try {
    const token = await _currentUser.getIdToken();
    const body  = { eventId, status: fbStatus };
    if (guestName) body.guestName = String(guestName).trim().slice(0, 100);
    const res = await fetch('/.netlify/functions/event-rsvp', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body:   JSON.stringify(body),
    });
    if (!res.ok) console.warn('[someday] RSVP failed:', await res.text());
  } catch (e) { console.warn('[someday] RSVP error:', e.message); }
}

const _origCommitCustom = commitCustom;
window.commitCustom = async function commitCustom_auth() {
  // Unauthenticated: save locally only
  if (!_currentUser) { _origCommitCustom(); return; }
  if (!D || !D.title) return;

  const spaceIds   = [];
  const inviteUids = [];
  const myUid = _userData && _userData.uid;

  // Collect spaceIds from D._spaceIds (set by startGroupEvent) or from space names
  const sIdSet = new Set(D._spaceIds || []);
  if (D.kind === 'group' && D.spaces && D.spaces.length && _userData && _userData.spaces) {
    D.spaces.forEach(spaceName => {
      const entry = Object.entries(_userData.spaces).find(([, sp]) => sp.name === spaceName);
      if (entry) sIdSet.add(entry[0]);
    });
  }
  sIdSet.forEach(sId => {
    spaceIds.push(sId);
    const sp = (_userData && _userData.spaces || {})[sId];
    if (sp) {
      Object.keys(sp.members || {}).forEach(uid => {
        if (uid !== myUid && !inviteUids.includes(uid)) inviteUids.push(uid);
      });
    }
  });

  // Disable submit buttons while writing
  const sheetBtns = document.querySelectorAll('.sheet .btn');
  sheetBtns.forEach(b => { b.disabled = true; });
  try {
    const token = await _currentUser.getIdToken();
    const res = await fetch('/.netlify/functions/event-create', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify((() => {
        const isPoll = D.method === 'poll' && D.step === 'poll';
        const validPollOpts = isPoll ? _pollOptions.filter(o => o.date) : [];
        const payload = {
          title: D.title,
          date: validPollOpts.length ? null : D.date,
          time: validPollOpts.length ? null : D.start,
          location: D.location, details: D.description, spaceIds, inviteUids,
        };
        if (validPollOpts.length) {
          payload.pollOptions = validPollOpts.map(o => ({ date: o.date, time: o.time || null }));
        }
        return payload;
      })()),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      sheetBtns.forEach(b => { b.disabled = false; });
      alert('Fehler beim Speichern: ' + (d.error || `HTTP ${res.status}`));
      return;
    }
    // Server confirmed — navigate first, then refresh
    set({ sheet: false,
          tab:      D.kind === 'personal' ? 'Calendar' : 'Spaces',
          page:     D.kind === 'personal' ? 'home' : 'space',
          space:    D.kind !== 'personal' && D.spaces && D.spaces[0] ? D.spaces[0] : S.space,
          spaceTab: 'Events' });
    const res2 = await fetch('/.netlify/functions/user-data', { headers: { 'Authorization': `Bearer ${token}` } });
    if (res2.ok) { _userData = await res2.json(); render(); }
  } catch (e) {
    console.warn('[someday] event-create error:', e.message);
    sheetBtns.forEach(b => { b.disabled = false; });
    alert('Fehler beim Speichern: ' + e.message);
  }
};

async function _friendAction(action, targetUid) {
  if (!_currentUser) return;
  try {
    const token = await _currentUser.getIdToken();
    const res = await fetch('/.netlify/functions/friends', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, targetUid }),
    });
    if (!res.ok) { console.warn('[someday] friend action failed:', await res.text()); return; }
    // Refresh user data
    const res2 = await fetch('/.netlify/functions/user-data', { headers: { 'Authorization': `Bearer ${token}` } });
    if (res2.ok) { _userData = await res2.json(); render(); }
  } catch (e) { console.warn('[someday] _friendAction error:', e.message); }
}

async function _searchFriends() {
  const input = $('friend-search');
  const q = (input ? input.value : '').trim();
  if (!q || q.length < 2) {
    const el = $('friend-results'); if (el) el.innerHTML = '<div class="small" style="color:#c0392b">Enter at least 2 characters.</div>'; return;
  }
  if (!_currentUser) return;
  const el = $('friend-results'); if (el) el.innerHTML = '<div class="small">Searching…</div>';
  try {
    const token = await _currentUser.getIdToken();
    const res = await fetch(`/.netlify/functions/user-search?q=${encodeURIComponent(q)}`, {
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { users } = await res.json();
    if (!el) return;
    const myFriends = _userData && _userData.friends ? _userData.friends : {};
    if (!users.length) { el.innerHTML = '<div class="empty">No users found.</div>'; return; }
    el.innerHTML = users.map(u => {
      const isFriend = !!myFriends[u.uid];
      return `<div class="rowcard between" style="margin-bottom:8px">
        <div><strong>${esc(u.displayName || u.username || u.uid)}</strong>
        ${u.username ? `<div class="small">@${esc(u.username)}</div>` : ''}</div>
        ${isFriend
          ? '<span class="chip">Friends ✓</span>'
          : `<button class="chip" onclick="_sendFriendRequest('${u.uid}')">Add friend</button>`}
      </div>`;
    }).join('');
  } catch (e) { if (el) el.innerHTML = `<div class="small" style="color:#c0392b">Search failed: ${esc(e.message)}</div>`; }
}

async function _sendFriendRequest(targetUid) {
  if (!_currentUser) return;

    const res = await fetch('/.netlify/functions/friends', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'request', targetUid }),

    const btn = document.querySelector(`button[onclick="_sendFriendRequest('${targetUid}')"]`);
    if (res.ok) { if (btn) btn.textContent = 'Sent ✓'; }

}

async function _copyInviteLink() {
  if (!_currentUser) return;
  const btn = document.querySelector('button[onclick="_copyInviteLink()"]');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const idToken = await _currentUser.getIdToken();
    const res = await fetch('/.netlify/functions/friend-invite-link', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${idToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'generate' }),
    });
    if (!res.ok) throw new Error('generate failed');
    const { token } = await res.json();
    const url = window.location.origin + '/?connect=' + encodeURIComponent(token);
    navigator.clipboard.writeText(url).then(() => {
      const el = $('copy-confirm');
      if (el) { el.style.display = 'block'; setTimeout(() => { el.style.display = 'none'; }, 2500); }
    }).catch(() => { window.prompt('Dein Einladungslink:', url); });
  } catch (e) {
    alert('Link konnte nicht erstellt werden. Bitte versuche es erneut.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔗 Link kopieren'; }
  }
}

// Called when arriving via /?add={uid} — shows a sheet to send a friend request.
async function _handleAddFriend(targetUid) {
  if (!_currentUser) return;
  if (targetUid === _currentUser.uid) {
    _pendingAddUid = null;
    _showToast('Das bist du selbst. Teile diesen Link mit anderen.', true);
    history.replaceState(null, '', window.location.pathname);
    return;
  }
  // Check if already friends
  if (_userData && _userData.friends && _userData.friends[targetUid]) {
    _pendingAddUid = null;
    history.replaceState(null, '', window.location.pathname);
    _showToast('Ihr seid bereits befreundet.');
    return;
  }
  _pendingAddUid = targetUid;
  _pendingAddProfile = null;
  render();
  // Fetch public profile in background
  try {
    const token = await _currentUser.getIdToken();
    const res = await fetch(`/.netlify/functions/user-profile-public?uid=${encodeURIComponent(targetUid)}`, {
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (res.ok) { _pendingAddProfile = await res.json(); render(); }
  } catch (e) { /* show sheet without name */ }
}

function _dismissAddFriend() {
  _pendingAddUid = null;
  _pendingAddProfile = null;
  history.replaceState(null, '', window.location.pathname);
  render();
}

async function _confirmAddFriend() {
  if (!_pendingAddUid || !_currentUser) return;
  const uid        = _pendingAddUid;
  const targetName = _pendingAddProfile
    ? (_pendingAddProfile.displayName || (_pendingAddProfile.username ? '@' + _pendingAddProfile.username : null) || 'der Person')
    : 'der Person';
  const btn = $('add-friend-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Wird gesendet…'; }
  try {
    const token = await _currentUser.getIdToken();
    const res = await fetch('/.netlify/functions/friends', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'request', targetUid: uid }),
    });
    if (res.ok) {
      _pendingAddUid    = null;
      _pendingAddProfile = null;
      history.replaceState(null, '', window.location.pathname);
      const res2 = await fetch('/.netlify/functions/user-data', { headers: { 'Authorization': `Bearer ${token}` } });
      if (res2.ok) _userData = await res2.json();
      render();
      _showToast(`Freundschaftsanfrage an ${targetName} gesendet!`);
    } else {
      const d = await res.json().catch(() => ({}));
      _pendingAddUid    = null;
      _pendingAddProfile = null;
      history.replaceState(null, '', window.location.pathname);
      render();
      if (res.status === 409) _showToast('Du hast dieser Person bereits eine Anfrage gesendet oder ihr seid bereits befreundet.', true);
      else if (res.status === 404) _showToast('Dieser Nutzer wurde nicht gefunden.', true);
      else _showToast(d.error || `Fehler beim Senden der Anfrage (HTTP ${res.status}).`, true);
    }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Anfrage senden'; }
    _showToast('Netzwerkfehler – bitte überprüfe deine Verbindung und versuche es erneut.', true);
  }
}

  const name = loaded

  const sub = loaded && _pendingAddProfile.username ? `<div class="small" style="margin-top:2px">@${esc(_pendingAddProfile.username)}</div>` : '';

  _spaceCreateErr        = '';

function _spaceCreateDeselect(uid) {

  delete copy[uid];
  _spaceCreateSelected = copy;

async function _submitSpaceCreate() {
  if (_spaceCreateSubmitting) return;
  // Read name from state variable (always current, survives re-renders)
  const name = _spaceCreateName.trim();
  if (!name) { _spaceCreateErr = 'Bitte einen Space-Namen eingeben.'; render(); return; }
  _spaceCreateErr        = '';
  _spaceCreateSubmitting = true;
  render();
  if (!_currentUser) { _spaceCreateSubmitting = false; render(); return; }
  try {
    const token      = await _currentUser.getIdToken();
    const memberUids = Object.keys(_spaceCreateSelected);
    const res = await fetch('/.netlify/functions/space-create', {
      method:  'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body:    JSON.stringify({ name, memberUids }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      _spaceCreateErr        = d.error || 'Fehler beim Erstellen.';
      _spaceCreateSubmitting = false;
      render();
      return;
    }
    const created = await res.json();
    // Reset all form state only on confirmed success
    _spaceCreateName       = '';
    _spaceCreateSearch     = '';
    _spaceCreateSelected   = {};
    _spaceCreateErr        = '';
    _spaceCreateSubmitting = false;
    // Refresh user data before navigating so the new space is visible
    const res2 = await fetch('/.netlify/functions/user-data', { headers: { 'Authorization': `Bearer ${token}` } });
    if (res2.ok) _userData = await res2.json();
    set({ sheet: null, tab: 'Spaces', page: 'space', spaceId: created.spaceId, space: created.name, spaceTab: 'Events' });
  } catch (e) {
    _spaceCreateErr        = e.message || 'Netzwerkfehler – bitte erneut versuchen.';
    _spaceCreateSubmitting = false;
    render();
  }
}

async function _joinSpaceViaLink(token) {
  if (!_currentUser) return;
  try {
    // First fetch preview (no auth required)
    const previewRes = await fetch(`/.netlify/functions/space-invite-link?token=${encodeURIComponent(token)}`);
    if (!previewRes.ok) {
      const d = await previewRes.json();
      alert(d.error === 'Link expired' ? 'Dieser Einladungslink ist abgelaufen.' : 'Ungültiger Einladungslink.');
      return;
    }
    const { spaceName, memberCount } = await previewRes.json();
    const confirmed = confirm(`Space beitreten?\n\n„${spaceName}" · ${memberCount} ${memberCount !== 1 ? 'Mitglieder' : 'Mitglied'}\n\nJetzt beitreten?`);
    if (!confirmed) return;
    const idToken = await _currentUser.getIdToken();
    const res = await fetch('/.netlify/functions/space-invite-link', {
      method:  'POST',
      headers: { 'Authorization': `Bearer ${idToken}`, 'Content-Type': 'application/json' },
      body:    JSON.stringify({ action: 'accept', token }),
    });
    const joinData = await res.json();
    if (!res.ok) {
      if (joinData.error === 'already_member') { alert('Du bist bereits Mitglied dieses Spaces.'); return; }
      alert(joinData.error || 'Fehler beim Beitreten.');
      return;
    }
    // Refresh and navigate
    const res2 = await fetch('/.netlify/functions/user-data', { headers: { 'Authorization': `Bearer ${idToken}` } });
    if (res2.ok) { _userData = await res2.json(); }
    const { spaceId } = joinData;
    alert(`Willkommen in „${spaceName}"!`);
    set({ tab: 'Spaces', page: 'space', spaceId, space: spaceName, spaceTab: 'Events' });
  } catch (e) { console.error('[someday] joinSpaceViaLink:', e.message); }
}

// ── Demo data separation ───────────────────────────────────────────────────

// ── Invite link handler ───────────────────────────────────────────────────────
// Handles URLs like  someday.app/?e={eventId}&t={inviteToken}
// Fetches event data server-side, signs in with a Firebase Custom Token so that
// the RTDB rule (grantedEvent claim) allows reads, then navigates to the event.
async function _handleInviteLink() {
  const params    = new URLSearchParams(window.location.search);
  const eventId   = params.get('e');
  const token     = params.get('t');
  if (!eventId || !token) return;

  // Persist token so subsequent function calls (votes, RSVP) can retrieve it
  try { localStorage.setItem('vivo_invite_' + eventId, token); } catch {}

  try {
    const res = await fetch(
      `/.netlify/functions/guest-event?eventId=${encodeURIComponent(eventId)}&token=${encodeURIComponent(token)}`
    );
    if (!res.ok) {
      console.warn('[someday] invite link invalid:', res.status);
      return;
    }
    const data = await res.json();
    _guestEventData = { ...data.event, id: eventId };

    // Sign into Firebase with the custom token so RTDB reads succeed
    if (data.customToken && _fbAuth) {
      try { await _fbAuth.signInWithCustomToken(data.customToken); }
      catch (e) { console.warn('[someday] guest Firebase sign-in error:', e.message); }
    }

    set({ page: 'event', eventId });
  } catch (e) {
    console.error('[someday] invite link error:', e.message);
  }
}

// ── Add-friend link handler ───────────────────────────────────────────────
// Handles URLs like  someday.app/?add={uid}  → traditional request (QR code)
function _handleAddFriendLink() {
  const params    = new URLSearchParams(window.location.search);
  const targetUid = params.get('add');
  if (!targetUid) return;
  history.replaceState(null, '', window.location.pathname);
  if (_currentUser) {
    _handleAddFriend(targetUid);
  } else {
    try { sessionStorage.setItem('someday_pending_add', targetUid); } catch {}
  }
}

// ── Connect-link handler ──────────────────────────────────────────────────
// Handles URLs like  someday.app/?connect={token}  → direct mutual friendship
let _pendingConnectToken  = null;
let _pendingConnectOwner  = null; // { ownerUid, ownerName }

function _handleConnectLink() {
  const params = new URLSearchParams(window.location.search);
  const token  = params.get('connect');
  if (!token) return;
  history.replaceState(null, '', window.location.pathname);
  if (_currentUser) {
    _loadConnectPreview(token);
  } else {
    try { sessionStorage.setItem('someday_pending_connect', token); } catch {}
  }
}

async function _loadConnectPreview(token) {
  if (!_currentUser) return;
  _pendingConnectToken  = token;
  _pendingConnectOwner  = null;
  render();
  try {
    const res = await fetch(`/.netlify/functions/friend-invite-link?token=${encodeURIComponent(token)}`);
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      _pendingConnectToken = null;
      render();
      if (d.error === 'Link expired') _showToast('Dieser Einladungslink ist abgelaufen. Bitte den Absender um einen neuen Link bitten.', true);
      else _showToast('Dieser Einladungslink ist ungültig oder wurde bereits verwendet.', true);
      return;
    }
    const preview = await res.json();
    // Check if this is own link (before showing sheet)
    if (preview.ownerUid === _currentUser.uid) {
      _pendingConnectToken = null;
      render();
      _showToast('Das ist dein eigener Einladungslink – teile ihn mit anderen.', true);
      return;
    }
    _pendingConnectOwner = preview;
    render();
  } catch (e) {
    _pendingConnectToken = null;
    render();
    _showToast('Einladungslink konnte nicht geprüft werden. Bitte überprüfe deine Verbindung.', true);
  }
}

function _dismissConnect() {
  _pendingConnectToken = null;
  _pendingConnectOwner = null;
  render();
}

async function _confirmConnect() {
  if (!_pendingConnectToken || !_currentUser) return;
  const token     = _pendingConnectToken;
  const ownerName = _pendingConnectOwner ? (_pendingConnectOwner.ownerName || 'deiner Kontaktperson') : 'deiner Kontaktperson';
  const btn = $('connect-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Wird verbunden…'; }
  try {
    const idToken = await _currentUser.getIdToken();
    const res = await fetch('/.netlify/functions/friend-invite-link', {
      method:  'POST',
      headers: { 'Authorization': `Bearer ${idToken}`, 'Content-Type': 'application/json' },
      body:    JSON.stringify({ action: 'accept', token }),
    });
    if (res.ok) {
      _pendingConnectToken = null;
      _pendingConnectOwner = null;
      const res2 = await fetch('/.netlify/functions/user-data', { headers: { 'Authorization': `Bearer ${idToken}` } });
      if (res2.ok) _userData = await res2.json();
      render();
      _showToast(`Du und ${ownerName} seid jetzt befreundet! 🎉`);
    } else {
      const d = await res.json().catch(() => ({}));
      _pendingConnectToken = null;
      _pendingConnectOwner = null;
      render();
      if (d.error === 'already_friends') _showToast('Ihr seid bereits befreundet.');
      else if (d.error === 'Link expired') _showToast('Dieser Einladungslink ist abgelaufen. Bitte einen neuen Link anfordern.', true);
      else if (d.error === 'Cannot connect with yourself') _showToast('Das ist dein eigener Einladungslink – teile ihn mit anderen.', true);
      else if (d.error === 'Invalid or expired link') _showToast('Dieser Einladungslink ist ungültig oder abgelaufen.', true);
      else _showToast(d.error || `Fehler beim Verbinden (HTTP ${res.status}).`, true);
    }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Freundschaft bestätigen'; }
    _showToast('Netzwerkfehler – bitte überprüfe deine Verbindung und versuche es erneut.', true);
  }
}

function _connectSheet() {
  const loaded    = !!_pendingConnectOwner;
  const ownerName = loaded ? esc(_pendingConnectOwner.ownerName || 'Jemand') : null;
  return `<div class="sheetbg" onclick="_dismissConnect()"><div class="sheet" onclick="event.stopPropagation()">
    <div class="between"><div class="eyebrow">EINLADUNG ✳</div><button class="iconbtn" onclick="_dismissConnect()">×</button></div>
    ${loaded
      ? `<h1 class="headline" style="margin:12px 0 4px">${ownerName} möchte sich mit dir verbinden!</h1>
         <p class="sub" style="margin:0 0 20px">Bestätige die Freundschaft – sie wird sofort für beide Seiten aktiv.</p>
         <button id="connect-confirm-btn" class="btn full dark" onclick="_confirmConnect()">Freundschaft bestätigen</button>`
      : `<h1 class="headline" style="margin:12px 0 4px">Einladung wird geprüft…</h1>
         <p class="sub" style="margin:0 0 20px">Einen Moment bitte.</p>
         <button class="btn full dark" disabled style="opacity:.5">Freundschaft bestätigen</button>`
    }
    <button class="btn secondary full" style="margin-top:8px" onclick="_dismissConnect()">Abbrechen</button>
  </div></div>`;
}

// ── Data refresh ──────────────────────────────────────────────────────────
async function _refreshUserData() {
  if (!_currentUser) return;
  try {
    const idToken = await _currentUser.getIdToken();
    const res = await fetch('/.netlify/functions/user-data', { headers: { 'Authorization': `Bearer ${idToken}` } });
    if (res.ok) { _userData = await res.json(); render(); }
  } catch (e) { console.warn('[someday] _refreshUserData:', e.message); }
}
