:root{--green:#65db70;--dark:#183b28;--muted:#68786d;--bg:#fafbf7;--line:#e6eae3;--pink:#ef6b82}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}#app{max-width:600px;margin:auto;min-height:100dvh;padding-bottom:calc(83px + env(safe-area-inset-bottom))}.header{position:sticky;top:0;z-index:20;background:#fafbf7f5;backdrop-filter:blur(16px);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f1f2ec}.logo{font-weight:900;font-size:27px;letter-spacing:-1.8px;color:#1388ff}.loc{font-size:11px;font-weight:800;color:#287e43;background:#e6f8e5;padding:9px 12px;border-radius:100px}.avatar{background:var(--dark);color:white;width:36px;height:36px;border-radius:50%;border:0;font-weight:700}.hrow{display:flex;align-items:center;gap:10px}.content{padding:22px 18px}.eyebrow{color:#289c4e;font-size:11px;letter-spacing:1.2px;font-weight:850;text-transform:uppercase}.headline{font-size:32px;line-height:1.08;letter-spacing:-1.4px;margin:9px 0 10px;font-weight:850}.sub{color:var(--muted);font-size:14px;line-height:1.5}.hero{background:var(--green);border-radius:21px;padding:23px;margin-bottom:20px}.hero h1{font-size:30px;letter-spacing:-1.2px;line-height:1.08;margin:9px 0}.search,.field{border:1px solid var(--line);background:white;border-radius:14px;padding:13px 15px;width:100%;outline:none;color:var(--dark)}.search:focus,.field:focus{border-color:#51c965}.filters{display:flex;gap:8px;overflow:auto;margin:14px 0 20px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #dfe5dd;background:white;border-radius:40px;padding:9px 15px;color:var(--dark);font-size:13px;font-weight:650}.chip.on{background:#d9f7d9;border-color:#59d66a}.section{font-size:20px;letter-spacing:-.6px;font-weight:800;margin:24px 0 14px}.card{border:1px solid var(-- d}.back{border:0;background:none;color:#277c42;font-weight:750;padding:0;margin:0 0 17px}.sheetbg{position:fixed;inset:0;background:#102f1c70;z-index:40;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:min(600px,100%);border-radius:25px 25px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.calendar-scroll{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:12px}.calendar{position:relative;min-width:520px;height:720px;background:repeating-linear-gradient(to bottom,#fff 0px,#fff 49px,#e9ece6 50px);margin-left:37px;margin-top:38px}.cal-head{display:grid;grid-template-columns:repeat(7,1fr);position:absolute;top:-38px;width:100%;height:38px}.cal-day{border:0;border-left:1px solid #e9ece6;background:white;font-size:12px;font-weight:700}.cal-line{position:absolute;top:0;bottom:0;width:1px;background:#edf0ea}.cal-time{position:absolute;left:-37px;font-size:10px;color:#839087;transform:translateY(-6px)}.cal-event{position:absolute;border:0;border-left:3px solid;border-radius:5px;text-align:left;padding:4px;font-size:10px;font-weight:700;overflow:hidden;line-height:1.25}.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.monthcell{min-height:65px;background:white;border:1px solid #eef0ea;border-radius:4px;padding:4px;font-size:12px;overflow:hidden}.monthlabel{font-size:9px;line-height:1.2;padding:3px;margin-top:3px;border-radius:3px;cursor:pointer}.toggle{display:flex;gap:7px;flex-wrap:wrap}.toggle button{border:1px solid #e0e5dc;background:white;border-radius:40px;padding:8px 10px;font-size:11px;font-weight:750}.toggle button.on{background:#e3f7e0;border-color:#66d776}.mutedbox{background:#e7f7e4;border-radius:14px;padding:16px}.warn{background:#fff2d8;color:#795b2b;border-radius:12px;padding:13px;font-size:13px}.small{font-size:12px;color:var(--muted)}.empty{background:white;border:1px dashed #cddbcc;border-radius:16px;padding:25px;text-align:center}.profiletop{background:var(--dark);color:white;border-radius:20px;padding:23px;margin-bottom:20px}.profiletop .sub{color:#b7cbbd}h2{letter-spacing:-.6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .photo{height:120px}.grid2 .card-title{font-size:15px}.footnote{font-size:11px;color:#88958b;margin-top:20px;line-height:1.5}.switch{display:grid;grid-template-columns:1fr 1fr;background:#e9eee7;border-radius:14px;padding:4px;margin:16px 0}.switch button{border:0;background:transparent;padding:12px;border-radius:11px;color:#617168;font-weight:800}.switch button.on{background:white;color:var(--dark);box-shadow:0 1px 5px #00000013}.realmap{height:min(60vh,490px);min-height:340px;border-radius:18px;overflow:hidden;border:1px solid #dfe8dc}.mapinfo{margin-top:12px;background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.mapinfo img{width:92px;height:92px;object-fit:cover}.mapbadge{background:var(--green);border:2px solid var(--dark);border-radius:50%;width:35px;height:35px;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 8px #0002}.createfloat{position:fixed;bottom:calc(85px + env(safe-area-inset-bottom));right:max(calc((100vw - 580px)/2),18px);z-index:29;border:0;background:var(--dark);color:white;border-radius:50%;height:53px;width:53px;font-size:32px;box-shadow:0 5px 20px #153b283d}.formlabel{font-size:12px;font-weight:800;margin:10px 0 6px;display:block}.checks{display:grid;gap:8px}.checkrow{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}.checkrow input{accent-color:#36ad52;width:19px;height:19px}.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:20px;background:#e3f8e2}.leaflet-container{font-family:inherit}.leaflet-popup-content-wrapper{border-radius:13px}.leaflet-popup-content{font-size:13px}
</style></head><body><div id="app"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>
let A=[{id:'pottery',name:'Pottery & painting',title:'Make something with your hands.',provider:'Studio Clay',category:'Creative',location:'Ehrenfeld',price:'€35',lat:50.9496,lng:6.9197,img:'https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=1100&q=85',tag:'GET CREATIVE'},{id:'supper',name:'The supper club',title:'Good food. Better company.',provider:'The Supper Table',category:'Food',location:'Belgisches Viertel',price:'€45',lat:50.9416,lng:6.9324,img:'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1100&q=85',tag:'AROUND THE TABLE'},{id:'yoga',name:'Sunday yoga',title:'Slow mornings, good energy.',provider:'Flow Studio',category:'Wellness',location:'Südstadt',price:'€18',lat:50.9195,lng:6.9573,img:'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=1100&q=85',tag:'SLOW DOWN'},{id:'run',name:'Social run & coffee',title:'Find your people, one run at a time.',provider:'Cologne Run Club',category:'Sport',location:'Rheinauhafen',price:'Free',lat:50.927,lng:6.965,img:'https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=1100&q=85',tag:'MOVE TOGETHER'}];
const store='someday-pwa-v1',initial={tab:'Discover',page:'home',category:'All',search:'',map:false,selected:'pottery',space:'Weekend Crew',spaceTab:'Ideas',profileTab:'Saved',saved:{pottery:['Weekend Crew','Just for me'],yoga:['Just for me']},plans:[],week:0,calView:'Week',layers:['Personal','Weekend Crew','Run Club'],date:'2026-10-23',choices:['2026-10-23','2026-10-24'],mode:'quick',step:'choose',rsvp:'Going',providerView:'List',sheet:false,settings:false,connections:[]};let S={...initial,...JSON.parse(localStorage.getItem(store)||'{}')};let draft=[],D={},mapInstance=null,mapMarkers=[],mapFocus=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),act=()=>A.find(a=>a.id===S.selected)||A[0],save=()=>localStorage.setItem(store,JSON.stringify(S));const set=(obj,scroll=true)=>{Object.assign(S,obj);save();render();if(scroll)window.scrollTo(0,0)};const nav=t=>set({tab:t,page:'home',sheet:false,settings:false});const openActivity=id=>set({selected:id,page:'activity'});const goBack=()=>set({page:S.page==='session'?'provider':S.page==='provider'?'activity':S.page==='planning'?'space':'home',sheet:false});const button=(label,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${label}</button>`;const header=()=>`<header class="header"><button onclick="nav('Discover')" style="border:0;background:none;padding:0" class="logo">someday<span style="color:#54d86b">.</span></button><div class="hrow"><span class="loc">COLOGNE ⌖</span><button class="avatar" onclick="nav('Profile')">K</button></div></header>`;const bottom=()=>`<nav class="bottom">${[['Discover','⌕'],['Calendar','▦'],['Spaces','♧'],['Profile','◉']].map(([t,ic])=>`<button class="nav ${S.tab===t?'active':''}" onclick="nav('${t}')"><span class="sym">${ic}</span>${t}</button>`).join('')}</nav>`;const filters=()=>`<div class="filters">${['All','Creative','Food','Wellness','Sport'].map(c=>`<button class="chip ${S.category===c?'on':''}" onclick="set({category:'${c}'},false)">${c}</button>`).join('')}</div>`;const filtered=()=>A.filter(a=>(S.category==='All'||a.category===S.category)&&(`${a.name} ${a.title} ${a.provider} ${a.location}`.toLowerCase().includes(S.search.toLowerCase())));
const card=(a,compact=false)=>`<article class="card"><div onclick="openActivity('${a.id}')" style="cursor:pointer"><img class="photo" ${compact?'style="height:130px"':''} src="${a.img}" alt="${esc(a.name)}" loading="lazy"><div class="card-body"><div class="eyebrow">${a.tag}</div><div class="card-title">${esc(compact?a.name:a.title)}</div><div class="meta">${esc(a.name)} · ${esc(a.provider)}</div><div class="between" style="margin-top:10px"><span class="meta">⌖ ${esc(a.location)}</span><strong>${a.price}</strong></div></div></div><div class="between" style="padding:0 17px 15px"><span class="small">${(S.saved[a.id]||[]).length?`Saved to ${(S.saved[a.id]||[]).length} list(s)`:'Something for someday?'}</span><button class="iconbtn" onclick="openSave('${a.id}')">${(S.saved[a.id]||[]).length?'♥':'+'}</button></div></article>`;
const discovery=()=>`<div class="content"><div class="eyebrow">LESS SCROLLING. MORE LIVING. ✳</div><h1 class="headline">What are we doing next?</h1><p class="sub">Find your next “remember when”.</p><input id="search" class="search" placeholder="Try pottery, supper clubs…" value="${esc(S.search)}" oninput="S.search=this.value;save();refreshDiscovery()">${filters()}<div class="switch" aria-label="Discover view"><button class="${!S.map?'on':''}" onclick="set({map:false},false)">Explore</button><button class="${S.map?'on':''}" onclick="set({map:true},false)">Map</button></div>${S.map?`<div id="realmap" class="realmap" aria-label="Interactive activity map of Cologne"></div><div id="map-info"></div><p class="footnote">Interactive OpenStreetMap · Provider locations are approximate demo locations, not verified addresses.</p>`:`<h2 class="section">Worth leaving the house for.</h2><div id="results">${resultCards()}</div>`}</div>`;function resultCards(){let arr=filtered();return arr.length?arr.map(a=>card(a)).join(''):'<div class="empty">No experiences found. Try another search.</div>'}function refreshDiscovery(){if(S.map)drawPins();else if($('results'))$('results').innerHTML=resultCards()}
function initMap(){if(!S.map||S.tab!=='Discover'||S.page!=='home'||!$('realmap'))return;if(typeof L==='undefined'){$('realmap').innerHTML='<div class="empty">Map could not load. Check your internet connection and refresh.</div>';return}mapInstance=L.map('realmap',{zoomControl:true}).setView([50.936,6.947],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(mapInstance);drawPins();setTimeout(()=>mapInstance&&mapInstance.invalidateSize(),100)}function drawPins(){if(!mapInstance)return;mapMarkers.forEach(m=>mapInstance.removeLayer(m));mapMarkers=[];filtered().forEach((a,i)=>{if(a.lat==null||a.lng==null)return;let ico=L.divIcon({className:'',html:`<div class="mapbadge" style="background:${['#65db70','#ffe566','#f6a2b4','#d9caff'][A.indexOf(a)]}">${['✳','✦','♥','↗'][A.indexOf(a)]}</div>`,iconSize:[35,35],iconAnchor:[18,18]});let m=L.marker([a.lat,a.lng],{icon:ico}).addTo(mapInstance).on('click',()=>showMapCard(a.id));mapMarkers.push(m)});if(mapFocus&&filtered().some(a=>a.id===mapFocus))showMapCard(mapFocus);else if($('map-info'))$('map-info').innerHTML=filtered().length?'Tap a pin to explore an activity.':'<div class="empty">No matching activities on this map.</div>'}function showMapCard(id){mapFocus=id;let a=A.find(a=>a.id===id);if(!a||!$('map-info'))return;$('map-info').innerHTML=`<div class="mapinfo"><div class="hrow" style="gap:12px"><img src="${a.img}" alt=""><div style="flex:1;padding:8px 6px 8px 0"><strong>${esc(a.name)}</strong><div class="small">${esc(a.provider)} · ${esc(a.location)}</div><div class="small">${a.price}</div></div></div><div class="hrow" style="padding:0 10px 10px">${button('View activity →',`openActivity('${a.id}')`,'full')}${button('Provider',`set({selected:'${a.id}',page:'provider'})`,'secondary')}</div></div>`}
const detail=()=>{let a=act();return `<div><img class="photo" style="height:270px" src="${a.img}" alt="${esc(a.name)}"><div class="content"><button class="back" onclick="goBack()">← Back</button><div class="eyebrow">${a.tag}</div><h1 class="headline">${esc(a.name)}</h1><p class="sub">${esc(a.provider)} · ${esc(a.location)} · From ${a.price}</p><p class="sub">Try something new, meet your people, and make a day worth remembering.</p><div class="stack">${button('♡ Save for someday',`openSave('${a.id}')`,'full')}${button('Explore provider →',`set({page:'provider',providerView:'List'})`,'secondary full')}${button('Plan with Weekend Crew',`startPlan('${a.id}','Weekend Crew')`,'secondary full')}</div></div></div>`};const provider=()=>{let a=act();return `<div class="content"><button class="back" onclick="goBack()">← Back to activity</button><div class="eyebrow">EXPERIENCE PROVIDER</div><h1 class="headline">${esc(a.provider)}</h1><p class="sub">${a.location} · Cologne</p><img class="photo" style="border-radius:18px;margin:16px 0" src="${a.img}" alt="${esc(a.provider)}"><h2 class="section">Upcoming sessions</h2>${segment('providerView',['List','Calendar'])}${S.providerView==='Calendar'?`<div class="monthgrid" style="margin:15px 0">${[23,24,27].map(d=>`<button class="rowcard" style="padding:10px;text-align:center;background:#e2f8df" onclick="set({date:'2026-10-${d}',page:'session'})">Oct ${d}</button>`).join('')}</div>`:''}<div class="stack" style="margin-top:15px">${[['23','Fri 23 Oct · 18:30'],['24','Sat 24 Oct · 11:00'],['27','Tue 27 Oct · 17:00']].map(([d,t])=>`<button class="rowcard between" onclick="set({date:'2026-10-${d}',page:'session'})"><span><strong>${t}</strong><br><span class="small">${a.name} · ${a.price}</span></span><strong>→</strong></button>`).join('')}</div></div>`};const session=()=>{let a=act();return `<div class="content"><button class="back" onclick="goBack()">← Back to sessions</button><div class="eyebrow">UPCOMING SESSION</div><h1 class="headline">${a.name}</h1><div class="mutedbox"><strong>${S.date} · 18:30</strong><p>${a.provider} · ${a.location}</p><strong>${a.price} per person</strong></div><div class="stack" style="margin-top:18px">${button('Book a spot →',`set({page:'booking'})`,'full')}${button('Invite friends',`startPlan('${a.id}','Weekend Crew')`,'secondary full')}${button('Add to my calendar',`addPersonalSession()`,'secondary full')}</div></div>`};function addPersonalSession(){S.plans.push({id:Date.now(),activity:S.selected,title:act().name,space:'Personal',date:S.date,start:'18:30',end:'20:00',status:'Personal',rsvp:'Going',booked:false,custom:false});set({tab:'Calendar',page:'home'})}const segment=(key,options)=>`<div class="seg">${options.map(v=>`<button class="${S[key]===v?'active':''}" onclick="set({${key}:'${v}'},false)">${v}</button>`).join('')}</div>`;
function openSave(id){S.selected=id;draft=[...(S.saved[id]||[])];set({sheet:'save'},false)}function toggleDraft(t){draft=draft.includes(t)?draft.filter(x=>x!==t):[...draft,t];render()}function commitSave(){S.saved[S.selected]=[...draft];set({sheet:false})}const saveSheet=()=>`<div class="sheetbg" onclick="set({sheet:false},false)"><div class="sheet" onclick="event.stopPropagation()"><div class="between"><div class="eyebrow">SAVE FOR SOMEDAY ✳</div><button class="iconbtn" onclick="set({sheet:false},false)">×</button></div><h1 class="headline">Keep this one close.</h1><p class="sub">${act().name} can live in more than one list.</p><div class="stack">${['Just for me','Weekend Crew','Run Club'].map(t=>`<button class="rowcard ${draft.includes(t)?'selected':''} between" onclick="toggleDraft('${t}')"><strong>${t}</strong><span>${draft.includes(t)?'✓':'○'}</span></button>`).join('')}${button('Save choices →','commitSave()','full')}</div></div></div>`;

// ── Firebase activity integration ─────────────────────────────────────────
// Activities are loaded via the /.netlify/functions/activities endpoint.
// This works in all environments (local emulator, Codespaces, production)
// because the Netlify function uses the Admin SDK server-side, which reads
// FIREBASE_DATABASE_EMULATOR_HOST automatically — no hostname detection needed.

// Maps an RTDB activity record to the PWA activity shape.
// All new fields (tagline, eyebrow, lat, lng) are optional — old records still work.
function _toActivity(key, d) {
  const imgs = d.imageUrls;
  const img = !imgs ? ''
    : typeof imgs === 'string' ? imgs
    : Array.isArray(imgs) ? (imgs[0] || '')
    : (imgs['0'] || Object.values(imgs)[0] || '');
  return {
    id: key,
    name: d.title || key,
    title: d.tagline || '',
    provider: d.providerName || d.city || '',
    category: d.category || 'Other',
    location: d.district || (typeof d.location === 'string' ? d.location : '') || d.city || '',
    price: d.price || '',
    lat: d.lat || null,
    lng: d.lng || null,
    img,
    tag: d.eyebrow || (d.category ? d.category.toUpperCase() : ''),
  };
}

// Loads active activities via the Netlify function (server-side Admin SDK).
// On success, replaces the demo A array. On error or empty result, demo data
// stays visible (never a blank screen).
async function _loadActivities() {
  try {
    const res = await fetch('/.netlify/functions/activities');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const rows = Object.entries(data.activities || {})
      .map(([key, val]) => _toActivity(key, val));
    if (rows.length > 0) {
      A.splice(0, A.length, ...rows);
      if (!A.find(a => a.id === S.selected)) S.selected = A[0].id;

      render();
