<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Someday Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --amber:  #F5A623;
      --bg:     #F7F5F2;
      --card:   #FFFFFF;
      --text:   #1A1612;
      --muted:  #8A8078;
      --border: #EDE8E0;
      --pink:   #E8534A;
      --green:  #2E9E6B;
      --blue:   #3B82F6;
      --shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ── */
    #screen-login {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: var(--card); border-radius: 20px;
      padding: 48px 40px; width: 100%; max-width: 400px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 18px;
    }
    .login-logo {
      font-family: Georgia, serif; font-size: 1.75rem; font-weight: 700;
      color: var(--amber); text-align: center; letter-spacing: -.3px;
    }
    .login-logo span { color: var(--text); font-size: 1rem; font-weight: 500;
                       font-family: inherit; display: block; margin-top: 4px; }
    .login-box input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1.5px solid var(--border); font-size: 1rem;
      background: var(--bg); outline: none;
    }
    .login-box input:focus { border-color: var(--amber); }
    .btn-primary {
      width: 100%; padding: 13px; border-radius: 12px;
      background: var(--amber); border: none; color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .login-err { font-size: .875rem; color: var(--pink); text-align: center; }

    /* ── APP SHELL ── */
    #screen-app { display: none; height: 100vh; flex-direction: column; }

    .topbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 20; flex-shrink: 0;
    }
    .topbar-logo {
      font-family: Georgia, serif; font-size: 1.1rem; font-weight: 700;
      color: var(--amber); letter-spacing: -.2px;
    }
    .topbar-logo span { color: var(--muted); font-size: .875rem;
                        font-family: inherit; margin-left: 8px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .btn-sm {
      padding: 6px 14px; border-radius: 9px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: .875rem; font-weight: 500; cursor: pointer; color: var(--muted);
    }
    .btn-sm:hover { color: var(--pink); border-color: var(--pink); }

    .app-body {
      display: flex; flex: 1; overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 340px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      background: var(--card); overflow: hidden;
    }
    .sidebar-head {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-head h2 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }

    .filter-tabs {
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .filter-tab {
      padding: 5px 10px; border-radius: 8px; font-size: .8125rem; font-weight: 500;
      cursor: pointer; border: 1.5px solid transparent; transition: all .12s;
      color: var(--muted); background: var(--bg);
    }
    .filter-tab.active { background: var(--amber); color: #fff; border-color: var(--amber); }
    .filter-tab:hover:not(.active) { border-color: var(--border); color: var(--text); }

    .suggestion-list {
      flex: 1; overflow-y: auto; padding: 8px;
    }
    .suggestion-item {
      padding: 12px 14px; border-radius: 12px; cursor: pointer;
      border: 1.5px solid transparent; transition: all .12s; margin-bottom: 4px;
    }
    .suggestion-item:hover { background: var(--bg); }
    .suggestion-item.selected { background: #FFF8EE; border-color: var(--amber); }
    .sug-title { font-size: .9375rem; font-weight: 600; }
    .sug-meta  { font-size: .8125rem; color: var(--muted); margin-top: 3px; }
    .status-badge {
      display: inline-block; font-size: .7rem; font-weight: 700;
      padding: 2px 7px; border-radius: 50px; text-transform: uppercase; letter-spacing: .04em;
    }
    .status-badge.submitted  { background: #DBEAFE; color: #1D4ED8; }
    .status-badge.draft      { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
    .status-badge.approved   { background: #D1FAE5; color: #065F46; }
    .status-badge.rejected   { background: #FEE2E2; color: #991B1B; }

    .empty-state {
      text-align: center; padding: 40px 20px; color: var(--muted); font-size: .9rem;
    }

    /* ── DETAIL PANEL ── */
    .detail-panel {
      flex: 1; overflow-y: auto; padding: 24px 28px;
    }
    .detail-placeholder {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--muted); font-size: .9375rem;
    }

    .detail-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin-bottom: 20px;
    }
    .detail-title { font-size: 1.375rem; font-weight: 700; line-height: 1.25; }
    .detail-meta  { font-size: .875rem; color: var(--muted); margin-top: 4px; }

    .detail-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-approve {
      padding: 9px 18px; border-radius: 10px;
      background: var(--green); border: none; color: #fff;
      font-size: .9rem; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .btn-approve:hover { opacity: .85; }
    .btn-approve:disabled { opacity: .45; cursor: not-allowed; }
    .btn-reject {
      padding: 9px 18px; border-radius: 10px;
      background: var(--card); border: 1.5px solid var(--pink); color: var(--pink);
      font-size: .9rem; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .btn-reject:hover { background: #FEE2E2; }
    .btn-reject:disabled { opacity: .45; cursor: not-allowed; }

    .detail-section { margin-bottom: 20px; }
    .detail-section-title {
      font-size: .75rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px;
    }
    .field-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .field-item { display: flex; flex-direction: column; gap: 2px; }
    .field-label { font-size: .8125rem; color: var(--muted); }
    .field-value { font-size: .9375rem; font-weight: 500; word-break: break-word; }
    .field-link  { color: var(--blue); text-decoration: none; }
    .field-link:hover { text-decoration: underline; }

    .note-input-wrap { margin: 16px 0 12px; }
    .note-input-wrap label { font-size: .875rem; font-weight: 500; display: block; margin-bottom: 6px; }
    .note-input-wrap textarea {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid var(--border); font-size: .9rem;
      background: var(--bg); resize: vertical; min-height: 72px; outline: none;
    }
    .note-input-wrap textarea:focus { border-color: var(--amber); }

    .action-feedback {
      padding: 10px 14px; border-radius: 10px; font-size: .875rem;
      margin-top: 10px; display: none;
    }
    .action-feedback.ok  { background: #D1FAE5; color: #065F46; }
    .action-feedback.err { background: #FEE2E2; color: #991B1B; }

    /* ── AUDIT LOG ── */
    .audit-list { display: flex; flex-direction: column; gap: 8px; }
    .audit-item {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 12px; background: var(--bg); border-radius: 10px;
    }
    .audit-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px;
    }
    .audit-dot.approve { background: var(--green); }
    .audit-dot.reject  { background: var(--pink); }
    .audit-dot.submit  { background: var(--blue); }
    .audit-dot.set_role { background: var(--amber); }
    .audit-dot.bootstrap_superadmin { background: var(--amber); }
    .audit-text { font-size: .875rem; line-height: 1.4; }
    .audit-ts   { font-size: .8125rem; color: var(--muted); }

    /* ── SPINNER ── */
    .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid var(--border); border-top-color: var(--amber);
      animation: spin .7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .sidebar { width: 100%; height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
      .app-body { flex-direction: column; }
      .detail-panel { padding: 16px; }
      .field-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="screen-login">
  <div class="login-box">
    <div class="login-logo">someday<span>Studio — Redaktion</span></div>
    <input type="email"    id="inp-email" placeholder="E-Mail-Adresse"
      onkeydown="if(event.key==='Enter') document.getElementById('inp-pw').focus()">
    <input type="password" id="inp-pw" placeholder="Passwort"
      onkeydown="if(event.key==='Enter') doLogin()">
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Anmelden</button>
    <p class="login-err" id="login-err" style="display:none"></p>
  </div>
</div>

<!-- ══════════════ APP ══════════════ -->
<div id="screen-app">
  <div class="topbar">
    <div class="topbar-logo">someday<span id="role-badge"></span></div>
    <div class="topbar-right">
      <span id="user-email" style="font-size:.8125rem;color:var(--muted)"></span>
      <button class="btn-sm" onclick="doLogout()">Abmelden</button>
    </div>
  </div>

  <div class="app-body">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-head">
        <h2>Vorschläge</h2>
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all"       onclick="setFilter('all')">Alle</button>
          <button class="filter-tab"        data-filter="submitted" onclick="setFilter('submitted')">Eingereicht</button>
          <button class="filter-tab"        data-filter="draft"     onclick="setFilter('draft')">Entwürfe</button>
          <button class="filter-tab"        data-filter="approved"  onclick="setFilter('approved')">Genehmigt</button>
          <button class="filter-tab"        data-filter="rejected"  onclick="setFilter('rejected')">Abgelehnt</button>
        </div>
      </div>
      <div class="suggestion-list" id="suggestion-list">
        <div class="empty-state"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-placeholder">Einen Vorschlag auswählen</div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// ── Firebase init ──────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyAuapMaw8Tpw0HC_TlMUvCbw0PPfWOaL-Y",
  authDomain:        "vivo-mvp.firebaseapp.com",
  databaseURL:       "https://vivo-mvp-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "vivo-mvp",
  storageBucket:     "vivo-mvp.firebasestorage.app",
  messagingSenderId: "662578995457",
  appId:             "1:662578995457:web:ee580f001d212cd73d7b00"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

// ── State ──────────────────────────────────────────────────────────────────
let _user        = null;
let _idToken     = null;
let _role        = null;
let _suggestions = {};
let _filter      = 'all';
let _selected    = null;
let _sugListener = null;

// ── Auth ───────────────────────────────────────────────────────────────────
auth.onAuthStateChanged(async user => {
  if (!user) {
    showLogin();
    return;
  }
  const result = await user.getIdTokenResult(true);
  const role = result.claims.studioRole;
  if (!role) {
    await auth.signOut();
    showLoginError('Kein Studio-Zugriff für diesen Account.');
    return;
  }
  _user    = user;
  _idToken = result.token;
  _role    = role;
  showApp();
});

async function doLogin() {
  const email = document.getElementById('inp-email').value.trim();
  const pw    = document.getElementById('inp-pw').value;
  const btn   = document.getElementById('login-btn');
  if (!email || !pw) { showLoginError('E-Mail und Passwort erforderlich.'); return; }
  btn.disabled = true; btn.textContent = '…';
  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch (err) {
    showLoginError(err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found'
      ? 'E-Mail oder Passwort falsch.'
      : err.message);
    btn.disabled = false; btn.textContent = 'Anmelden';
  }
}

async function doLogout() {
  if (_sugListener) { db.ref('suggestions').off('value', _sugListener); _sugListener = null; }
  await auth.signOut();
}

function showLogin() {
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('screen-app').style.display   = 'none';
  document.getElementById('login-btn').disabled = false;
  document.getElementById('login-btn').textContent = 'Anmelden';
}

function showLoginError(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg; el.style.display = 'block';
}

function showApp() {
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-app').style.display   = 'flex';
  document.getElementById('user-email').textContent = _user.email || '';
  document.getElementById('role-badge').textContent = '· ' + _role;
  loadSuggestions();
}

// ── Load suggestions ───────────────────────────────────────────────────────
function loadSuggestions() {
  if (_sugListener) { db.ref('suggestions').off('value', _sugListener); }
  _sugListener = db.ref('suggestions').on('value', snap => {
    _suggestions = snap.val() || {};
    renderList();
  });
}

// ── Filter ─────────────────────────────────────────────────────────────────
function setFilter(f) {
  _filter = f;
  document.querySelectorAll('.filter-tab').forEach(el =>
    el.classList.toggle('active', el.dataset.filter === f)
  );
  renderList();
}

// ── Render list ────────────────────────────────────────────────────────────
function renderList() {
  const entries = Object.entries(_suggestions)
    .filter(([, s]) => _filter === 'all' || s.status === _filter)
    .sort(([, a], [, b]) => (b.createdAt || 0) - (a.createdAt || 0));

  const container = document.getElementById('suggestion-list');
  if (!entries.length) {
    container.innerHTML = '<div class="empty-state">Keine Vorschläge gefunden.</div>';
    return;
  }
  container.innerHTML = entries.map(([id, s]) => `
    <div class="suggestion-item${_selected === id ? ' selected' : ''}"
         onclick="selectSuggestion('${esc(id)}')">
      <div class="sug-title">${esc(s.title || '—')}</div>
      <div class="sug-meta">
        ${esc(s.city || '')}${s.category ? ' · ' + esc(s.category) : ''}
        <span class="status-badge ${esc(s.status || 'draft')}">${esc(s.status || 'draft')}</span>
      </div>
    </div>`).join('');
}

// ── Select suggestion ──────────────────────────────────────────────────────
async function selectSuggestion(id) {
  _selected = id;
  renderList();
  const s = _suggestions[id];
  if (!s) return;

  // Load audit log entries for this suggestion
  let auditEntries = [];
  try {
    const snap = await db.ref('studioAuditLog').orderByChild('suggestionId').equalTo(id).once('value');
    const raw = snap.val() || {};
    auditEntries = Object.values(raw).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  } catch(e) { /* not critical */ }

  const canAct = ['editor', 'superadmin'].includes(_role);
  const isSubmitted = s.status === 'submitted';

  document.getElementById('detail-panel').innerHTML = `
    <div>
      <div class="detail-header">
        <div>
          <div class="detail-title">${esc(s.title || '—')}</div>
          <div class="detail-meta">
            <span class="status-badge ${esc(s.status || 'draft')}">${esc(s.status || 'draft')}</span>
            ${s.city ? ' · ' + esc(s.city) : ''}
            ${s.category ? ' · ' + esc(s.category) : ''}
          </div>
        </div>
        ${canAct && isSubmitted ? `
        <div class="detail-actions">
          <button class="btn-approve" id="btn-approve" onclick="doApprove('${esc(id)}')">✓ Freigeben</button>
          <button class="btn-reject"  id="btn-reject"  onclick="doReject('${esc(id)}')">✕ Ablehnen</button>
        </div>` : ''}
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Inhalt</div>
        <div style="font-size:.9375rem;line-height:1.55;color:var(--text)">${esc(s.description || '—')}</div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Details</div>
        <div class="field-grid">
          ${fieldRow('Anbieter', s.providerName)}
          ${fieldRow('Stadt', s.city)}
          ${fieldRow('Bezirk', s.district)}
          ${fieldRow('Adresse', s.location?.address)}
          ${fieldRow('Preis', s.price ? fmtPrice(s.price) : null)}
          ${fieldRow('Buchungslink', s.bookingUrl, true)}
          ${fieldRow('Zeitplan', s.schedule ? fmtSchedule(s.schedule) : null)}
          ${fieldRow('Instagram', s.instagram ? '@' + s.instagram : null)}
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Quellen</div>
        ${s.sources && s.sources.length ? s.sources.map(url =>
          `<div style="margin-bottom:4px"><a class="field-link" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>`
        ).join('') : '<span style="color:var(--muted);font-size:.875rem">Keine Quellen angegeben</span>'}
        ${s.website ? `<div style="margin-top:6px"><a class="field-link" href="${esc(s.website)}" target="_blank" rel="noopener">Website: ${esc(s.website)}</a></div>` : ''}
      </div>

      ${canAct && isSubmitted ? `
      <div class="detail-section">
        <div class="detail-section-title">Aktion</div>
        <div class="note-input-wrap">
          <label for="action-note">Notiz (optional für Freigabe, Pflicht für Ablehnung)</label>
          <textarea id="action-note" placeholder="Begründung oder Hinweis…"></textarea>
        </div>
        <div class="action-feedback" id="action-feedback"></div>
      </div>` : ''}

      ${s.reviewNotes ? `
      <div class="detail-section">
        <div class="detail-section-title">Prüfnotiz</div>
        <div style="font-size:.9rem;color:var(--muted)">${esc(s.reviewNotes)}</div>
      </div>` : ''}

      <div class="detail-section">
        <div class="detail-section-title">Änderungsprotokoll</div>
        ${renderAuditLog(auditEntries)}
      </div>
    </div>`;
}

function fieldRow(label, value, isLink = false) {
  if (!value) return '';
  const display = isLink
    ? `<a class="field-link" href="${esc(value)}" target="_blank" rel="noopener">${esc(value)}</a>`
    : `<span class="field-value">${esc(value)}</span>`;
  return `<div class="field-item"><span class="field-label">${esc(label)}</span>${display}</div>`;
}

function fmtPrice(p) {
  if (!p) return null;
  if (p.type === 'free') return 'Kostenlos';
  if (p.amount) return `${p.amount} ${p.currency || 'EUR'}${p.note ? ' · ' + p.note : ''}`;
  return p.type || '—';
}

function fmtSchedule(s) {
  if (!s) return null;
  const days = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  const dayStr = s.daysOfWeek ? s.daysOfWeek.map(d => days[d]).join(', ') : '';
  return `${s.type === 'recurring' ? 'Regelmäßig' : 'Einmalig'}${dayStr ? ' · ' + dayStr : ''}${s.time ? ' · ' + s.time : ''}${s.note ? ' · ' + s.note : ''}`;
}

function renderAuditLog(entries) {
  if (!entries.length) return '<span style="color:var(--muted);font-size:.875rem">Noch keine Einträge</span>';
  return `<div class="audit-list">${entries.map(e => `
    <div class="audit-item">
      <div class="audit-dot ${esc(e.action || '')}"></div>
      <div>
        <div class="audit-text">${auditLabel(e)}</div>
        <div class="audit-ts">${e.timestamp ? new Date(e.timestamp).toLocaleString('de-DE') : '—'}</div>
      </div>
    </div>`).join('')}</div>`;
}

function auditLabel(e) {
  const actor = e.actorEmail || e.actorUid || 'unbekannt';
  if (e.action === 'approve')   return `Freigegeben von ${esc(actor)}${e.details ? ' — ' + esc(e.details) : ''}`;
  if (e.action === 'reject')    return `Abgelehnt von ${esc(actor)} — ${esc(e.details || '')}`;
  if (e.action === 'submit')    return `Eingereicht von ${esc(actor)}`;
  if (e.action === 'set_role')  return `Rolle geändert von ${esc(actor)}: ${esc(e.details || '')}`;
  return `${esc(e.action)} von ${esc(actor)}`;
}

// ── Approve ────────────────────────────────────────────────────────────────
async function doApprove(id) {
  const notes = document.getElementById('action-note')?.value.trim() || '';
  setActing(true);
  try {
    _idToken = await _user.getIdToken(true);
    const result = await callFunction('studio-approve', { suggestionId: id, notes });
    if (result.activityId) {
      showFeedback('ok', result.idempotent
        ? `Bereits freigegeben. Aktivität: ${result.activityId}`
        : `✓ Freigegeben. Aktivität: ${result.activityId}`);
    } else {
      showFeedback('err', result.error || 'Unbekannter Fehler');
    }
  } catch(err) {
    showFeedback('err', err.message || 'Netzwerkfehler');
  }
  setActing(false);
}

// ── Reject ─────────────────────────────────────────────────────────────────
async function doReject(id) {
  const reason = document.getElementById('action-note')?.value.trim();
  if (!reason) {
    showFeedback('err', 'Bitte eine Begründung für die Ablehnung eingeben.');
    return;
  }
  setActing(true);
  try {
    _idToken = await _user.getIdToken(true);
    const result = await callFunction('studio-reject', { suggestionId: id, reason });
    if (result.ok) {
      showFeedback('ok', '✓ Abgelehnt und archiviert.');
    } else {
      showFeedback('err', result.error || 'Unbekannter Fehler');
    }
  } catch(err) {
    showFeedback('err', err.message || 'Netzwerkfehler');
  }
  setActing(false);
}

function setActing(acting) {
  const ba = document.getElementById('btn-approve');
  const br = document.getElementById('btn-reject');
  if (ba) ba.disabled = acting;
  if (br) br.disabled = acting;
}

function showFeedback(type, msg) {
  const el = document.getElementById('action-feedback');
  if (!el) return;
  el.textContent = msg;
  el.className = `action-feedback ${type}`;
  el.style.display = 'block';
}

// ── Netlify Function call ──────────────────────────────────────────────────
async function callFunction(name, body) {
  const res = await fetch(`/.netlify/functions/${name}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${_idToken}`,
    },
    body: JSON.stringify(body),
  });
  return res.json();
}

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
