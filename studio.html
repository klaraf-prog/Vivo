<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Someday Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --amber:   #F5A623;
      --amber-l: #FFF3DC;
      --bg:      #F7F5F2;
      --card:    #FFFFFF;
      --text:    #1A1612;
      --muted:   #8A8078;
      --border:  #EDE8E0;
      --pink:    #E8534A;
      --green:   #2E9E6B;
      --blue:    #3B82F6;
      --purple:  #8B5CF6;
      --shadow:  0 2px 12px rgba(0,0,0,.08);
      --radius:  14px;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ── */
    #login-screen {
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
    }
    .login-box {
      background: var(--card); border-radius: 20px;
      padding: 48px 40px; width: 100%; max-width: 380px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 18px;
    }
    .login-logo { font-family: Georgia, serif; font-size: 2rem; font-weight: 700;
                  text-align: center; color: var(--amber); letter-spacing: -.5px; }
    .login-sub  { font-size: .9rem; color: var(--muted); text-align: center; margin-top: -8px; }
    .login-box input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1.5px solid var(--border); font-size: 1rem;
      background: var(--bg); outline: none; transition: border-color .15s;
    }
    .login-box input:focus { border-color: var(--amber); }
    .login-box button {
      width: 100%; padding: 13px; border-radius: 12px;
      background: var(--amber); border: none; color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    .login-box button:hover { opacity: .88; }
    .login-error { font-size: .875rem; color: var(--pink); text-align: center; min-height: 1.2em; }

    /* ── DASHBOARD ── */
    #dashboard { display: none; }

    .top-bar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px; position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
    }
    .top-logo { font-family: Georgia, serif; font-weight: 700; font-size: 1.125rem;
                color: var(--text); letter-spacing: -.3px; }
    .top-logo span { color: var(--amber); }
    .top-right { display: flex; align-items: center; gap: 12px; }
    .top-user { font-size: .875rem; color: var(--muted); }
    .top-badge {
      font-size: .75rem; font-weight: 700; padding: 2px 8px;
      border-radius: 50px; background: var(--amber-l); color: #9a6000;
    }
    .btn-sm {
      padding: 6px 14px; border-radius: 9px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: .875rem; font-weight: 500; cursor: pointer; color: var(--muted);
      transition: border-color .15s, color .15s;
    }
    .btn-sm:hover { border-color: var(--pink); color: var(--pink); }

    /* ── LAYOUT ── */
    .app-body {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 56px);
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .panel-head {
      padding: 16px 16px 0;
      display: flex; flex-direction: column; gap: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .panel-tabs { display: flex; gap: 4px; }
    .panel-tab {
      padding: 6px 12px; border-radius: 8px; font-size: .875rem;
      font-weight: 500; cursor: pointer; border: none; background: none;
      color: var(--muted); transition: background .15s, color .15s;
    }
    .panel-tab.active { background: var(--amber-l); color: #9a6000; }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 12px; }
    .filter-pill {
      padding: 4px 10px; border-radius: 50px; font-size: .8125rem;
      font-weight: 500; cursor: pointer; border: 1.5px solid var(--border);
      background: none; color: var(--muted); transition: all .15s;
      white-space: nowrap;
    }
    .filter-pill.active { border-color: var(--amber); background: var(--amber-l); color: #9a6000; }
    .search-wrap { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .search-wrap input {
      width: 100%; padding: 8px 12px; border-radius: 10px;
      border: 1.5px solid var(--border); font-size: .9rem;
      background: var(--bg); outline: none;
    }
    .search-wrap input:focus { border-color: var(--amber); }
    .list-scroll { flex: 1; overflow-y: auto; }
    .sug-card {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .1s;
    }
    .sug-card:hover   { background: var(--bg); }
    .sug-card.active  { background: var(--amber-l); }
    .sug-title { font-weight: 600; font-size: .9375rem; margin-bottom: 3px; }
    .sug-meta  { font-size: .8125rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .status-dot.submitted  { background: var(--blue); }
    .status-dot.draft      { background: var(--muted); }
    .status-dot.approved   { background: var(--green); }
    .status-dot.rejected   { background: var(--pink); }
    .empty-state { padding: 40px 16px; text-align: center; color: var(--muted); font-size: .9rem; }

    /* ── RIGHT PANEL ── */
    .right-panel {
      overflow-y: auto;
      background: var(--bg);
    }
    .detail-wrap { max-width: 760px; margin: 0 auto; padding: 24px 24px 60px; }
    .placeholder-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%;
      color: var(--muted); gap: 12px; font-size: .9375rem;
    }
    .placeholder-icon { font-size: 3rem; }

    /* ── DETAIL ── */
    .detail-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
    .detail-title  { font-size: 1.375rem; font-weight: 700; flex: 1; line-height: 1.3; }
    .status-badge  {
      padding: 4px 12px; border-radius: 50px; font-size: .8125rem;
      font-weight: 700; white-space: nowrap; flex-shrink: 0;
    }
    .status-badge.submitted  { background: #DBEAFE; color: #1D4ED8; }
    .status-badge.draft      { background: var(--border); color: var(--muted); }
    .status-badge.approved   { background: #D1FAE5; color: #065F46; }
    .status-badge.rejected   { background: #FEE2E2; color: #991B1B; }

    .detail-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .chip {
      padding: 4px 10px; border-radius: 50px;
      font-size: .8125rem; font-weight: 500;
      background: var(--card); border: 1.5px solid var(--border); color: var(--text);
    }

    .section { background: var(--card); border-radius: var(--radius);
                padding: 18px 20px; margin-bottom: 14px; }
    .section h4 { font-size: .8125rem; font-weight: 700; color: var(--muted);
                  text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
    .field-row { display: flex; gap: 6px; margin-bottom: 8px; font-size: .9375rem; }
    .field-label { color: var(--muted); font-size: .875rem; min-width: 100px; flex-shrink: 0; }
    .field-value { word-break: break-word; }
    .field-value a { color: var(--blue); text-decoration: none; }
    .field-value a:hover { text-decoration: underline; }

    .sources-list { display: flex; flex-direction: column; gap: 6px; }
    .source-link {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 9px;
      background: var(--bg); font-size: .875rem;
      color: var(--blue); text-decoration: none; word-break: break-all;
    }
    .source-link:hover { background: var(--border); }

    /* ── PREVIEW CARD ── */
    .preview-card {
      background: linear-gradient(135deg, #1A1612 0%, #2d2520 100%);
      border-radius: 16px; padding: 20px; color: #fff;
    }
    .preview-category { font-size: .75rem; font-weight: 600; opacity: .6;
                        text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .preview-title    { font-size: 1.125rem; font-weight: 700; margin-bottom: 6px; }
    .preview-location { font-size: .875rem; opacity: .7; margin-bottom: 12px; }
    .preview-price    {
      display: inline-block; padding: 4px 10px; border-radius: 50px;
      background: rgba(255,255,255,.15); font-size: .8125rem; font-weight: 600;
    }

    /* ── ACTIONS ── */
    .action-section { background: var(--card); border-radius: var(--radius);
                       padding: 18px 20px; margin-bottom: 14px; }
    .action-section h4 { font-size: .8125rem; font-weight: 700; color: var(--muted);
                          text-transform: uppercase; letter-spacing: .05em; margin-bottom: 14px; }
    .note-input {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid var(--border); font-size: .9375rem;
      font-family: inherit; resize: vertical; min-height: 64px;
      background: var(--bg); outline: none; margin-bottom: 12px;
    }
    .note-input:focus { border-color: var(--amber); }
    .action-row { display: flex; gap: 10px; }
    .btn-approve {
      flex: 1; padding: 11px; border-radius: 11px;
      background: var(--green); border: none; color: #fff;
      font-size: .9375rem; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-approve:hover:not(:disabled) { opacity: .85; }
    .btn-approve:disabled { opacity: .5; cursor: not-allowed; }
    .btn-reject {
      flex: 1; padding: 11px; border-radius: 11px;
      background: none; border: 2px solid var(--pink); color: var(--pink);
      font-size: .9375rem; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .btn-reject:hover:not(:disabled) { background: #FEE2E2; }
    .btn-reject:disabled { opacity: .5; cursor: not-allowed; }
    .action-result {
      margin-top: 10px; font-size: .875rem; padding: 8px 12px;
      border-radius: 8px; display: none;
    }
    .action-result.ok  { background: #D1FAE5; color: #065F46; display: block; }
    .action-result.err { background: #FEE2E2; color: #991B1B; display: block; }

    /* ── AUDIT LOG ── */
    .audit-timeline { display: flex; flex-direction: column; gap: 0; }
    .audit-item {
      display: flex; gap: 12px; padding: 10px 0;
      border-bottom: 1px solid var(--border); font-size: .875rem;
    }
    .audit-item:last-child { border-bottom: none; }
    .audit-action {
      padding: 2px 8px; border-radius: 6px; font-size: .75rem;
      font-weight: 700; white-space: nowrap; flex-shrink: 0;
      align-self: flex-start; margin-top: 2px;
    }
    .audit-action.approve { background: #D1FAE5; color: #065F46; }
    .audit-action.reject  { background: #FEE2E2; color: #991B1B; }
    .audit-action.submit  { background: #DBEAFE; color: #1D4ED8; }
    .audit-action.edit    { background: var(--amber-l); color: #9a6000; }
    .audit-body  { flex: 1; }
    .audit-who   { font-weight: 500; }
    .audit-note  { color: var(--muted); margin-top: 2px; }
    .audit-ts    { font-size: .8rem; color: var(--muted); margin-top: 2px; }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: #fff; padding: 10px 20px; border-radius: 10px;
      font-size: .9rem; z-index: 9999; opacity: 0; transition: opacity .25s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .app-body { grid-template-columns: 1fr; }
      .right-panel { display: none; }
      .right-panel.mobile-open { display: block; position: fixed; inset: 56px 0 0; z-index: 10; }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">someday</div>
    <p class="login-sub">Studio — Internes Redaktionssystem</p>
    <input type="email"    id="inp-email" placeholder="E-Mail" autocomplete="email">
    <input type="password" id="inp-pw"    placeholder="Passwort"
      onkeydown="if(event.key==='Enter') signIn()">
    <button onclick="signIn()" id="sign-in-btn">Anmelden</button>
    <p class="login-error" id="login-err"></p>
  </div>
</div>

<!-- ══ DASHBOARD ══════════════════════════════════════════════════ -->
<div id="dashboard">
  <div class="top-bar">
    <div class="top-logo">someday <span>studio</span></div>
    <div class="top-right">
      <span class="top-user" id="top-user-email"></span>
      <span class="top-badge" id="top-user-role"></span>
      <button class="btn-sm" onclick="signOut()">Abmelden</button>
    </div>
  </div>

  <div class="app-body">
    <!-- ── LEFT: list ── -->
    <div class="left-panel">
      <div class="panel-head">
        <div class="panel-tabs">
          <button class="panel-tab active" onclick="switchTab('suggestions', this)">Vorschläge</button>
          <button class="panel-tab" onclick="switchTab('activities', this)">Aktivitäten</button>
        </div>
        <div class="filter-row" id="suggestions-filters">
          <button class="filter-pill active" onclick="setFilter('all', this)">Alle</button>
          <button class="filter-pill" onclick="setFilter('submitted', this)">Eingereicht</button>
          <button class="filter-pill" onclick="setFilter('draft', this)">Entwürfe</button>
          <button class="filter-pill" onclick="setFilter('approved', this)">Genehmigt</button>
          <button class="filter-pill" onclick="setFilter('rejected', this)">Abgelehnt</button>
        </div>
      </div>
      <div class="search-wrap">
        <input type="text" id="search-inp" placeholder="Suchen…" oninput="renderList()">
      </div>
      <div class="list-scroll" id="list-scroll">
        <div class="empty-state">Lade Daten…</div>
      </div>
    </div>

    <!-- ── RIGHT: detail ── -->
    <div class="right-panel" id="right-panel">
      <div style="height:100%;display:flex;align-items:center;justify-content:center">
        <div class="placeholder-state">
          <div class="placeholder-icon">✏️</div>
          <div>Vorschlag auswählen</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// ── Firebase init ────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyAuapMaw8Tpw0HC_TlMUvCbw0PPfWOaL-Y",
  authDomain:        "vivo-mvp.firebaseapp.com",
  databaseURL:       "https://vivo-mvp-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "vivo-mvp",
  storageBucket:     "vivo-mvp.firebasestorage.app",
  messagingSenderId: "662578995457",
  appId:             "1:662578995457:web:ee580f001d212cd73d7b00"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

// ── Environment detection ────────────────────────────────────────
// isLocalEmulator: true only on localhost/127.0.0.1 — Firebase Client SDK
//   can connect to the emulator on HTTP from an HTTP page.
// !isLocalEmulator: everything else (Codespaces, any other host) — auth via
//   studio-auth function; RTDB data via studio-data function (polling).
//   No hostname pattern matching — works regardless of URL format.
const _h            = location.hostname;
const isLocalEmulator = (_h === '127.0.0.1' || _h === 'localhost');

if (isLocalEmulator) {
  auth.useEmulator('http://127.0.0.1:9099');
  db.useEmulator('127.0.0.1', 9000);
}

// ── State ────────────────────────────────────────────────────────
let _me          = null;
let _idToken     = null;
let _role        = null;
let _allSugs     = {};
let _allActs     = {};
let _filter      = 'all';
let _activeTab   = 'suggestions';
let _activeSugId = null;
let _unsubSugs   = null;
let _unsubActs   = null;
let _pollTimer   = null;   // used on non-localhost instead of realtime listeners

// ── Auth ─────────────────────────────────────────────────────────
auth.onAuthStateChanged(async user => {
  // Non-localhost: sign-in is handled by signInViaFunction(); SDK state ignored.
  if (!isLocalEmulator) return;
  if (!user) {
    showLogin();
    return;
  }
  const result = await user.getIdTokenResult(true);
  const role = result.claims.studioRole;
  if (!role) {
    await auth.signOut();
    loginErr('Kein Zugang: Dein Account hat keine Studio-Berechtigung.');
    return;
  }
  _me      = user;
  _idToken = result.token;
  _role    = role;
  showDashboard();
});

async function signIn() {
  const email = document.getElementById('inp-email').value.trim();
  const pw    = document.getElementById('inp-pw').value;
  const btn   = document.getElementById('sign-in-btn');
  loginErr('');
  btn.disabled = true; btn.textContent = '…';
  try {
    if (isLocalEmulator) {
      await auth.signInWithEmailAndPassword(email, pw);
    } else {
      await signInViaFunction(email, pw);
    }
  } catch (err) {
    loginErr(fmtAuthErr(err.code || err.message));
    btn.disabled = false; btn.textContent = 'Anmelden';
  }
}

async function signInViaFunction(email, pw) {
  const res = await fetch('/.netlify/functions/studio-auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: pw }),
  });
  const data = await res.json();
  if (!res.ok) {
    const err = new Error(data.error || 'Anmeldung fehlgeschlagen');
    err.code = data.error;
    throw err;
  }
  _idToken = data.idToken;
  _role    = data.role;
  _me      = { email: data.email, uid: data.uid, getIdToken: async () => _idToken };
  showDashboard();
}

async function signOut() {
  detachListeners();
  if (isLocalEmulator) await auth.signOut();
  _me      = null;
  _idToken = null;
  _role    = null;
  showLogin();
}

function loginErr(msg) {
  document.getElementById('login-err').textContent = msg;
}

function fmtAuthErr(code) {
  if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
    return 'E-Mail oder Passwort falsch.';
  }
  return 'Anmeldung fehlgeschlagen (' + code + ')';
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('sign-in-btn').disabled = false;
  document.getElementById('sign-in-btn').textContent = 'Anmelden';
}

function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display   = 'block';
  document.getElementById('top-user-email').textContent = _me.email || '';
  document.getElementById('top-user-role').textContent  = _role;
  attachListeners();
}

// ── Realtime listeners / polling ─────────────────────────────────
function attachListeners() {
  if (!isLocalEmulator) {
    // Non-localhost: RTDB Client SDK can't reach the emulator over HTTP from
    // an HTTPS page (Mixed Content). Load data via studio-data function.
    _loadDataViaFunction();
    _pollTimer = setInterval(_loadDataViaFunction, 5000);
  } else {
    _unsubSugs = db.ref('suggestions').on('value', snap => {
      _allSugs = snap.val() || {};
      if (_activeTab === 'suggestions') renderList();
    });
    _unsubActs = db.ref('activities').on('value', snap => {
      _allActs = snap.val() || {};
      if (_activeTab === 'activities') renderList();
    });
  }
}

function detachListeners() {
  if (_pollTimer)  { clearInterval(_pollTimer); _pollTimer = null; }
  if (_unsubSugs)  { db.ref('suggestions').off('value', _unsubSugs); _unsubSugs = null; }
  if (_unsubActs)  { db.ref('activities').off('value', _unsubActs);  _unsubActs = null; }
}

async function _loadDataViaFunction() {
  try {
    await refreshIdToken();
    const res  = await fetch('/.netlify/functions/studio-data', {
      headers: { 'Authorization': `Bearer ${_idToken}` },
    });
    if (!res.ok) return;
    const data = await res.json();
    _allSugs = data.suggestions || {};
    _allActs = data.activities  || {};
    renderList();
  } catch {}
}

// ── Tab switching ────────────────────────────────────────────────
function switchTab(tab, el) {
  _activeTab = tab;
  _activeSugId = null;
  document.querySelectorAll('.panel-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('suggestions-filters').style.display =
    tab === 'suggestions' ? '' : 'none';
  renderList();
  showPlaceholder();
}

// ── Filtering ────────────────────────────────────────────────────
function setFilter(f, el) {
  _filter = f;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

// ── List render ──────────────────────────────────────────────────
function renderList() {
  const q = (document.getElementById('search-inp').value || '').toLowerCase();
  const container = document.getElementById('list-scroll');

  let items;
  if (_activeTab === 'suggestions') {
    items = Object.entries(_allSugs)
      .filter(([, s]) => _filter === 'all' || s.status === _filter)
      .filter(([, s]) => !q || (s.title || '').toLowerCase().includes(q) || (s.city || '').toLowerCase().includes(q))
      .sort(([, a], [, b]) => (b.createdAt || 0) - (a.createdAt || 0));

    if (!items.length) {
      container.innerHTML = '<div class="empty-state">Keine Vorschläge</div>';
      return;
    }

    container.innerHTML = items.map(([id, s]) => `
      <div class="sug-card${id === _activeSugId ? ' active' : ''}" onclick="selectSuggestion('${esc(id)}')">
        <div class="sug-title">${esc(s.title || '—')}</div>
        <div class="sug-meta">
          <span class="status-dot ${esc(s.status)}"></span>
          <span>${esc(s.city || '')}</span>
          <span>·</span>
          <span>${esc(s.category || '')}</span>
        </div>
      </div>
    `).join('');

  } else {
    items = Object.entries(_allActs)
      .filter(([, a]) => !q || (a.title || '').toLowerCase().includes(q))
      .sort(([, a], [, b]) => (b.publishedAt || 0) - (a.publishedAt || 0));

    if (!items.length) {
      container.innerHTML = '<div class="empty-state">Keine veröffentlichten Aktivitäten</div>';
      return;
    }

    container.innerHTML = items.map(([id, a]) => `
      <div class="sug-card${id === _activeSugId ? ' active' : ''}" onclick="selectActivity('${esc(id)}')">
        <div class="sug-title">${esc(a.title || '—')}</div>
        <div class="sug-meta">
          <span class="status-dot approved"></span>
          <span>${esc(a.city || '')}</span>
          <span>·</span>
          <span>${esc(a.category || '')}</span>
        </div>
      </div>
    `).join('');
  }
}

// ── Detail: suggestion ───────────────────────────────────────────
async function selectSuggestion(id) {
  _activeSugId = id;
  renderList();

  const sug = _allSugs[id];
  if (!sug) return;

  const auditLog = await loadAuditForSuggestion(id);
  const rp = document.getElementById('right-panel');
  const canAct = ['editor','superadmin'].includes(_role) && sug.status === 'submitted';

  rp.innerHTML = `
    <div class="detail-wrap">
      <div class="detail-header">
        <div class="detail-title">${esc(sug.title || '—')}</div>
        <span class="status-badge ${esc(sug.status)}">${statusLabel(sug.status)}</span>
      </div>

      <div class="detail-chips">
        ${sug.category ? `<span class="chip">🏷 ${esc(sug.category)}</span>` : ''}
        ${sug.eyebrow  ? `<span class="chip">🔖 ${esc(sug.eyebrow)}</span>` : ''}
        ${sug.city     ? `<span class="chip">📍 ${esc(sug.city)}${sug.district ? ', ' + esc(sug.district) : ''}</span>` : ''}
        ${priceChip(sug.price)}
      </div>

      <div class="section">
        <h4>Beschreibung</h4>
        ${sug.tagline ? `<p style="font-size:1rem;font-weight:600;margin-bottom:.5rem">${esc(sug.tagline)}</p>` : ''}
        <p style="font-size:.9375rem;line-height:1.6">${esc(sug.description || '—')}</p>
      </div>

      <div class="section">
        <h4>Details</h4>
        ${fieldRow('Anbieter',   sug.providerName)}
        ${fieldRow('Website',    sug.website, true)}
        ${fieldRow('Instagram',  sug.instagram ? '@' + sug.instagram : null)}
        ${fieldRow('Buchung',    sug.bookingUrl, true)}
        ${fieldRow('Adresse',    sug.location?.address)}
        ${sug.lat && sug.lng ? fieldRow('Koordinaten', `${sug.lat}, ${sug.lng}`) : ''}
        ${sug.schedule ? fieldRow('Termine', formatSchedule(sug.schedule)) : ''}
      </div>

      ${sug.sources?.length ? `
      <div class="section">
        <h4>Quellen</h4>
        <div class="sources-list">
          ${sug.sources.map(s => `<a class="source-link" href="${esc(s)}" target="_blank" rel="noopener">🔗 ${esc(s)}</a>`).join('')}
        </div>
      </div>` : ''}

      <div class="section">
        <h4>Vorschau</h4>
        <div class="preview-card">
          <div class="preview-category">${esc(sug.category || '')}</div>
          <div class="preview-title">${esc(sug.title || '')}</div>
          <div class="preview-location">📍 ${esc(sug.city || '')}${sug.location?.address ? ' · ' + esc(sug.location.address) : ''}</div>
          ${sug.price ? `<span class="preview-price">${formatPrice(sug.price)}</span>` : ''}
        </div>
      </div>

      ${canAct ? `
      <div class="action-section" id="action-section">
        <h4>Entscheidung</h4>
        <textarea class="note-input" id="action-note" placeholder="Notiz (optional bei Freigabe, Pflicht bei Ablehnung)…"></textarea>
        <div class="action-row">
          <button class="btn-approve" id="btn-approve" onclick="approve('${esc(id)}')">✓ Freigeben</button>
          <button class="btn-reject"  id="btn-reject"  onclick="reject('${esc(id)}')">✕ Ablehnen</button>
        </div>
        <div class="action-result" id="action-result"></div>
      </div>` : ''}

      <div class="section">
        <h4>Änderungsprotokoll</h4>

      </div>

  `;
}

function showPlaceholder() {
  document.getElementById('right-panel').innerHTML = `
    <div style="height:100%;display:flex;align-items:center;justify-content:center">
      <div class="placeholder-state">
        <div class="placeholder-icon">✏️</div>

      </div>

// ── Approve / Reject ─────────────────────────────────────────────
async function refreshIdToken() {
  if (!isLocalEmulator) return; // emulator tokens don't expire; reuse _idToken
  _idToken = await _me.getIdToken(true);
}

async function approve(suggestionId) {
  const note = document.getElementById('action-note')?.value?.trim() || '';
  setActionBtns(true);
  try {
    await refreshIdToken();
    const res = await callFunction('studio-approve', { suggestionId, notes: note }, _idToken);
    if (res.error) throw new Error(res.error);
    showActionResult('ok', res.idempotent
      ? `Bereits freigegeben — Aktivitäts-ID: ${res.activityId}`
      : `Freigegeben ✓ Aktivitäts-ID: ${res.activityId}`);
    toast('Freigegeben!');
  } catch (err) {
    showActionResult('err', 'Fehler: ' + err.message);
    setActionBtns(false);
  }
}

async function reject(suggestionId) {
  const reason = document.getElementById('action-note')?.value?.trim() || '';
  if (!reason) {
    showActionResult('err', 'Bitte eine Begründung eingeben.');
    return;
  }
  setActionBtns(true);
  try {
    await refreshIdToken();
    const res = await callFunction('studio-reject', { suggestionId, reason }, _idToken);
    if (res.error) throw new Error(res.error);
    showActionResult('ok', 'Abgelehnt.');
    toast('Abgelehnt.');
  } catch (err) {
    showActionResult('err', 'Fehler: ' + err.message);
    setActionBtns(false);
  }
}

function setActionBtns(disabled) {
  const a = document.getElementById('btn-approve');
  const r = document.getElementById('btn-reject');
  if (a) a.disabled = disabled;
  if (r) r.disabled = disabled;
}

function showActionResult(type, msg) {
  const el = document.getElementById('action-result');
  if (!el) return;
  el.className = 'action-result ' + type;
  el.textContent = msg;
}

// ── Netlify Function call ────────────────────────────────────────
async function callFunction(name, body, idToken) {
  const res = await fetch(`/.netlify/functions/${name}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${idToken}`,
    },
    body: JSON.stringify(body),
  });
  return res.json();
}

// ── Audit log ────────────────────────────────────────────────────
async function loadAuditForSuggestion(suggestionId) {
  const snap = await db.ref('studioAuditLog')
    .orderByChild('suggestionId')
    .equalTo(suggestionId)
    .once('value');
  const val = snap.val() || {};
  return Object.values(val).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
}

function renderAuditLog(entries) {
  if (!entries.length) return '<p style="color:var(--muted);font-size:.875rem">Noch keine Einträge.</p>';
  return `<div class="audit-timeline">
    ${entries.map(e => `
      <div class="audit-item">
        <span class="audit-action ${esc(e.action)}">${actionLabel(e.action)}</span>
        <div class="audit-body">
          <div class="audit-who">${esc(e.actorEmail || e.actorUid || '—')}</div>
          ${e.details ? `<div class="audit-note">${esc(e.details)}</div>` : ''}
          <div class="audit-ts">${e.timestamp ? fmtDate(e.timestamp) : ''}</div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

// ── Helpers ──────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(ts) {
  return new Date(ts).toLocaleString('de-DE', {
    day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit'
  });
}

function statusLabel(s) {
  return { submitted:'Eingereicht', draft:'Entwurf', approved:'Genehmigt', rejected:'Abgelehnt' }[s] || s;
}

function actionLabel(a) {
  return { approve:'Freigabe', reject:'Ablehnung', submit:'Einreichung', edit:'Bearbeitung',
           set_role:'Rolle', bootstrap_superadmin:'Bootstrap' }[a] || a;
}

function fieldRow(label, value, isLink = false) {
  if (!value) return '';
  const content = isLink
    ? `<a href="${esc(value)}" target="_blank" rel="noopener">${esc(value)}</a>`
    : esc(value);
  return `<div class="field-row"><span class="field-label">${esc(label)}</span><span class="field-value">${content}</span></div>`;
}

function priceChip(price) {
  if (!price) return '';
  return `<span class="chip">💶 ${formatPrice(price)}</span>`;
}

function formatPrice(price) {
  if (!price) return '';
  if (price.type === 'free') return 'Kostenlos';
  if (price.type === 'donation') return 'Spende';
  const amt = price.amount ? `${price.amount} ${price.currency || 'EUR'}` : '';
  return amt + (price.note ? ` · ${price.note}` : '');
}

function formatSchedule(schedule) {
  if (!schedule) return '';
  if (schedule.note) return schedule.note;
  const days = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  const dayStr = schedule.daysOfWeek ? schedule.daysOfWeek.map(d => days[d]).join(', ') : '';
  return [dayStr, schedule.time, schedule.type === 'recurring' ? '(wiederkehrend)' : ''].filter(Boolean).join(' ');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
