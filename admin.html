<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>someday. studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Someday brand palette */
      --primary:   #65DB70;
      --primary-l: #e4f8e1;
      --primary-d: #27a63a;  /* darker green for active text */
      --dark:      #183B28;
      --bg:        #FAF8F4;
      --card:      #FFFFFF;
      --text:      #183B28;
      --muted:     #68786d;
      --border:    #e6eae3;
      /* Semantic */
      --pink:      #E8534A;
      --green-ok:  #2E9E6B;
      --blue:      #3B82F6;
      --purple:    #8B5CF6;
      --shadow:    0 2px 12px rgba(24,59,40,.08);
      --radius:    14px;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ── */
    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center;
                    background: var(--dark); }
    .login-box { background: var(--card); border-radius: 22px; padding: 48px 40px;
                 width: 100%; max-width: 380px; box-shadow: var(--shadow);
                 display: flex; flex-direction: column; gap: 18px; }
    .login-logo { font-size: 2rem; font-weight: 900; text-align: center; color: var(--dark);
                  letter-spacing: -1.5px; }
    .login-logo .dot { color: var(--primary); }
    .login-logo .sub { font-size: .9rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
    .login-eyebrow { font-size: .8rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
                     color: var(--muted); text-align: center; margin-top: -8px; }
    .login-box input { width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1.5px solid var(--border); font-size: 1rem; background: var(--bg); outline: none;
      color: var(--text); transition: border-color .15s; }
    .login-box input:focus { border-color: var(--primary); }
    .login-box button { width: 100%; padding: 13px; border-radius: 12px;
      background: var(--dark); border: none; color: #fff; font-size: 1rem;
      font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .login-box button:hover { opacity: .85; }
    .login-error { font-size: .875rem; color: var(--pink); text-align: center; min-height: 1.2em; }

    /* ── TOP BAR ── */
    #admin-app { display: none; }
    .top-bar { background: var(--dark); padding: 0 24px; height: 56px;
               position: sticky; top: 0; z-index: 20;
               display: flex; align-items: center; justify-content: space-between; }
    .top-logo { font-size: 1.125rem; font-weight: 900; letter-spacing: -0.8px; color: #fff; }
    .top-logo .dot  { color: var(--primary); }
    .top-logo .word { color: rgba(255,255,255,.55); font-weight: 500; font-size: .85rem;
                      letter-spacing: .5px; text-transform: uppercase; margin-left: 4px; }
    .top-right { display: flex; align-items: center; gap: 12px; }
    .top-user  { font-size: .875rem; color: rgba(255,255,255,.6); }
    .top-badge { font-size: .75rem; font-weight: 700; padding: 3px 9px;
                 border-radius: 50px; background: var(--primary-l); color: var(--primary-d); }
    .btn-sm { padding: 6px 14px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,.2);
              background: transparent; font-size: .875rem; font-weight: 500; cursor: pointer;
              color: rgba(255,255,255,.7); transition: border-color .15s, color .15s; }
    .btn-sm:hover { border-color: rgba(255,255,255,.5); color: #fff; }

    /* ── LAYOUT ── */
    .app-body { display: grid; grid-template-columns: 210px 1fr;
                height: calc(100vh - 56px); overflow: hidden; }

    /* ── SIDEBAR ── */
    .admin-sidebar { border-right: 1px solid var(--border); overflow-y: auto;
                     background: var(--card); padding: 14px 10px;
                     display: flex; flex-direction: column; gap: 3px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
                border-radius: 10px; cursor: pointer; border: none; background: none;
                font-size: .9rem; font-weight: 500; color: var(--muted); width: 100%;
                text-align: left; transition: background .15s, color .15s; }
    .nav-item:hover { background: var(--bg); color: var(--text); }
    .nav-item.active { background: var(--primary-l); color: var(--primary-d); font-weight: 700; }
    .nav-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
    .nav-divider { border: none; border-top: 1px solid var(--border); margin: 8px 4px; }
    .nav-label { font-size: .7rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
                 color: var(--muted); padding: 8px 12px 4px; }

    /* ── MAIN AREA ── */
    .admin-main { overflow: hidden; display: flex; flex-direction: column; }
    .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .tab-panel.active { display: flex; }
    .scroll-content { flex: 1; overflow-y: auto; padding: 28px 32px 60px; }

    /* ── SPLIT VIEW ── */
    .split-view { display: grid; grid-template-columns: 300px 1fr; flex: 1; overflow: hidden; }
    .split-list { border-right: 1px solid var(--border); overflow-y: auto;
                  display: flex; flex-direction: column; }
    .split-head { padding: 14px 14px 0; background: var(--card);
                  border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .split-search { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .split-search input { width: 100%; padding: 7px 11px; border-radius: 9px;
      border: 1.5px solid var(--border); font-size: .875rem; background: var(--bg);
      outline: none; color: var(--text); }
    .split-search input:focus { border-color: var(--primary); }
    .list-scroll { flex: 1; overflow-y: auto; }
    .split-detail { overflow-y: auto; background: var(--bg); }

    /* ── FILTER PILLS ── */
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 10px; }
    .filter-pill { padding: 4px 10px; border-radius: 50px; font-size: .8125rem;
      font-weight: 500; cursor: pointer; border: 1.5px solid var(--border);
      background: none; color: var(--muted); white-space: nowrap; transition: all .15s; }
    .filter-pill.active { border-color: var(--primary); background: var(--primary-l); color: var(--primary-d); }

    /* ── LIST CARDS ── */
    .sug-card { padding: 12px 14px; border-bottom: 1px solid var(--border);
                cursor: pointer; transition: background .1s; }
    .sug-card:hover  { background: var(--bg); }
    .sug-card.active { background: var(--primary-l); }
    .sug-title { font-weight: 600; font-size: .9rem; margin-bottom: 3px; }
    .sug-meta  { font-size: .8rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.submitted { background: var(--blue); }
    .status-dot.draft     { background: var(--muted); }
    .status-dot.approved  { background: var(--green-ok); }
    .status-dot.rejected  { background: var(--pink); }
    .empty-state { padding: 32px 14px; text-align: center; color: var(--muted); font-size: .875rem; }

    /* ── DETAIL ── */
    .detail-wrap { max-width: 720px; margin: 0 auto; padding: 24px 24px 60px; }
    .placeholder-state { display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: var(--muted); gap: 10px; font-size: .9rem; }
    .detail-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 18px; }
    .detail-title  { font-size: 1.25rem; font-weight: 700; flex: 1; line-height: 1.3; }
    .status-badge  { padding: 3px 10px; border-radius: 50px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
    .status-badge.submitted { background: #DBEAFE; color: #1D4ED8; }
    .status-badge.draft     { background: var(--border); color: var(--muted); }
    .status-badge.approved  { background: #D1FAE5; color: #065F46; }
    .status-badge.rejected  { background: #FEE2E2; color: #991B1B; }
    .detail-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
    .chip { padding: 3px 9px; border-radius: 50px; font-size: .8rem; font-weight: 500;
            background: var(--card); border: 1.5px solid var(--border); }
    .section { background: var(--card); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
    .section h4 { font-size: .75rem; font-weight: 700; color: var(--muted);
                  text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .field-row { display: flex; gap: 6px; margin-bottom: 7px; font-size: .9rem; }
    .field-label { color: var(--muted); font-size: .85rem; min-width: 90px; flex-shrink: 0; }
    .field-value { word-break: break-word; }
    .field-value a { color: var(--blue); text-decoration: none; }
    .field-value a:hover { text-decoration: underline; }

    /* ── ACTIONS ── */
    .action-section { background: var(--card); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
    .action-section h4 { font-size: .75rem; font-weight: 700; color: var(--muted);
                         text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
    .note-input { width: 100%; padding: 9px 12px; border-radius: 9px; border: 1.5px solid var(--border);
                  font-size: .9rem; font-family: inherit; resize: vertical; min-height: 60px;
                  background: var(--bg); outline: none; margin-bottom: 10px; color: var(--text); }
    .note-input:focus { border-color: var(--primary); }
    .action-row { display: flex; gap: 10px; }
    .btn-approve { flex: 1; padding: 10px; border-radius: 10px; background: var(--green-ok); border: none;
                   color: #fff; font-size: .9rem; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .btn-approve:hover:not(:disabled) { opacity: .85; }
    .btn-approve:disabled { opacity: .5; cursor: not-allowed; }
    .btn-reject  { flex: 1; padding: 10px; border-radius: 10px; background: none;
                   border: 2px solid var(--pink); color: var(--pink); font-size: .9rem;
                   font-weight: 700; cursor: pointer; transition: background .15s; }
    .btn-reject:hover:not(:disabled) { background: #FEE2E2; }
    .btn-reject:disabled { opacity: .5; cursor: not-allowed; }
    .action-result { margin-top: 10px; font-size: .875rem; padding: 7px 11px;
                     border-radius: 8px; display: none; }
    .action-result.ok  { background: #D1FAE5; color: #065F46; display: block; }
    .action-result.err { background: #FEE2E2; color: #991B1B; display: block; }

    /* ── AUDIT LOG ── */
    .audit-timeline { display: flex; flex-direction: column; }
    .audit-item { display: flex; gap: 10px; padding: 8px 0;
                  border-bottom: 1px solid var(--border); font-size: .85rem; }
    .audit-item:last-child { border-bottom: none; }
    .audit-action { padding: 2px 7px; border-radius: 5px; font-size: .73rem; font-weight: 700;
                    white-space: nowrap; flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
    .audit-action.approve { background: #D1FAE5; color: #065F46; }
    .audit-action.reject  { background: #FEE2E2; color: #991B1B; }
    .audit-action.submit  { background: #DBEAFE; color: #1D4ED8; }
    .audit-action.edit    { background: var(--primary-l); color: var(--primary-d); }
    .audit-body { flex: 1; }
    .audit-who  { font-weight: 500; }
    .audit-note { color: var(--muted); margin-top: 2px; }
    .audit-ts   { font-size: .77rem; color: var(--muted); margin-top: 2px; }

    /* ── EDIT FORM ── */
    .edit-section { background: var(--card); border-radius: var(--radius);
                    padding: 16px 18px; margin-bottom: 12px; border: 2px solid var(--primary); }
    .edit-section h4 { font-size: .75rem; font-weight: 700; color: var(--primary-d);
                       text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .edit-field { display: flex; flex-direction: column; gap: 3px; }
    .edit-field.full { grid-column: 1 / -1; }
    .edit-label { font-size: .78rem; font-weight: 500; color: var(--muted); }
    .edit-input, .edit-textarea, .edit-select {
      padding: 7px 10px; border-radius: 8px; border: 1.5px solid var(--border);
      font-size: .875rem; font-family: inherit; background: var(--bg);
      outline: none; color: var(--text); transition: border-color .15s; }
    .edit-input:focus, .edit-textarea:focus, .edit-select:focus { border-color: var(--primary); }
    .edit-textarea { resize: vertical; min-height: 68px; }
    .edit-actions { display: flex; gap: 9px; margin-top: 12px; }
    .btn-save { padding: 9px 18px; border-radius: 9px; background: var(--dark); border: none;
                color: #fff; font-size: .9rem; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .btn-save:hover:not(:disabled) { opacity: .85; }
    .btn-save:disabled { opacity: .5; cursor: not-allowed; }
    .btn-cancel { padding: 9px 18px; border-radius: 9px; background: none;
                  border: 1.5px solid var(--border); color: var(--muted); font-size: .9rem;
                  font-weight: 500; cursor: pointer; transition: border-color .15s, color .15s; }
    .btn-cancel:hover { border-color: var(--pink); color: var(--pink); }

    /* ── EDIT CHIPS (toggle chips for category/tag multi-select) ── */
    .edit-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; min-height: 32px; }
    .edit-chip { padding: 4px 10px; border-radius: 50px; font-size: .8rem; font-weight: 500;
                 cursor: pointer; border: 1.5px solid var(--border); background: var(--bg);
                 color: var(--muted); transition: all .15s; user-select: none; }
    .edit-chip.on { border-color: var(--primary-d); background: var(--primary-l); color: var(--primary-d); }
    .edit-chip.tag-chip { background: var(--card); }
    .edit-chip.tag-chip .chip-x { margin-left: 4px; opacity: .6; font-size: .75rem; }
    .tag-results { background: var(--card); border: 1.5px solid var(--border); border-radius: 8px;
                   padding: 4px 0; margin-top: 4px; max-height: 120px; overflow-y: auto; }
    .tag-result-item { padding: 5px 10px; font-size: .85rem; cursor: pointer; color: var(--text); }
    .tag-result-item:hover { background: var(--primary-l); color: var(--primary-d); }

    /* ── GEO SECTION ── */
    .geo-section { background: var(--card); border-radius: var(--radius); padding: 16px 18px;
                   margin-bottom: 12px; border: 1.5px solid var(--border); }
    .geo-section h4 { font-size: .75rem; font-weight: 700; color: var(--muted);
                      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .geo-status { font-size: .8rem; margin-bottom: 8px; }
    .geo-status.ok  { color: #059669; }
    .geo-status.none { color: var(--muted); }
    .geo-addr { font-size: .82rem; color: var(--muted); margin-bottom: 10px; }
    .geo-candidate { background: var(--bg); border: 1.5px solid var(--border);
                     border-radius: 8px; padding: 9px 12px; margin-bottom: 6px;
                     cursor: pointer; font-size: .82rem; transition: border-color .15s; }
    .geo-candidate:hover { border-color: var(--primary); }
    .geo-candidate.selected { background: var(--primary-l); border-color: var(--primary-d); }
    .geo-candidate-name { font-weight: 600; margin-bottom: 2px; }
    .geo-candidate-coords { font-size: .78rem; color: var(--muted); }
    .geo-confirm { background: #ECFDF5; border: 1.5px solid #6EE7B7; border-radius: 8px;
                   padding: 12px 14px; margin-top: 10px; font-size: .85rem; }
    .geo-confirm p { margin: 0 0 8px; }
    .geo-warn { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 6px;
                padding: 7px 10px; font-size: .78rem; color: #92400E; margin-bottom: 8px; }
    .geo-confirm-actions { display: flex; gap: 8px; }

    /* ── QUICK-ASSIGN PANEL ── */
    .quick-assign { background: var(--card); border-radius: var(--radius); padding: 16px 18px;
                    margin-bottom: 12px; border: 1.5px solid var(--border); }
    .quick-assign h4 { font-size: .75rem; font-weight: 700; color: var(--muted);
                       text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
    .qa-row { margin-bottom: 10px; }
    .qa-label { font-size: .78rem; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
    .qa-select { padding: 7px 10px; border-radius: 8px; border: 1.5px solid var(--border);
                 font-size: .875rem; font-family: inherit; background: var(--bg); outline: none;
                 color: var(--text); transition: border-color .15s; width: 100%; max-width: 320px; }
    .qa-select:focus { border-color: var(--primary); }
    .qa-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; min-height: 28px; }
    .qa-chip { padding: 4px 10px; border-radius: 50px; font-size: .8rem; font-weight: 500;
               cursor: pointer; border: 1.5px solid var(--border); background: var(--bg);
               color: var(--muted); transition: all .15s; user-select: none; }
    .qa-chip.on { border-color: var(--primary-d); background: var(--primary-l); color: var(--primary-d); }
    .qa-chip.tag { background: var(--primary-l); border-color: var(--primary-d); color: var(--primary-d); }
    .qa-chip.tag .chip-x { margin-left: 4px; opacity: .7; font-size: .75rem; }
    .qa-search { padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--border);
                 font-size: .85rem; font-family: inherit; background: var(--bg); outline: none;
                 color: var(--text); margin-top: 6px; width: 100%; max-width: 320px; }
    .qa-search:focus { border-color: var(--primary); }
    .qa-tag-results { background: var(--card); border: 1.5px solid var(--border); border-radius: 8px;
                      padding: 4px 0; margin-top: 4px; max-height: 180px; overflow-y: auto;
                      max-width: 320px; position: relative; z-index: 50; }
    .qa-tag-result-item { padding: 5px 10px; font-size: .85rem; cursor: pointer; color: var(--text); }
    .qa-tag-result-item:hover { background: var(--primary-l); color: var(--primary-d); }
    .qa-unknown { font-size: .8rem; color: var(--muted); background: #fffbeb; border: 1px solid #fde68a;
                  border-radius: 6px; padding: 6px 10px; margin-top: 6px; }
    .qa-actions { display: flex; gap: 9px; align-items: center; margin-top: 12px; }
    .btn-qa-save { padding: 7px 16px; border-radius: 9px; background: var(--dark); border: none;
                   color: #fff; font-size: .875rem; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .btn-qa-save:hover:not(:disabled) { opacity: .85; }
    .btn-qa-save:disabled { opacity: .5; cursor: not-allowed; }
    .qa-status { font-size: .8rem; padding: 4px 8px; border-radius: 6px; display: none; }
    .qa-status.ok  { background: #D1FAE5; color: #065F46; display: inline-block; }
    .qa-status.err { background: #FEE2E2; color: #991B1B; display: inline-block; }

    /* ── TAG MANAGEMENT ── */
    .tag-mgmt-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .tag-list { display:flex; flex-direction:column; gap:8px; }
    .tag-row { background:var(--card); border-radius:var(--radius); padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border:1px solid var(--border); }
    .tag-row.inactive { opacity:.45; }
    .tag-id { font-family:monospace; font-size:.8rem; color:var(--muted); min-width:120px; }
    .tag-label-display { font-weight:600; flex:1; min-width:100px; }
    .tag-badge { font-size:.65rem; font-weight:700; padding:2px 6px; border-radius:4px; background:#e5e7eb; color:#374151; }
    .tag-badge.custom { background:#dbeafe; color:#1d4ed8; }
    .tag-synonyms { width:100%; font-size:.75rem; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .tag-actions { display:flex; gap:4px; }
    .tag-edit-form { background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border:1px solid var(--border); }
    .tag-edit-form input { padding:7px 10px; border:1px solid var(--border); border-radius:7px; font-size:.875rem; background:var(--bg); color:var(--text); }
    /* ── DASHBOARD STATS ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
                 gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--card); border-radius: var(--radius); padding: 18px 20px;
                 border: 1px solid var(--border); }
    .stat-value { font-size: 2rem; font-weight: 800; letter-spacing: -.05em; line-height: 1; }
    .stat-label { font-size: .8125rem; color: var(--muted); margin-top: 5px; }
    .stat-card.blue   .stat-value { color: var(--blue); }
    .stat-card.green  .stat-value { color: var(--green-ok); }
    .stat-card.pink   .stat-value { color: var(--pink); }
    .stat-card.brand  .stat-value { color: var(--primary-d); }
    .stat-card.purple .stat-value { color: var(--purple); }

    /* ── USERS TABLE ── */
    .users-table { width: 100%; border-collapse: collapse; background: var(--card);
                   border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
    .users-table th { padding: 10px 14px; text-align: left; font-size: .75rem; font-weight: 700;
                      color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
                      background: var(--bg); border-bottom: 1px solid var(--border); }
    .users-table td { padding: 10px 14px; font-size: .9rem; border-bottom: 1px solid var(--border); }
    .users-table tr:last-child td { border-bottom: none; }
    .users-table tr:hover td { background: var(--bg); }
    .role-badge { display: inline-block; padding: 2px 8px; border-radius: 20px;
                  font-size: .75rem; font-weight: 700; }
    .role-badge.superadmin { background: #EDE9FE; color: #5B21B6; }
    .role-badge.editor     { background: var(--primary-l); color: var(--primary-d); }
    .role-badge.researcher { background: #DBEAFE; color: #1D4ED8; }
    .role-select { padding: 4px 8px; border-radius: 7px; border: 1.5px solid var(--border);
                   font-size: .8rem; font-family: inherit; background: var(--bg); cursor: pointer; }

    /* ── SETTINGS ── */
    .settings-section { background: var(--card); border-radius: var(--radius);
                        padding: 18px 20px; margin-bottom: 14px; max-width: 560px;
                        border: 1px solid var(--border); }
    .settings-section h3 { font-size: .9rem; font-weight: 700; margin-bottom: 14px; }
    .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .form-label { font-size: .8125rem; font-weight: 500; color: var(--muted); }
    .form-input { padding: 8px 12px; border-radius: 9px; border: 1.5px solid var(--border);
                  font-size: .9rem; background: var(--bg); outline: none; width: 100%;
                  color: var(--text); transition: border-color .15s; }
    .form-input:focus { border-color: var(--primary); }
    .form-select { padding: 8px 12px; border-radius: 9px; border: 1.5px solid var(--border);
                   font-size: .9rem; background: var(--bg); width: 100%; cursor: pointer; }
    .btn-primary { padding: 10px 20px; border-radius: 10px; background: var(--dark); border: none;
                   color: #fff; font-size: .9rem; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .btn-primary:hover:not(:disabled) { opacity: .85; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    /* ── PREVIEW CARD ── */
    .preview-card { background: linear-gradient(135deg, var(--dark) 0%, #2a5c3c 100%);
                    border-radius: 14px; padding: 18px; color: #fff; }
    .preview-category { font-size: .73rem; font-weight: 600; opacity: .6;
                        text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
    .preview-title    { font-size: 1.0625rem; font-weight: 700; margin-bottom: 5px; }
    .preview-location { font-size: .85rem; opacity: .7; margin-bottom: 10px; }
    .preview-price    { display: inline-block; padding: 3px 9px; border-radius: 50px;
                        background: rgba(255,255,255,.15); font-size: .8rem; font-weight: 600; }

    /* ── ALERT BANNER ── */
    .alert-banner { background: #fffbeb; border-radius: var(--radius); padding: 14px 18px;
                    margin-bottom: 20px; font-size: .9rem; color: #7a5000;
                    border: 1px solid #fde68a; display: flex; align-items: center; gap: 12px; }
    .alert-banner strong { font-weight: 700; }

    /* ── TOAST ── */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
             background: var(--dark); color: #fff; padding: 10px 20px; border-radius: 10px;
             font-size: .9rem; z-index: 9999; opacity: 0; transition: opacity .25s;
             pointer-events: none; white-space: nowrap; }

    /* ── ANALYTICS ── */

                  color:var(--muted); transition:all .15s; }

    .range-pill.active { background:var(--primary); border-color:var(--primary); color:#fff; }

    .source-active-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:5px; }
    .source-active-dot.on  { background:var(--green-ok); }

    .source-actions { display:flex; gap:6px; flex-shrink:0; }

<script>
// ── Firebase init ────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyAuapMaw8Tpw0HC_TlMUvCbw0PPfWOaL-Y",
  authDomain:        "vivo-mvp.firebaseapp.com",
  databaseURL:       "https://vivo-mvp-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "vivo-mvp",
  storageBucket:     "vivo-mvp.firebasestorage.app",
  messagingSenderId: "662578995457",
  appId:             "1:662578995457:web:ee580f001d212cd73d7b00"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

const _h              = location.hostname;
const isLocalEmulator = (_h === '127.0.0.1' || _h === 'localhost');
if (isLocalEmulator) {
  auth.useEmulator('http://127.0.0.1:9099');
  db.useEmulator('127.0.0.1', 9000);
}

// ── State ─────────────────────────────────────────────────────────
let _me = null, _idToken = null, _role = null;
let _allSugs = {}, _allActs = {}, _auditLog = [];
let _sugFilter = 'all', _activeSugId = null, _activeActId = null;
let _pollTimer = null, _unsubSugs = null, _unsubActs = null;
let _analyticsRange   = { preset: '30d', customFrom: '', customTo: '' };
let _analyticsSubTab  = 'overview';
let _analyticsB2C     = null;
let _analyticsLoading = false;
let _charts           = {};

// ── Auth ──────────────────────────────────────────────────────────
auth.onAuthStateChanged(async user => {
  if (!user) { showLogin(); return; }
  try {
    const result = await user.getIdTokenResult(true);
    const role   = result.claims.studioRole;
    if (!role) { await auth.signOut(); loginErr('Kein Zugang: Kein Studio-Rolle zugewiesen.'); return; }
    _me = user; _idToken = result.token; _role = role;
    showAdmin();
  } catch (e) { await auth.signOut(); loginErr(fmtAuthErr(e.code || e.message)); }
});

async function signIn() {
  const email = document.getElementById('inp-email').value.trim();
  const pw    = document.getElementById('inp-pw').value;
  const btn   = document.getElementById('sign-in-btn');
  loginErr(''); btn.disabled = true; btn.textContent = '…';
  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch (err) {
    loginErr(fmtAuthErr(err.code || err.message));
    btn.disabled = false; btn.textContent = 'Anmelden';
  }
}

async function signOut() {
  detachListeners();
  await auth.signOut();
  _me = null; _idToken = null; _role = null;
  showLogin();
}

function loginErr(msg) { document.getElementById('login-err').textContent = msg; }
function fmtAuthErr(code) {
  if (['auth/user-not-found','auth/wrong-password','auth/invalid-credential'].includes(code))
    return 'E-Mail oder Passwort falsch.';
  return 'Anmeldung fehlgeschlagen (' + code + ')';
}
function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-app').style.display    = 'none';
  const btn = document.getElementById('sign-in-btn');
  btn.disabled = false; btn.textContent = 'Anmelden';
}
function showAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-app').style.display    = 'block';
  document.getElementById('top-user-email').textContent = _me.email || '';
  document.getElementById('top-user-role').textContent  = _role;
  // Restrict Nutzer/Einstellungen/Tags to superadmin
  if (_role !== 'superadmin') {
    document.getElementById('nav-users').style.display    = 'none';
    document.getElementById('nav-settings').style.display = 'none';
    document.getElementById('nav-tags').style.display     = 'none';
  }
  // Researcher only sees Vorschläge
  if (_role === 'researcher') {
    document.getElementById('nav-dashboard').style.display  = 'none';
    document.getElementById('nav-activities').style.display = 'none';
    document.getElementById('nav-analytics').style.display  = 'none';
    document.getElementById('nav-sources').style.display    = 'none';
    document.getElementById('nav-pipeline').style.display   = 'none';
    showTab('suggestions');
  } else {
    showTab('dashboard');
  }
  attachListeners();
}

// ── Data loading ──────────────────────────────────────────────────
function attachListeners() {
  if (!isLocalEmulator) {
    _loadDataViaFunction();
    _pollTimer = setInterval(_loadDataViaFunction, 5000);
  } else {
    _unsubSugs = db.ref('suggestions').on('value', snap => {
      _allSugs = snap.val() || {};
      refreshCurrentTab();
    });
    _unsubActs = db.ref('activities').on('value', snap => {
      _allActs = snap.val() || {};
      refreshCurrentTab();
    });
  }
}

function detachListeners() {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  if (_unsubSugs) { db.ref('suggestions').off('value', _unsubSugs); _unsubSugs = null; }
  if (_unsubActs) { db.ref('activities').off('value', _unsubActs);  _unsubActs = null; }
}

async function _loadDataViaFunction() {
  try {
    await refreshIdToken();
    const res = await fetch('/.netlify/functions/studio-data', {
      headers: { 'Authorization': `Bearer ${_idToken}` },
    });
    if (!res.ok) return;
    const data = await res.json();
    _allSugs  = data.suggestions || {};
    _allActs  = data.activities  || {};
    _auditLog = data.auditLog    || [];
    refreshCurrentTab();
  } catch {}
}

function refreshCurrentTab() {
  const active = document.querySelector('.tab-panel.active');
  if (!active) return;
  const id = active.id;
  if (id === 'tab-dashboard')   renderDashboard();
  if (id === 'tab-suggestions') renderSugList();
  if (id === 'tab-activities')  renderActList();
}

// ── Tab management ────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const panel  = document.getElementById('tab-' + name);
  const navBtn = document.getElementById('nav-' + name);
  if (panel)  panel.classList.add('active');
  if (navBtn) navBtn.classList.add('active');

  if (name === 'dashboard')   renderDashboard();
  if (name === 'suggestions') renderSugList();
  if (name === 'activities')  renderActList();
  if (name === 'sources')     renderSources();
  if (name === 'pipeline')    renderPipeline();
  if (name === 'users')       loadUsers();
  if (name === 'settings')    renderSettings();
  if (name === 'analytics')   renderAnalytics();
}

// ── Suggestions tab ───────────────────────────────────────────────
function setSugFilter(f, el) {
  _sugFilter = f;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  renderSugList();
}

function renderSugList() {
  const q = (document.getElementById('sug-search')?.value || '').toLowerCase();
  const items = Object.entries(_allSugs)
    .filter(([, s]) => _sugFilter === 'all' || s.status === _sugFilter)
    .filter(([, s]) => !q || (s.title || '').toLowerCase().includes(q) || (s.city || '').toLowerCase().includes(q))
    .sort(([, a], [, b]) => (b.createdAt || 0) - (a.createdAt || 0));

  const el = document.getElementById('sug-list');
  if (!el) return;
  if (!items.length) {
    el.innerHTML = '<div class="empty-state">Keine Vorschläge</div>'; return;
  }
  el.innerHTML = items.map(([id, s]) => `
    <div class="sug-card${id === _activeSugId ? ' active' : ''}" onclick="selectSuggestion('${esc(id)}')">
      <div class="sug-title">${esc(s.title || '—')}</div>
      <div class="sug-meta">
        <span class="status-dot ${esc(s.status)}"></span>
        <span>${esc(s.city || '')}</span>
        <span>·</span>
        <span>${esc(s.category || '')}</span>
      </div>
    </div>
  `).join('');
}

          <div class="edit-field full"><label class="edit-label">Abweichende Zeiten / Schließtage (JSON, z. B. [{"date":"2026-12-25","closed":true}])</label><textarea class="edit-textarea" id="ef-exceptions" rows="3" placeholder='[{"date":"2026-12-25","closed":true},{"date":"2026-12-31","open":"11:00","close":"18:00"}]'></textarea></div>

}

// ── Approve / Reject ──────────────────────────────────────────────
async function approve(suggestionId) {
  const note = document.getElementById('action-note')?.value?.trim() || '';
  setActionBtns(true);
  try {
    await refreshIdToken();
    const res = await callFunction('studio-approve', { suggestionId, notes: note }, _idToken);
    if (res.error) throw new Error(res.error);
    showActionResult('ok', res.idempotent
      ? `Bereits freigegeben — Aktivitäts-ID: ${res.activityId}`
      : `Freigegeben ✓ Aktivitäts-ID: ${res.activityId}`);
    toast('Freigegeben!');
  } catch (err) { showActionResult('err', 'Fehler: ' + err.message); setActionBtns(false); }
}

async function reject(suggestionId) {
  const reason = document.getElementById('action-note')?.value?.trim() || '';
  if (!reason) { showActionResult('err', 'Bitte eine Begründung eingeben.'); return; }
  setActionBtns(true);
  try {
    await refreshIdToken();
    const res = await callFunction('studio-reject', { suggestionId, reason }, _idToken);
    if (res.error) throw new Error(res.error);
    showActionResult('ok', 'Abgelehnt.');
    toast('Abgelehnt.');
  } catch (err) { showActionResult('err', 'Fehler: ' + err.message); setActionBtns(false); }
}

function setActionBtns(disabled) {
  const a = document.getElementById('btn-approve');
  const r = document.getElementById('btn-reject');
  if (a) a.disabled = disabled;
  if (r) r.disabled = disabled;
}
function showActionResult(type, msg) {
  const el = document.getElementById('action-result');
  if (!el) return;
  el.className = 'action-result ' + type; el.textContent = msg;
}

function closeEditForm() {

function _fillEditForm(target, data) {
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = (val != null) ? val : ''; };
  set('ef-title', data.title);   set('ef-tagline', data.tagline); set('ef-eyebrow', data.eyebrow);

      .filter(c => c.id !== primary)

      .join('');

    ).join('');

  set('ef-price-amount', data.price?.amount != null ? data.price.amount : '');

  set('ef-period-to', sch.period?.to || data.operatingPeriod?.to || '');

  const exEl = document.getElementById('ef-exceptions');

function showEditResult(type, msg) {
  const el = document.getElementById('edit-result');
  if (!el) return;
  el.className = 'action-result ' + type; el.textContent = msg;
}
async function saveEdit(target, id) {
  const btn = document.getElementById('btn-save-edit');
  if (btn) btn.disabled = true;
  const getVal = k => { const el = document.getElementById('ef-' + k); return el ? el.value : null; };
  const str = k => getVal(k)?.trim() || null;
  const fields = {
    title: str('title'), tagline: str('tagline'), eyebrow: str('eyebrow'),
    category: (()=>{ const el=document.getElementById('ef-category'); return el&&el.value?el.value:null; })(), description: str('description'),
    providerName: str('providerName'), website: str('website'),
    instagram: str('instagram'), bookingUrl: str('bookingUrl'),
    city: str('city'), district: str('district'),
  };
  if (target === 'suggestion') fields.providerId = str('providerId');
  const addr = str('location');
  fields.location = addr ? { address: addr } : null;
  const latVal = getVal('lat'), lngVal = getVal('lng');
  fields.lat = (latVal != null && latVal.trim() !== '') ? Number(latVal) : null;
  fields.lng = (lngVal != null && lngVal.trim() !== '') ? Number(lngVal) : null;
  const priceType = getVal('price-type'), priceAmt = getVal('price-amount'), priceNote = str('price-note');
  if (priceType) {
    fields.price = { type: priceType, currency: 'EUR' };
    if (priceAmt && priceAmt.trim() !== '') fields.price.amount = Number(priceAmt);
    if (priceNote) fields.price.note = priceNote;
  } else { fields.price = null; }
  // Merge schedule fields without destroying pipeline-extracted data
  const currentStore = target === 'suggestion' ? _allSugs : _allActs;
  const currentSch = { ...((currentStore[id] || {}).schedule || {}) };
  const pfrom = str('period-from'), pto = str('period-to');
  if (pfrom && pto) currentSch.period = { from: pfrom, to: pto };
  const rhRaw = getVal('regularHours')?.trim();
  if (rhRaw) { try { currentSch.regularHours = JSON.parse(rhRaw); } catch(e) { /* keep existing */ } }
  const exRaw = getVal('exceptions')?.trim();
  if (exRaw) { try { currentSch.exceptions = JSON.parse(exRaw); } catch(e) { /* keep existing */ } }
  fields.schedule = Object.keys(currentSch).length > 0 ? currentSch : null;
  fields.openingHours = str('openingHours');
  // Collect tags from chips
  const tagsChips = document.querySelectorAll('#ef-tags-chips .edit-chip[data-tagid]');
  const collectedTags = Array.from(tagsChips).map(el => el.getAttribute('data-tagid')).filter(Boolean);
  fields.tags = collectedTags.length > 0 ? collectedTags : null;
  // Collect additional categories from chips
  const addCatChips = document.querySelectorAll('#ef-addcats .edit-chip.on[data-catid]');
  const collectedAddCats = Array.from(addCatChips).map(el => el.getAttribute('data-catid')).filter(Boolean);
  fields.additionalCategories = collectedAddCats.length > 0 ? collectedAddCats : null;
  const imgRaw = getVal('imageUrls');
  fields.imageUrls = imgRaw ? imgRaw.split('\n').map(u => u.trim()).filter(Boolean) : null;
  if (target === 'suggestion') {
    const srcRaw = getVal('sources');
    fields.sources = srcRaw ? srcRaw.split('\n').map(u => u.trim()).filter(Boolean) : null;
  }
  try {
    await refreshIdToken();
    const res = await callFunction('studio-update', { target, id, ...fields }, _idToken);
    if (res.error) throw new Error(res.error);
    const count = (res.updatedFields || []).filter(f => f !== 'updatedAt').length;
    showEditResult('ok', `Gespeichert ✓ (${count} Felder)`);
    toast('Gespeichert!');
    const store = target === 'suggestion' ? _allSugs : _allActs;
    if (store[id]) Object.assign(store[id], fields);
    setTimeout(() => {
      if (target === 'suggestion') selectSuggestion(id);
      else selectActivity(id);
    }, 800);
  } catch (err) {
    showEditResult('err', 'Fehler: ' + err.message);
    if (btn) btn.disabled = false;
  }
}

// ── Tag search helper for edit form ──────────────────────────────
function _efTagSearch(query, resultsId, chipsId) {
  const resultsEl = document.getElementById(resultsId);
  if (!resultsEl) return;
  const q = (query || '').toLowerCase().trim();
  const chipsEl = document.getElementById(chipsId);
  const currentIds = new Set(
    chipsEl ? Array.from(chipsEl.querySelectorAll('[data-tagid]')).map(el => el.getAttribute('data-tagid')) : []
  );
  const allLabels = { ..._TAG_LABELS };
  for (const [tid, t] of Object.entries(_tagCatalog || {})) {
    if (t.active !== false && !allLabels[tid]) allLabels[tid] = t.label;
  }
  const matches = Object.entries(allLabels)
    .filter(([id, label]) => !currentIds.has(id) && (!q || id.includes(q) || label.toLowerCase().includes(q)))
    .sort((a, b) => a[1].localeCompare(b[1], 'de'))
    .slice(0, 12);
  if (matches.length === 0) {
    resultsEl.innerHTML = q ? `<div class="tag-result-item" style="color:var(--muted);cursor:default;font-style:italic">„${q}" — Tag nicht vorhanden</div>` : '';
    resultsEl.style.display = q ? 'block' : 'none';
    return;
  }
  resultsEl.innerHTML = matches.map(([id, label]) =>
    `<div class="tag-result-item" onmousedown="event.preventDefault();_efTagAdd('${id}','${chipsId}','${resultsId}')" ontouchend="event.preventDefault();_efTagAdd('${id}','${chipsId}','${resultsId}')">${label}</div>`
  ).join('');
  resultsEl.style.display = 'block';
}
function _efTagAdd(tagId, chipsId, resultsId) {
  const chipsEl = document.getElementById(chipsId);
  if (!chipsEl) return;
  const current = Array.from(chipsEl.querySelectorAll('[data-tagid]')).map(el => el.getAttribute('data-tagid'));
  if (current.includes(tagId) || current.length >= 5) return;
  const label = _TAG_LABELS[tagId] || tagId;
  const chip = document.createElement('span');
  chip.className = 'edit-chip tag-chip on';
  chip.setAttribute('data-tagid', tagId);
  chip.innerHTML = `${label}<span class="chip-x" onclick="event.stopPropagation();this.parentElement.remove()">×</span>`;
  chipsEl.appendChild(chip);
  const searchEl = document.getElementById(chipsId.replace('-chips', '-search'));
  if (searchEl) searchEl.value = '';
  const resultsEl = document.getElementById(resultsId);
  if (resultsEl) resultsEl.style.display = 'none';
}

// ── Geo section ───────────────────────────────────────────────────
// Returns true when addr appears to be just a city name (no venue/street info).
function _isCityOnlyAddr(addr, city) {
  if (!addr) return false;
  const a = addr.trim();
  // Has a house number → specific enough
  if (/\d/.test(a)) return false;
  // Contains a venue/street keyword → specific enough
  if (/platz|straße|strasse|str\.|allee|weg|gasse|ring|damm|ufer|park|dom|museum|halle|arena|theater|galerie|center|centrum|haus|hof|hafen|markt|feld|berg|dorf/i.test(a)) return false;
  // Matches city name exactly (with optional country suffix)
  const cityNorm = (city || '').trim().toLowerCase();
  const aNorm = a.toLowerCase();
  if (cityNorm && (aNorm === cityNorm || aNorm.startsWith(cityNorm + ',') || aNorm.startsWith(cityNorm + ' '))) return true;
  // Short address with no comma (single-word or city-country pair) is likely city-only
  if (a.length <= 30 && !a.includes(',')) return true;
  return false;
}

function _renderGeoSection(id, type, data) {
  const storedAddr = data.location?.address || '';
  const venueName  = data.location?.venueName || '';
  const cityFallback = data.city || '';
  // Best pre-fill: venueName if different from addr, then addr, then city
  const bestQuery = venueName || storedAddr || cityFallback;
  const hasCoords = (data.lat != null && data.lng != null && isFinite(data.lat) && isFinite(data.lng));

  const coordsHtml = hasCoords
    ? `<div class="geo-status ok">✓ Koordinaten: ${Number(data.lat).toFixed(5)}, ${Number(data.lng).toFixed(5)} <span style="font-size:.75rem">(${esc(data.geoQuality || 'manuell')})</span></div>`
    : `<div class="geo-status none">Noch keine Koordinaten gespeichert.</div>`;

  const cityOnly = _isCityOnlyAddr(storedAddr || cityFallback, cityFallback);
  const cityWarnHtml = cityOnly
    ? `<div class="geo-warn">⚠ Gespeicherte Adresse enthält nur den Stadtnamen – das ergibt lediglich den Stadtmittelpunkt. Bitte unten den konkreten Veranstaltungsort oder die Straße eingeben.</div>`
    : (storedAddr ? '' : `<div class="geo-warn">⚠ Keine Adresse gespeichert. Suchanfrage manuell eingeben.</div>`);

  const inputRow = `<div class="qa-label" style="margin-top:8px">Suchanfrage (editierbar)</div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <input class="qa-select" id="geo-query-${esc(id)}" type="text" value="${esc(bestQuery)}"
             placeholder="Veranstaltungsort, Straße, Platz + Stadt…" style="flex:1;min-width:180px;max-width:none">
      <button class="btn-save" style="font-size:.82rem;padding:6px 14px;flex-shrink:0"
              onclick="_geocodeSearch('${esc(id)}','${esc(type)}',${hasCoords})">📍 Suchen</button>
    </div>`;

  return `<div class="geo-section">
    <h4>Standort &amp; Koordinaten</h4>
    ${coordsHtml}
    ${cityWarnHtml}
    ${inputRow}
    <div id="geo-results-${esc(id)}" style="display:none;margin-top:10px"></div>
  </div>`;
}

// Nominatim types that indicate a broad administrative area, not a specific venue
const _GEO_CITY_TYPES = new Set(['city','town','village','municipality','administrative','county','state','country','boundary']);

async function _geocodeSearch(id, type, hasExisting) {
  const inputEl = document.getElementById('geo-query-' + id);
  const address = inputEl ? inputEl.value.trim() : '';
  const resultsDiv = document.getElementById('geo-results-' + id);
  if (!resultsDiv) return;
  if (!address || address.length < 2) {
    resultsDiv.style.display = 'block';
    resultsDiv.innerHTML = '<div style="font-size:.82rem;color:var(--pink)">Bitte eine Suchanfrage eingeben.</div>';
    return;
  }
  resultsDiv.style.display = 'block';
  resultsDiv.innerHTML = '<div style="font-size:.82rem;color:var(--muted)">Suche läuft…</div>';
  try {
    await refreshIdToken();
    const res = await callFunction('studio-geocode', { query: address }, _idToken);
    if (res.error) throw new Error(res.error);
    const candidates = res.candidates || [];
    if (candidates.length === 0) {
      resultsDiv.innerHTML = '<div style="font-size:.82rem;color:var(--muted)">Keine Ergebnisse gefunden. Suchanfrage anpassen?</div>';
      return;
    }
    const replaceWarn = hasExisting
      ? `<div class="geo-warn">⚠ Vorhandene Koordinaten werden ersetzt. Bitte sorgfältig prüfen.</div>`
      : '';
    resultsDiv.innerHTML =
      `<div style="font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Kandidaten – Auswählen &amp; bestätigen</div>${replaceWarn}` +
      candidates.map((c, i) => {
        const isBroad = _GEO_CITY_TYPES.has(c.type);
        const broadBadge = isBroad
          ? `<span style="font-size:.72rem;background:#FEF3C7;color:#92400E;border-radius:4px;padding:1px 5px;margin-left:4px">Stadtgebiet – ungenauer Standort</span>`
          : '';
        return `<div class="geo-candidate" id="geo-cand-${id}-${i}"
            onclick="_geocodeSelectCandidate('${esc(id)}','${esc(type)}',${c.lat},${c.lng},${i},${!!hasExisting})">
          <div class="geo-candidate-name">${esc(c.displayName)}${broadBadge}</div>
          <div class="geo-candidate-coords">${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}${c.type ? ' · ' + esc(c.type) : ''}</div>
        </div>`;
      }).join('');
  } catch (err) {
    resultsDiv.innerHTML = `<div style="font-size:.82rem;color:var(--pink)">Fehler: ${esc(err.message)}</div>`;
  }
}

function _geocodeSelectCandidate(id, type, lat, lng, idx, hasExisting) {
  const resultsDiv = document.getElementById('geo-results-' + id);
  if (!resultsDiv) return;
  resultsDiv.querySelectorAll('.geo-candidate').forEach(el => el.classList.remove('selected'));
  const sel = document.getElementById(`geo-cand-${id}-${idx}`);
  if (sel) sel.classList.add('selected');
  // Strip country suffix from display name for a cleaner address suggestion
  const rawLabel = sel ? (sel.querySelector('.geo-candidate-name')?.textContent || '') : '';
  const addrSuggestion = rawLabel.replace(/,\s*Deutschland\s*$/i, '').trim();
  const existing = document.getElementById('geo-confirm-' + id);
  if (existing) existing.remove();
  const overwriteWarn = hasExisting
    ? `<div class="geo-warn">⚠ Bestehende Koordinaten werden überschrieben.</div>`
    : '';
  const confirmHtml = `<div class="geo-confirm" id="geo-confirm-${esc(id)}">
    <p><strong>Koordinaten speichern?</strong><br><span style="color:var(--muted)">${lat.toFixed(6)}, ${lng.toFixed(6)}</span></p>
    ${overwriteWarn}
    <div style="margin:8px 0">
      <label style="display:flex;align-items:center;gap:8px;font-size:.82rem;cursor:pointer">
        <input type="checkbox" id="geo-save-addr-${esc(id)}" checked style="width:16px;height:16px;cursor:pointer">
        <span>Adresse aktualisieren</span>
      </label>
      <input class="qa-select" id="geo-addr-input-${esc(id)}" type="text" value="${esc(addrSuggestion)}"
             style="margin-top:6px;width:100%;box-sizing:border-box" placeholder="Konkrete Adresse oder Veranstaltungsort">
      <div style="font-size:.75rem;color:var(--muted);margin-top:4px">Nur das Adressfeld wird aktualisiert – Stadt und Stadtteil bleiben unverändert.</div>
    </div>
    <div class="geo-confirm-actions">
      <button class="btn-save" style="font-size:.82rem;padding:6px 14px" onclick="_geocodeSave('${esc(id)}','${esc(type)}',${lat},${lng})">✓ Speichern</button>
      <button class="btn-cancel" style="font-size:.82rem;padding:6px 14px" onclick="document.getElementById('geo-results-${esc(id)}').style.display='none'">Abbrechen</button>
    </div>
  </div>`;
  resultsDiv.insertAdjacentHTML('beforeend', confirmHtml);
}

async function _geocodeSave(id, type, lat, lng) {
  try {
    await refreshIdToken();
    const saveAddr = document.getElementById('geo-save-addr-' + id)?.checked;
    const addrInput = document.getElementById('geo-addr-input-' + id)?.value?.trim();
    const payload = { target: type, id, lat, lng, geoQuality: 'manual' };
    if (saveAddr && addrInput) payload.location = { address: addrInput };
    const res = await callFunction('studio-update', payload, _idToken);
    if (res.error) throw new Error(res.error);
    const cache = type === 'activity' ? _allActs : _allSugs;
    if (cache[id]) {
      cache[id].lat = lat;
      cache[id].lng = lng;
      cache[id].geoQuality = 'manual';
      if (saveAddr && addrInput) {
        if (!cache[id].location) cache[id].location = {};
        cache[id].location.address = addrInput;
      }
    }
    toast('Koordinaten gespeichert ✓');
    if (type === 'activity') selectActivity(id);
    else selectSuggestion(id);
  } catch (err) {
    toast('Fehler beim Speichern: ' + err.message);
  }
}

function _qaUpdateAddCats(id) {
  const primarySel = document.getElementById('qa-cat-' + id);
  const primaryId = primarySel ? primarySel.value : '';
  const addCatsEl = document.getElementById('qa-addcats-' + id);
  if (!addCatsEl) return;
  addCatsEl.querySelectorAll('[data-qacatid]').forEach(chip => {
    const cid = chip.getAttribute('data-qacatid');
    if (cid === primaryId) {
      chip.style.display = 'none';
      chip.classList.remove('on');
    } else {
      chip.style.display = '';
    }
  });
}

function _qaToggleCat(chip, primarySelId) {
  chip.classList.toggle('on');
}

function _qaTagHide(id) {
  // Delay hiding so mousedown/touchend on a result item fires first
  setTimeout(() => {
    const r = document.getElementById('qa-tagresults-' + id);
    if (r) r.style.display = 'none';
  }, 300);
}

function _qaTagSearch(id, query) {
  const resultsEl = document.getElementById('qa-tagresults-' + id);
  if (!resultsEl) return;
  const q = (query || '').toLowerCase().trim();
  const tagsEl = document.getElementById('qa-tags-' + id);
  const currentIds = new Set(
    tagsEl ? Array.from(tagsEl.querySelectorAll('[data-qatagid]')).map(el => el.getAttribute('data-qatagid')) : []
  );
  // Merge baseline labels with any custom tags loaded into _tagCatalog
  const allLabels = { ..._TAG_LABELS };
  for (const [tid, t] of Object.entries(_tagCatalog || {})) {
    if (t.active !== false && !allLabels[tid]) allLabels[tid] = t.label;
  }
  const matches = Object.entries(allLabels)
    .filter(([tid, label]) => !currentIds.has(tid) && (!q || tid.includes(q) || label.toLowerCase().includes(q)))
    .sort((a, b) => a[1].localeCompare(b[1], 'de'))
    .slice(0, 12);
  if (matches.length === 0) {
    resultsEl.innerHTML = q ? `<div class="qa-tag-result-item" style="color:var(--muted);cursor:default;font-style:italic">„${q}" — Tag nicht vorhanden</div>` : '';
    resultsEl.style.display = q ? 'block' : 'none';
    return;
  }
  // Use onmousedown+ontouchend with preventDefault to fire before blur
  resultsEl.innerHTML = matches.map(([tid, label]) =>
    `<div class="qa-tag-result-item" onmousedown="event.preventDefault();_qaTagAdd('${id}','${tid}')" ontouchend="event.preventDefault();_qaTagAdd('${id}','${tid}')">${label}</div>`
  ).join('');
  resultsEl.style.display = 'block';
}

function _qaTagAdd(id, tagId) {
  const tagsEl = document.getElementById('qa-tags-' + id);
  if (!tagsEl) return;
  const current = Array.from(tagsEl.querySelectorAll('[data-qatagid]')).map(el => el.getAttribute('data-qatagid'));
  if (current.includes(tagId)) return;
  if (current.length >= 5) {
    const statusEl = document.getElementById('qa-status-' + id);
    if (statusEl) { statusEl.className = 'qa-status err'; statusEl.textContent = 'Maximal 5 Tags erlaubt'; setTimeout(()=>{ if(statusEl.textContent==='Maximal 5 Tags erlaubt') statusEl.textContent=''; },2000); }
    return;
  }
  const label = _TAG_LABELS[tagId] || tagId;
  const chip = document.createElement('span');
  chip.className = 'qa-chip tag';
  chip.setAttribute('data-qatagid', tagId);
  chip.innerHTML = `${label}<span class="chip-x" onclick="event.stopPropagation();this.parentElement.remove()">×</span>`;
  tagsEl.appendChild(chip);
  const searchEl = document.getElementById('qa-tagsearch-' + id);
  if (searchEl) searchEl.value = '';
  const resultsEl = document.getElementById('qa-tagresults-' + id);
  if (resultsEl) resultsEl.style.display = 'none';
}

async function _saveQuickAssign(id, type) {
  const btn = document.getElementById('qa-btn-' + id);
  const statusEl = document.getElementById('qa-status-' + id);
  if (btn) btn.disabled = true;
  if (statusEl) { statusEl.className = 'qa-status'; statusEl.textContent = ''; }

  const primarySel = document.getElementById('qa-cat-' + id);
  const category = primarySel ? (primarySel.value || null) : null;

  const addCatChips = document.querySelectorAll(`#qa-addcats-${id} .qa-chip.on[data-qacatid]`);
  const additionalCategories = Array.from(addCatChips).map(el => el.getAttribute('data-qacatid')).filter(Boolean);

  const tagChips = document.querySelectorAll(`#qa-tags-${id} [data-qatagid]`);
  const tags = Array.from(tagChips).map(el => el.getAttribute('data-qatagid')).filter(Boolean);

  const updates = {
    ...(category !== null ? { category } : {}),
    additionalCategories: additionalCategories.length > 0 ? additionalCategories : null,
    tags: tags.length > 0 ? tags : null,
  };

  try {
    await refreshIdToken();
    const res = await callFunction('studio-update', { target: type, id, ...updates }, _idToken);
    if (res.error) throw new Error(res.error);
    if (statusEl) { statusEl.className = 'qa-status ok'; statusEl.textContent = 'Gespeichert ✓'; }
    const store = type === 'suggestion' ? _allSugs : _allActs;
    if (store[id]) Object.assign(store[id], updates);
    toast('Kategorien & Tags gespeichert!');
  } catch (err) {
    if (statusEl) { statusEl.className = 'qa-status err'; statusEl.textContent = 'Fehler: ' + err.message; }
  } finally {
    if (btn) btn.disabled = false;
  }
}

let _tagCatalog = {};

async function loadTagCatalog() {
  const container = document.getElementById('tag-mgmt-container');
  if (!container) return;
  container.innerHTML = '<p style="color:var(--muted)">Lade Tag-Katalog…</p>';
  try {
    const res = await callFunction('studio-tags', null, _idToken, 'GET');
    if (res.tags) {
      _tagCatalog = {};
      for (const t of res.tags) _tagCatalog[t.id] = t;
    }
    // Seed from baseline for display even if endpoint is unavailable
    for (const [id, label] of Object.entries(_TAG_LABELS)) {
      if (!_tagCatalog[id]) _tagCatalog[id] = { id, label, synonyms: [], active: true, baseline: true };
    }
  } catch {
    for (const [id, label] of Object.entries(_TAG_LABELS)) {
      _tagCatalog[id] = _tagCatalog[id] || { id, label, synonyms: [], active: true, baseline: true };
    }
  }
  _renderTagManagement();
}

  const active = Object.values(_tagCatalog).filter(t => t.active !== false).sort((a,b) => a.label.localeCompare(b.label,'de'));

function _showNewTagForm() {
  const f = document.getElementById('new-tag-form');
  if (f) { f.style.display = ''; document.getElementById('ntf-id').focus(); }
}

async function _createTag() {
  const id = (document.getElementById('ntf-id').value || '').trim();
  const label = (document.getElementById('ntf-label').value || '').trim();
  const statusEl = document.getElementById('ntf-status');
  if (!id || !label) { statusEl.textContent = 'ID und Anzeigename erforderlich'; return; }
  if (!/^[a-z][a-z0-9_]{0,39}$/.test(id)) { statusEl.textContent = 'Ungültige ID (a-z, dann a-z/0-9/_, max 40)'; return; }
  await refreshIdToken();
  const res = await callFunction('studio-tags', { action: 'upsert', id, label }, _idToken);
  if (res.ok) {
    document.getElementById('ntf-id').value = '';
    document.getElementById('ntf-label').value = '';
    statusEl.textContent = '';
    document.getElementById('new-tag-form').style.display = 'none';
    _TAG_LABELS[id] = label;
    _ALL_TAG_IDS.add(id);
    await loadTagCatalog();
  } else { statusEl.textContent = res.error || 'Fehler'; }
}

async function _editTagLabel(tagId) {
  const t = _tagCatalog[tagId];
  if (!t) return;
  const newLabel = prompt(`Anzeigename für "${esc(tagId)}" ändern:`, t.label);
  if (!newLabel || newLabel.trim() === t.label) return;
  await refreshIdToken();
  const res = await callFunction('studio-tags', { action: 'upsert', id: tagId, label: newLabel.trim(), synonyms: t.synonyms || [] }, _idToken);
  if (res.ok) { _TAG_LABELS[tagId] = newLabel.trim(); await loadTagCatalog(); }
  else alert(res.error || 'Fehler');
}

async function _editSynonyms(tagId) {
  const t = _tagCatalog[tagId];
  if (!t) return;
  const input = prompt(`Aliase für "${esc(t.label)}" (kommagetrennt, leer zum Löschen):`, (t.synonyms||[]).join(', '));
  if (input === null) return;
  const synonyms = input.split(',').map(s => s.trim()).filter(Boolean);
  await refreshIdToken();
  const res = await callFunction('studio-tags', { action: 'upsert', id: tagId, label: t.label, synonyms }, _idToken);
  if (res.ok) await loadTagCatalog();
  else alert(res.error || 'Fehler');
}

async function _deactivateTag(tagId) {
  if (!confirm(`Tag "${esc(tagId)}" deaktivieren?\nEr bleibt in bestehenden Aktivitäten erhalten, kann aber nicht mehr neu zugewiesen werden.`)) return;
  await refreshIdToken();
  const res = await callFunction('studio-tags', { action: 'deactivate', id: tagId }, _idToken);
  if (res.ok) await loadTagCatalog();
  else alert(res.error || 'Fehler');
}

async function _reactivateTag(tagId) {
  await refreshIdToken();
  const res = await callFunction('studio-tags', { action: 'reactivate', id: tagId }, _idToken);
  if (res.ok) await loadTagCatalog();
  else alert(res.error || 'Fehler');
}
