// ── Helpers ───────────────────────────────────────────────────────
async function refreshIdToken() {
  if (!_me) return;
  _idToken = await _me.getIdToken(true);
}
async function callFunction(name, body, idToken, method='POST') {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', ...(idToken ? {'Authorization': `Bearer ${idToken}`} : {}) },
  };
  if (method !== 'GET' && body != null) opts.body = JSON.stringify(body);
  const res = await fetch(`/.netlify/functions/${name}`, opts);
  return res.json();
}
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(ts) {
  return new Date(ts).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function statusLabel(s) {
  return { submitted:'Eingereicht', draft:'Entwurf', approved:'Genehmigt', rejected:'Abgelehnt' }[s] || s;
}
function actionLabel(a) {
  return { approve:'Freigabe', reject:'Ablehnung', submit:'Einreichung', edit:'Bearbeitung',
           set_role:'Rolle', bootstrap_superadmin:'Bootstrap' }[a] || a;
}
function fieldRow(label, value, isLink = false) {
  if (!value) return '';
  const content = isLink ? `<a href="${esc(value)}" target="_blank" rel="noopener">${esc(value)}</a>` : esc(value);
  return `<div class="field-row"><span class="field-label">${esc(label)}</span><span class="field-value">${content}</span></div>`;
}
function priceChip(price) {
  if (!price) return '';
  return `<span class="chip">💶 ${formatPrice(price)}</span>`;
}
function formatPrice(price) {
  if (!price) return '';
  if (price.type === 'free')     return 'Kostenlos';
  if (price.type === 'donation') return 'Spende';
  const amt = price.amount ? `${price.amount} ${price.currency || 'EUR'}` : '';
  return amt + (price.note ? ` · ${price.note}` : '');
}
function formatSchedule(schedule) {
  if (!schedule) return '';
  const parts = [];
  const DAY_LABELS = { mo:'Mo', di:'Di', mi:'Mi', do:'Do', fr:'Fr', sa:'Sa', so:'So' };
  const fmtDays = days => (days || []).map(d => DAY_LABELS[d] || d).join(', ');

  // Specific dates
  if (Array.isArray(schedule.dates) && schedule.dates.length > 0) {
    const dateLines = schedule.dates.slice(0, 10).map(d => {
      let s = d.date;
      if (d.startTime) s += ' ' + d.startTime;
      if (d.endTime)   s += '–' + d.endTime + ' Uhr';
      if (d.note)      s += ' (' + d.note + ')';
      return s;
    });
    parts.push(dateLines.join(', '));
    if (schedule.dates.length > 10) parts.push(`+${schedule.dates.length - 10} weitere`);
  }

  // Continuous period
  if (schedule.period) {
    parts.push(`${schedule.period.from} – ${schedule.period.to}`);
  }

  // Recurring pattern
  if (schedule.recurrence) {
    const rec = schedule.recurrence;
    let s = { weekly: 'wöchentlich', biweekly: '2-wöchentlich', monthly: 'monatlich', daily: 'täglich', other: 'wiederkehrend' }[rec.pattern] || rec.pattern;
    if (rec.days && rec.days.length > 0) s += ' ' + fmtDays(rec.days);
    if (rec.startTime) s += ' ' + rec.startTime;
    if (rec.endTime)   s += '–' + rec.endTime + ' Uhr';
    if (rec.note)      s += ' (' + rec.note + ')';
    parts.push(s);
  }

  // Regular opening hours
  if (Array.isArray(schedule.regularHours) && schedule.regularHours.length > 0) {
    const hourLines = schedule.regularHours.map(h => {
      let s = fmtDays(h.days);
      if (h.open && h.close) s += ': ' + h.open + '–' + h.close + ' Uhr';
      else if (h.open)       s += ': ab ' + h.open + ' Uhr';
      if (h.note)            s += ' (' + h.note + ')';
      return s;
    });
    parts.push(hourLines.join(', '));
  }

  // Exceptions
  if (Array.isArray(schedule.exceptions) && schedule.exceptions.length > 0) {
    const excLines = schedule.exceptions.slice(0, 5).map(e => {
      let s = e.date;
      if (e.closed)         s += ': geschlossen';
      else if (e.open && e.close) s += ': ' + e.open + '–' + e.close + ' Uhr';
      if (e.note)           s += ' (' + e.note + ')';
      return s;
    });
    parts.push('Abweichend: ' + excLines.join(', '));
  }

  if (schedule.timezone) parts.push('(' + schedule.timezone + ')');

  // Legacy fallback for old-format schedule objects
  if (parts.length === 0) {
    if (schedule.note) return schedule.note;
    if (schedule.daysOfWeek) {
      const legacyDays = ['So','Mo','Di','Mi','Do','Fr','Sa'];
      return [schedule.daysOfWeek.map(d => legacyDays[d]).join(', '), schedule.time].filter(Boolean).join(' ');
    }
  }

  return parts.filter(Boolean).join(' · ');
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Sources ───────────────────────────────────────────────────────
let _allSources = {};
let _sourcesLoaded = false;

async function renderSources() {
  const el = document.getElementById('sources-content');
  if (!el) return;
  el.innerHTML = '<p style="color:var(--muted)">Lade Quellen…</p>';
  try {
    await refreshIdToken();
    const res = await fetch('/.netlify/functions/discovery-sources', {
      headers: { 'Authorization': `Bearer ${_idToken}` },
    });
    if (!res.ok) { el.innerHTML = `<p style="color:var(--pink)">Fehler: HTTP ${res.status}</p>`; return; }
    const data = await res.json();
    _allSources = data.sources || {};
    _sourcesLoaded = true;
    _renderSourcesContent(el);
  } catch (e) {
    el.innerHTML = `<p style="color:var(--pink)">Fehler: ${esc(e.message)}</p>`;
  }
}

function _renderSourcesContent(el) {
  const canEdit = _role === 'editor' || _role === 'superadmin';
  const sources = Object.entries(_allSources).sort(([,a],[,b]) => (b.addedAt||0)-(a.addedAt||0));

  el.innerHTML = `
    <h2 style="font-size:1.375rem;font-weight:800;letter-spacing:-.5px;margin-bottom:6px">
      Discovery-Quellen
    </h2>
    <p style="color:var(--muted);font-size:.875rem;margin-bottom:24px">
      Verwaltete Quell-URLs für die Discovery-Pipeline. Nur aktive Quellen werden beim nächsten Pipeline-Lauf abgerufen.
    </p>
    <div class="sources-layout">
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <span style="font-weight:700">${sources.length} Quelle${sources.length !== 1 ? 'n' : ''}</span>
          <span style="font-size:.8rem;color:var(--muted)">${sources.filter(([,s])=>s.active).length} aktiv</span>
        </div>
        ${sources.length === 0
          ? `<div class="empty-state" style="padding:40px 0;background:var(--card);border-radius:var(--radius);border:1.5px dashed var(--border)">
               Noch keine Quellen eingetragen.${canEdit ? ' Füge die erste Quelle rechts hinzu.' : ''}
             </div>`
          : sources.map(([id, s]) => _sourceCard(id, s, canEdit)).join('')
        }
      </div>
      ${canEdit ? _sourceForm() : ''}
    </div>
  `;
}

function _sourceCard(id, s, canEdit) {
  const typeLabel = { website:'Website', 'open-data':'Open Data', api:'API', social:'Social', other:'Andere' }[s.sourceType] || s.sourceType;
  const activeClass = s.active ? 'on' : 'off';
  const addedDate = s.addedAt ? new Date(s.addedAt).toLocaleDateString('de-DE') : '–';
  return `
    <div class="source-card" id="src-card-${esc(id)}">
      <div class="source-active-dot ${activeClass}" title="${s.active ? 'Aktiv' : 'Inaktiv'}"></div>
      <div class="source-card-body">
        <div class="source-card-name">${esc(s.name)}</div>
        <div class="source-card-url"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>
        <div class="source-card-meta">
          <span><strong>${esc(s.city)}</strong></span>
          <span class="source-type-badge">${esc(typeLabel)}</span>
          <span>Hinzugefügt ${esc(addedDate)}</span>
          ${s.notes ? `<span style="font-style:italic">${esc(s.notes)}</span>` : ''}
        </div>
      </div>
      ${canEdit ? `
        <div class="source-actions">
          <button class="btn-icon toggle-on" title="${s.active ? 'Deaktivieren' : 'Aktivieren'}"
            onclick="toggleSource('${esc(id)}',${!s.active})">${s.active ? 'Pause' : 'Start'}</button>
          <button class="btn-icon" title="Löschen" onclick="deleteSource('${esc(id)}')">✕</button>
        </div>` : ''}
    </div>
  `;
}

function _sourceForm() {
  return `
    <div class="sources-form">
      <h3>Neue Quelle hinzufügen</h3>
      <div class="form-row">
        <label class="form-label">URL *</label>
        <input type="url" id="src-url" class="form-input" placeholder="https://…">
      </div>
      <div class="form-row">
        <label class="form-label">Name *</label>
        <input type="text" id="src-name" class="form-input" placeholder="z. B. KW Köln Programm">
      </div>
      <div class="form-row">
        <label class="form-label">Stadt *</label>
        <input type="text" id="src-city" class="form-input" placeholder="z. B. Köln">
      </div>
      <div class="form-row">
        <label class="form-label">Typ *</label>
        <select id="src-type" class="form-select">
          <option value="">— Bitte wählen —</option>
          <option value="website">Website</option>
          <option value="open-data">Open Data</option>
          <option value="api">API</option>
          <option value="social">Social Media</option>
          <option value="other">Andere</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Notizen</label>
        <input type="text" id="src-notes" class="form-input" placeholder="Optional: Hinweis zur Quelle">
      </div>
      <button class="btn-primary" style="width:100%" onclick="addSource()">Quelle hinzufügen</button>
      <div class="src-result" id="src-result"></div>
    </div>
  `;
}

async function addSource() {
  const url        = document.getElementById('src-url')?.value.trim();
  const name       = document.getElementById('src-name')?.value.trim();
  const city       = document.getElementById('src-city')?.value.trim();
  const sourceType = document.getElementById('src-type')?.value;
  const notes      = document.getElementById('src-notes')?.value.trim();
  const resultEl   = document.getElementById('src-result');

  resultEl.className = 'src-result';
  resultEl.textContent = '';

  if (!url || !name || !city || !sourceType) {
    resultEl.className = 'src-result err';
    resultEl.textContent = 'Bitte alle Pflichtfelder ausfüllen.';
    return;
  }
  try { new URL(url); } catch {
    resultEl.className = 'src-result err';
    resultEl.textContent = 'Keine gültige URL.';
    return;
  }

  const btn = document.querySelector('.sources-form .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  try {
    await refreshIdToken();
    const res = await fetch('/.netlify/functions/discovery-sources', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${_idToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, name, city, sourceType, notes: notes || null }),
    });
    const data = await res.json();
    if (res.status === 409) {
      resultEl.className = 'src-result err';
      resultEl.textContent = `Doppelte URL – bereits als Quelle gespeichert (ID: ${data.existingId}).`;
    } else if (!res.ok) {
      resultEl.className = 'src-result err';
      resultEl.textContent = data.error || `Fehler ${res.status}`;
    } else {
      resultEl.className = 'src-result ok';
      resultEl.textContent = `Quelle gespeichert (${data.sourceId})`;
      ['src-url','src-name','src-city','src-notes'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
      document.getElementById('src-type').value = '';
      renderSources();
    }
  } catch (e) {
    resultEl.className = 'src-result err';
    resultEl.textContent = 'Netzwerkfehler: ' + e.message;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Quelle hinzufügen'; }
  }
}

async function toggleSource(sourceId, active) {
  try {
    await refreshIdToken();
    const res = await fetch('/.netlify/functions/discovery-sources', {
      method: 'PATCH',
      headers: { 'Authorization': `Bearer ${_idToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ sourceId, active }),
    });
    if (res.ok) { showToast(active ? 'Quelle aktiviert' : 'Quelle pausiert'); renderSources(); }
    else showToast('Fehler beim Aktualisieren');
  } catch { showToast('Netzwerkfehler'); }
}

async function deleteSource(sourceId) {
  if (!confirm('Quelle wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.')) return;
  try {
    await refreshIdToken();
    const res = await fetch('/.netlify/functions/discovery-sources', {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${_idToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ sourceId }),
    });
    if (res.ok) { showToast('Quelle gelöscht'); renderSources(); }
    else showToast('Fehler beim Löschen');
  } catch { showToast('Netzwerkfehler'); }
}

// ── Discovery Pipeline ────────────────────────────────────────────
let _pipelineRunning = false;

async function renderPipeline() {
  const el = document.getElementById('pipeline-content');
  if (!el) return;
  el.innerHTML = '<p style="color:var(--muted)">Lade Pipeline-Berichte…</p>';
  try {
    await refreshIdToken();
    const res = await fetch('/.netlify/functions/discovery-pipeline', {
      headers: { 'Authorization': `Bearer ${_idToken}` },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      el.innerHTML = `<p style="color:var(--danger)">Fehler: ${esc(err.error || 'HTTP ' + res.status)}</p>`;
      return;
    }
    const { runs } = await res.json();
    const runList = Object.values(runs || {}).sort((a, b) => b.startedAt - a.startedAt);
    el.innerHTML = _renderPipelinePanel(runList);
  } catch (e) {
    el.innerHTML = `<p style="color:var(--danger)">Netzwerkfehler: ${esc(e.message)}</p>`;
  }
}

function _renderPipelinePanel(runs) {
  const canRun = _role === 'editor' || _role === 'superadmin';
  const runBtns = canRun ? `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn btn-secondary" onclick="triggerPipelineRun('dry-run')" id="pipeline-run-btn">▶ Dry-Run (Köln)</button>
      <button class="btn btn-primary" onclick="triggerPipelineRun('live')" id="pipeline-live-btn">⚡ LLM-Lauf (Köln)</button>
    </div>
    <p style="color:var(--muted);font-size:.8rem;margin-bottom:16px">
      <strong>Dry-Run:</strong> Quellen abrufen, Signale erkennen — keine LLM-Aufrufe, keine Speicherung.<br>
      <strong>LLM-Lauf:</strong> Aktivitäten extrahieren, max. 5 Quellen · 10 LLM-Aufrufe · 20 Vorschläge pro Lauf. Ergebnisse als <em>Draft</em> gespeichert, nie veröffentlicht.
    </p>` : '';
  const info = '';

  if (!runs.length) {
    return `<div class="section"><h3 style="margin-bottom:8px">Discovery Pipeline</h3>${info}${runBtns}<p style="color:var(--muted)">Noch keine Pipeline-Läufe.</p></div>`;
  }

  const runCards = runs.map(r => {
    const dt = new Date(r.startedAt).toLocaleString('de-DE');
    const dur = (r.durationMs / 1000).toFixed(1) + 's';
    const signalRows = r.signalSummary
      ? Object.entries(r.signalSummary).map(([k, n]) => {
          const label = { operatingPeriod: 'Veranstaltungszeitraum', openingHours: 'Öffnungszeiten', exceptionalHours: 'Sonderöffnungszeiten', location: 'Standort', price: 'Preis', provider: 'Anbieter' }[k] || k;
          const pct = r.sourcesFetched > 0 ? Math.round(n / r.sourcesFetched * 100) : 0;
          return `<div style="display:flex;justify-content:space-between;font-size:.82rem;padding:2px 0"><span>${esc(label)}</span><span style="color:${n > 0 ? 'var(--green,#22c55e)' : 'var(--muted)'}">${n}/${r.sourcesFetched} Quellen (${pct}%)</span></div>`;
        }).join('')
      : '';

    const srcRows = (r.sourceResults || []).map(sr => {
      if (sr.error) return `<div style="font-size:.82rem;padding:3px 0;color:var(--danger)">✗ <a href="${esc(sr.url)}" target="_blank" rel="noopener">${esc(sr.name || sr.url)}</a> — ${esc(sr.error)}</div>`;
      const detected = sr.signals ? Object.entries(sr.signals).filter(([,v]) => v.detected).map(([k]) => k) : [];

      // JSON-LD badge
      const jsonLdCount = sr.jsonLdEventCount ?? 0;
      const jsonLdBadge = jsonLdCount > 0
        ? `<span style="font-size:.72rem;background:var(--green,#22c55e);color:#fff;border-radius:3px;padding:1px 5px;margin-left:4px">JSON-LD: ${jsonLdCount} Events</span>`
        : '';
      // Embedded script data badge
      const embeddedCount = sr.embeddedScriptEventCount ?? 0;
      const embeddedSources = (sr.embeddedScriptSources || []).join(', ');
      const embeddedBadge = embeddedCount > 0
        ? `<span style="font-size:.72rem;background:var(--info,#3b82f6);color:#fff;border-radius:3px;padding:1px 5px;margin-left:4px">${esc(embeddedSources)}: ${embeddedCount} Events</span>`
        : '';

      // Content quality warning
      const qualityIssues = sr.contentQuality?.issues || [];
      const qualityNote = qualityIssues.length > 0
        ? `<div style="font-size:.75rem;color:var(--warning,#f59e0b);margin-top:2px">⚠ ${esc(qualityIssues.join(' · '))}</div>`
        : '';

      // Text preview — shown in both dry-run and live mode
      const textPreview = sr.condensedPreview
        ? `<details style="margin-top:3px"><summary style="font-size:.75rem;color:var(--muted);cursor:pointer">Textvorschau (bereinigte Inhalte, erste 800 Zeichen)</summary><pre style="font-size:.72rem;white-space:pre-wrap;word-break:break-word;background:var(--surface2,#f8f9fa);padding:6px;border-radius:4px;margin:3px 0 0;max-height:120px;overflow-y:auto">${esc(sr.condensedPreview)}</pre></details>`
        : '';

      const llmDiag = r.mode === 'live'
        ? (() => {
            if (sr.llmSkipped) {
              return `<div style="font-size:.78rem;color:var(--muted);margin-top:2px">LLM übersprungen: ${esc(sr.llmSkipReason || 'Inhalt ungeeignet')}${textPreview}</div>`;
            }
            if (sr.llmActivitiesFound == null) return textPreview;
            const found = sr.llmActivitiesFound;
            const saved = sr.llmActivitiesSaved ?? 0;
            const rejected = sr.llmActivitiesRejected ?? 0;
            const deduped = sr.llmActivitiesDeduplicated ?? 0;
            const diagColor = found === 0 ? 'var(--danger)' : (saved > 0 ? 'var(--green,#22c55e)' : 'var(--muted)');
            const diagText = found === 0
              ? 'LLM: 0 Aktivitäten erkannt — Inhalt prüfen (JS-rendered? Nur Navigation?)'
              : `LLM: ${found} erkannt → ${saved} gespeichert, ${rejected} abgelehnt, ${deduped} Duplikat`;
            return `<div style="font-size:.78rem;color:${diagColor};margin-top:2px">${diagText}${textPreview}</div>`;
          })()
        : textPreview;

      // JSON-LD event sample for dry-run diagnostics
      const jsonLdSample = sr.jsonLdEventSample?.length
        ? `<details style="margin-top:3px"><summary style="font-size:.75rem;color:var(--muted);cursor:pointer">JSON-LD Events (${jsonLdCount} gefunden)</summary><ul style="font-size:.72rem;margin:3px 0 0 14px;padding:0">${sr.jsonLdEventSample.map(e => `<li>${esc(e.name || '(kein Name)')}${e.startDate ? ' · ' + esc(e.startDate) : ''}${e.endDate ? '–' + esc(e.endDate) : ''}</li>`).join('')}${jsonLdCount > 3 ? `<li style="color:var(--muted)">… und ${jsonLdCount - 3} weitere</li>` : ''}</ul></details>`
        : '';

      // Truncation + content-reach status — shown prominently
      const td = sr.truncationDiag;
      const truncationRow = td ? (() => {
        const parts = [];
        if (td.wasTruncated) {
          parts.push(`<span style="color:var(--danger)">✂ Abgeschnitten bei ${td.limitKB}K (${td.fetchedKB}K geladen)</span>`);
        } else {
          parts.push(`<span style="color:var(--green,#22c55e)">✓ Vollständig (${td.fetchedKB}K)</span>`);
        }
        if (td.headComplete === false) {
          parts.push(`<span style="color:var(--danger)">✗ &lt;/head&gt; fehlt — nur CSS/Head erhalten</span>`);
        } else if (td.headComplete === true) {
          parts.push(`<span style="color:var(--green,#22c55e)">✓ &lt;head&gt; vollständig</span>`);
        }
        if (td.bodyFound === false) {
          parts.push(`<span style="color:var(--danger)">✗ &lt;body&gt; nicht erreicht</span>`);
        } else if (td.bodyFound === true) {
          const pct = td.bodyPositionPct != null ? ` bei ${td.bodyPositionPct}%` : '';
          parts.push(`<span style="color:var(--green,#22c55e)">✓ &lt;body&gt; gefunden${pct}</span>`);
        }
        const dataSignals = [];
        if (td.hasNextData) dataSignals.push('__NEXT_DATA__');
        if (td.hasNuxtData) dataSignals.push('__NUXT__');
        if (td.hasJsonScript) dataSignals.push('JSON-Script');
        if (dataSignals.length > 0) {
          const color = td.embeddedEvents > 0 ? 'var(--green,#22c55e)' : 'var(--warning,#f59e0b)';
          parts.push(`<span style="color:${color}">${esc(dataSignals.join(', '))} erkannt${td.embeddedEvents > 0 ? ` → ${td.embeddedEvents} Events extrahiert` : ' → 0 Events (JSON ggf. abgeschnitten)'}</span>`);
        }
        if (td.jsonLdEvents > 0) {
          parts.push(`<span style="color:var(--green,#22c55e)">JSON-LD: ${td.jsonLdEvents} Events</span>`);
        }
        return `<div style="font-size:.75rem;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px">${parts.join('')}</div>`;
      })() : '';

      // HTML structure diagnostics — collapsible detail
      const diag = sr.htmlDiagnostics;
      const htmlStructDiag = diag ? (() => {
        const steps = [
          `Raw: ${(diag.rawSizeChars / 1000).toFixed(0)}K`,
          `−head: ${(diag.afterHeadChars / 1000).toFixed(0)}K`,
          `−scripts: ${(diag.afterScriptsChars / 1000).toFixed(0)}K`,
          `−nav: ${(diag.afterNavChars / 1000).toFixed(0)}K`,
          `→ ${(diag.strippedChars / 1000).toFixed(0)}K Inhalt`,
        ].join(' · ');
        const semantic = [
          diag.hasMain ? '✓ &lt;main&gt;' : '✗ &lt;main&gt;',
          diag.hasRoleMain ? '✓ role=main' : null,
          diag.hasArticle ? '✓ &lt;article&gt;' : null,
        ].filter(Boolean).join(', ');
        const cssWarn = diag.cssLeakPercent > 15
          ? `<span style="color:var(--warning,#f59e0b)"> · CSS-Leak: ${diag.cssLeakPercent}%</span>`
          : (diag.cssLeakPercent > 0 ? ` · CSS: ${diag.cssLeakPercent}%` : '');
        const selectedNote = diag.selectedBy && diag.selectedBy !== 'full-document'
          ? `<span style="color:var(--green,#22c55e)"> · Extraktion: ${esc(diag.selectedBy)}</span>`
          : ` · Extraktion: full-document`;
        return `<details style="margin-top:3px"><summary style="font-size:.75rem;color:var(--muted);cursor:pointer">HTML-Struktur (Details)</summary><div style="font-size:.72rem;padding:3px 0 0">${steps}${cssWarn}${selectedNote}<br>Semantik: ${semantic || '<em>keine Landmarks</em>'}</div></details>`;
      })() : '';

      return `<div style="font-size:.82rem;padding:3px 0">✓ <a href="${esc(sr.url)}" target="_blank" rel="noopener">${esc(sr.name || sr.url)}</a>${jsonLdBadge}${embeddedBadge} — ${sr.textLength?.toLocaleString('de-DE')} Zeichen, Signale: ${detected.length > 0 ? esc(detected.join(', ')) : '<em style="color:var(--muted)">keine</em>'}${truncationRow}${qualityNote}${jsonLdSample}${htmlStructDiag}${llmDiag}</div>`;
    }).join('');
    const skipNotes = [
      r.sourcesSkippedInactive     > 0 ? `${r.sourcesSkippedInactive} inaktiv`     : null,
      r.sourcesSkippedCityMismatch > 0 ? `${r.sourcesSkippedCityMismatch} Stadt-Mismatch` : null,
      r.sourcesSkippedDuplicateUrl > 0 ? `${r.sourcesSkippedDuplicateUrl} Duplikat-URL`  : null,
    ].filter(Boolean);
    const skipBadge = skipNotes.length
      ? `<div style="font-size:.78rem;color:var(--muted);margin-top:2px">Übersprungen: ${esc(skipNotes.join(', '))}</div>`
      : '';

    const modeTag = r.mode === 'live'
      ? `<span style="font-size:.75rem;background:var(--green,#22c55e);color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px">LLM</span>`
      : `<span style="font-size:.75rem;background:var(--muted);color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px">Dry</span>`;

    const llmRow = r.mode === 'live' ? `
      <div style="margin-bottom:8px;padding:8px;background:var(--surface2,#f8f9fa);border-radius:6px">
        <strong style="font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px">LLM-ERGEBNISSE</strong>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px;font-size:.82rem">
          <span>Vorschläge: <strong>${r.suggestionsProposed ?? 0}</strong></span>
          <span>Gespeichert: <strong>${r.suggestionsSaved ?? 0}</strong></span>
          <span>Duplikate: <strong>${r.suggestionsDeduplicated ?? 0}</strong></span>
          <span>LLM-Calls: <strong>${r.llmCallsUsed ?? 0}</strong></span>
          <span>Kosten: <strong>$${(r.estimatedCostUSD ?? 0).toFixed(4)}</strong></span>
        </div>
        ${r.llmErrors?.length ? `<div style="color:var(--danger);font-size:.78rem;margin-top:4px">
          ${r.llmErrors.length} Fehler im LLM-Lauf:
          <ul style="margin:2px 0 0 14px;padding:0">${r.llmErrors.slice(0, 5).map(e => {
            const msg = e.error
              ? esc(e.error.slice(0, 200))
              : e.validationErrors?.length
                ? esc(e.validationErrors.slice(0, 3).join('; '))
                : 'Unbekannter Fehler';
            return `<li>${msg}</li>`;
          }).join('')}</ul>
        </div>` : ''}
      </div>` : '';

    return `<div class="source-card" style="margin-bottom:12px">
      <div class="source-card-body">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <strong style="font-size:.9rem">${esc(r.city)}${modeTag} · ${dt}</strong>
          <span style="font-size:.8rem;color:var(--muted)">${dur} · ${r.successCount} OK / ${r.errorCount} Fehler</span>
        </div>
        ${llmRow}
        ${signalRows ? `<div style="margin-bottom:8px;padding:8px;background:var(--surface2,#f8f9fa);border-radius:6px"><strong style="font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px">SIGNALE PRO QUELLE</strong>${signalRows}</div>` : ''}
        ${srcRows || skipBadge ? `<div><strong style="font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px">QUELLEN (${r.sourcesConsidered ?? 0} gefunden)</strong>${srcRows}${skipBadge}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  return `<div class="section"><h3 style="margin-bottom:8px">Discovery Pipeline</h3>${info}${runBtns}${runCards}</div>`;
}

async function triggerPipelineRun(mode = 'dry-run') {
  if (_pipelineRunning) return;
  if (mode === 'live') {
    const ok = window.confirm(
      'LLM-Lauf starten?\n\n' +
      '• Max. 5 Quellen, 10 LLM-Aufrufe, 20 Vorschläge\n' +
      '• Geschätzte Kosten: < $0.01 pro Lauf (Claude Haiku)\n' +
      '• Ergebnisse als Draft gespeichert – nie automatisch veröffentlicht\n\n' +
      'Fortfahren?'
    );
    if (!ok) return;
  }
  _pipelineRunning = true;
  const dryBtn  = document.getElementById('pipeline-run-btn');
  const liveBtn = document.getElementById('pipeline-live-btn');
  if (dryBtn)  { dryBtn.disabled  = true; }
  if (liveBtn) { liveBtn.disabled = true; liveBtn.textContent = '…läuft'; }
  try {
    await refreshIdToken();
    const res = await fetch('/.netlify/functions/discovery-pipeline', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${_idToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ city: 'Köln', mode }),
    });
    const data = await res.json();
    if (!res.ok) { showToast('Fehler: ' + (data.error || 'HTTP ' + res.status)); return; }
    const saved = data.report?.suggestionsSaved;
    const cost  = data.report?.estimatedCostUSD;
    if (mode === 'live' && saved != null) {
      showToast(`LLM-Lauf abgeschlossen – ${saved} Draft(s) gespeichert (ca. $${cost?.toFixed(4) ?? '?'})`);
    } else {
      showToast('Dry-Run abgeschlossen');
    }
    renderPipeline();
  } catch (e) {
    showToast('Netzwerkfehler: ' + e.message);
  } finally {
    _pipelineRunning = false;
    if (dryBtn)  { dryBtn.disabled  = false; }
    if (liveBtn) { liveBtn.disabled = false; liveBtn.textContent = '⚡ LLM-Lauf (Köln)'; }
  }
}

// ── Analytics ─────────────────────────────────────────────────────
function renderAnalytics() {
  if (!_analyticsB2C && !_analyticsLoading) {
    loadAndRenderAnalytics();
  } else {
    renderAnalyticsContent();
  }
}

async function loadAndRenderAnalytics() {
  if (_analyticsLoading) return;
  _analyticsLoading = true;
  const el = document.getElementById('analytics-content');
  if (el) el.innerHTML = '<div class="analytics-loading">Lade Analytics…</div>';
  try {
    await refreshIdToken();
    const { from, to } = getAnalyticsDates();
    const params = (from && to) ? `?from=${from}&to=${to}` : '';
    const res = await fetch(`/.netlify/functions/analytics-b2c${params}`, {
      headers: { 'Authorization': `Bearer ${_idToken}` },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    _analyticsB2C = await res.json();
  } catch (e) {
    _analyticsB2C = null;
    const el2 = document.getElementById('analytics-content');
    if (el2) el2.innerHTML = `<div class="analytics-error">Fehler beim Laden der Analytics: ${esc(e.message)}</div>`;
    _analyticsLoading = false;
    return;
  }
  _analyticsLoading = false;
  renderAnalyticsContent();
}

function getAnalyticsDates() {
  const today = new Date();
  const toStr = today.toISOString().slice(0, 10);
  if (_analyticsRange.preset === 'custom') {
    return { from: _analyticsRange.customFrom || null, to: _analyticsRange.customTo || null };
  }
  if (_analyticsRange.preset === 'all') return { from: null, to: null };
  const from = new Date(today);
  if (_analyticsRange.preset === '7d')  from.setDate(from.getDate() - 7);
  if (_analyticsRange.preset === '30d') from.setDate(from.getDate() - 30);
  if (_analyticsRange.preset === '90d') from.setDate(from.getDate() - 90);
  if (_analyticsRange.preset === '12m') from.setMonth(from.getMonth() - 12);
  return { from: from.toISOString().slice(0, 10), to: toStr };
}

function setAnalyticsRange(preset) {
  destroyCharts();
  _analyticsRange = { preset, customFrom: '', customTo: '' };
  _analyticsB2C   = null;
  if (preset === 'custom') { renderAnalyticsContent(); return; }
  loadAndRenderAnalytics();
}

function applyCustomRange() {
  const from = document.getElementById('ana-custom-from')?.value;
  const to   = document.getElementById('ana-custom-to')?.value;
  if (!from || !to || from > to) { toast('Bitte gültiges Start- und Enddatum wählen.'); return; }
  destroyCharts();
  _analyticsRange = { preset: 'custom', customFrom: from, customTo: to };
  _analyticsB2C   = null;
  loadAndRenderAnalytics();
}

function setAnalyticsSubTab(tab) {
  destroyCharts();
  _analyticsSubTab = tab;
  renderAnalyticsContent();
  setTimeout(drawAnalyticsCharts, 60);
}

function destroyCharts() {
  for (const c of Object.values(_charts)) { try { c.destroy(); } catch {} }
  _charts = {};
}

function renderAnalyticsContent() {
  const el = document.getElementById('analytics-content');
  if (!el) return;

  const isCustom = _analyticsRange.preset === 'custom';
  const RANGE_LABELS = { '7d':'7 Tage', '30d':'30 Tage', '90d':'90 Tage', '12m':'12 Monate', 'all':'Gesamt', 'custom':'Benutzerdefiniert' };
  const todayStr = new Date().toISOString().slice(0, 10);

  const filterBar = `
    <div class="analytics-filter-bar">
      ${['7d','30d','90d','12m','all','custom'].map(p => `
        <button class="range-pill${_analyticsRange.preset === p ? ' active' : ''}" onclick="setAnalyticsRange('${p}')">${RANGE_LABELS[p]}</button>`
      ).join('')}
    </div>
    ${isCustom ? `
    <div class="custom-range-row">
      <input type="date" id="ana-custom-from" value="${esc(_analyticsRange.customFrom)}" max="${todayStr}">
      <span style="color:var(--muted)">–</span>
      <input type="date" id="ana-custom-to"   value="${esc(_analyticsRange.customTo)}"   max="${todayStr}">
      <button class="btn-apply" onclick="applyCustomRange()">Anwenden</button>
    </div>` : ''}
  `;

  const subTabs = `
    <div class="analytics-sub-tabs">
      ${[['overview','Überblick'],['community','Community (B2C)'],['discovery','Discovery (B2B)']].map(([t,l]) => `
        <button class="sub-tab${_analyticsSubTab === t ? ' active' : ''}" onclick="setAnalyticsSubTab('${t}')">${l}</button>`
      ).join('')}
    </div>
  `;

  let body = '';
  if (!_analyticsB2C && !isCustom) {
    body = '<div class="analytics-loading">Lade…</div>';
  } else if (_analyticsSubTab === 'overview') {
    body = renderAnalyticsOverview();
  } else if (_analyticsSubTab === 'community') {
    body = renderAnalyticsCommunity();
  } else if (_analyticsSubTab === 'discovery') {
    body = renderAnalyticsDiscovery();
  }

  el.innerHTML = `<h2 class="ana-section-title">Analytics</h2>${filterBar}${subTabs}<div id="analytics-body">${body}</div>`;
  setTimeout(drawAnalyticsCharts, 60);
}

function _noData() {
  return '<p style="color:var(--muted);font-size:.875rem;padding:20px 0">Keine Daten verfügbar.</p>';
}

function _kpiCard(value, label, note) {
  return `<div class="kpi-card">
    <div class="kpi-value">${value}</div>
    <div class="kpi-label">${label}</div>
    ${note ? `<div class="kpi-note">${note}</div>` : ''}
  </div>`;
}

function renderAnalyticsOverview() {
  const b2c  = _analyticsB2C;
  const sugs = Object.values(_allSugs);
  const acts = Object.values(_allActs);

  const kpis = [
    _kpiCard(b2c ? b2c.users.total : '—', 'Registrierte Nutzer', 'B2C gesamt'),
    _kpiCard(b2c ? b2c.events.total : '—', 'Events gesamt', 'Nutzer-Events'),
    _kpiCard(b2c ? b2c.rsvps.dabei : '—', 'Dabei-RSVPs gesamt', 'alle Zeit'),
    _kpiCard(acts.length, 'Aktivitäten live', 'Discovery'),
    _kpiCard(sugs.filter(s => s.status === 'submitted').length, 'Offen zur Prüfung', 'Vorschläge'),
    _kpiCard(sugs.length, 'Vorschläge gesamt', 'Discovery B2B'),
  ];

  const timeBuckets = b2c?.events?.timeBuckets || [];
  const pipelineHas = sugs.length > 0;

  return `
    <div class="kpi-grid">${kpis.join('')}</div>
    ${b2c?.period?.from ? `<div class="data-note">ℹ Events im Zeitraum werden nach Event-Datum gefiltert (kein Erstellungsdatum gespeichert).</div>` : ''}
    <div class="charts-row">
      <div class="chart-section"><h4>Events nach Datum (Zeitraum)</h4>
        ${timeBuckets.length ? '<div class="chart-wrap"><canvas id="chart-overview-events"></canvas></div>' : _noData()}
      </div>
      <div class="chart-section"><h4>Discovery-Pipeline</h4>
        ${pipelineHas ? '<div class="chart-wrap"><canvas id="chart-overview-pipeline"></canvas></div>' : _noData()}
      </div>
    </div>`;
}

function renderAnalyticsCommunity() {
  const b2c = _analyticsB2C;
  if (!b2c) return '<div class="analytics-loading">Lade Community-Daten…</div>';

  const { from, to } = getAnalyticsDates();
  const isFiltered = !!(from && to);

  const rsvpDabei      = isFiltered ? b2c.rsvps.dabeiPeriod      : b2c.rsvps.dabei;
  const rsvpVielleicht = isFiltered ? b2c.rsvps.vielleichtPeriod : b2c.rsvps.vielleicht;
  const rsvpNein       = isFiltered ? b2c.rsvps.neinPeriod       : b2c.rsvps.nein;
  const rsvpUniqDabei  = isFiltered ? b2c.rsvps.uniqueUsersDabeiPeriod : b2c.rsvps.uniqueUsersDabei;
  const eventsShown    = isFiltered ? b2c.events.inPeriodByEventDate   : b2c.events.total;

  const kpis = [
    _kpiCard(b2c.users.total, 'Registrierte Nutzer gesamt'),
    _kpiCard(b2c.users.withAnyRsvpActivity, 'Nutzer mit RSVP-Aktivität', 'mindestens 1 RSVP (alle Zeit)'),
    _kpiCard(b2c.users.whoCreatedEvents, 'Nutzer mit eigenem Event', 'mind. 1 Event erstellt'),
    _kpiCard(eventsShown, isFiltered ? 'Events im Zeitraum' : 'Events gesamt', isFiltered ? 'nach Event-Datum' : ''),
    _kpiCard(b2c.events.upcomingByEventDate, 'Bevorstehende Events', isFiltered ? 'im Zeitraum' : 'ab heute'),
    _kpiCard(b2c.events.completedByEventDate, 'Vergangene Events', isFiltered ? 'im Zeitraum' : 'vor heute'),
    _kpiCard(rsvpDabei, 'Dabei-RSVPs', isFiltered ? 'nach Event-Datum' : 'alle Zeit'),
    _kpiCard(rsvpUniqDabei, 'Nutzer mit dabei-RSVP', isFiltered ? 'nach Event-Datum' : 'alle Zeit'),
    _kpiCard(b2c.spaces.total, 'Spaces gesamt'),
    _kpiCard(b2c.invites.total, 'Einladungen gesamt'),
  ];

  const timeBuckets = b2c.events.timeBuckets || [];
  const rsvpTotal = rsvpDabei + rsvpVielleicht + rsvpNein;

  return `
    <div class="kpi-grid">${kpis.join('')}</div>
    ${isFiltered ? `<div class="data-note">ℹ RSVPs und Events im Zeitraum werden nach Event-Datum gefiltert. Der Zeitpunkt der RSVP-Abgabe ist nicht gespeichert.</div>` : ''}
    <div class="charts-row">
      <div class="chart-section"><h4>Events nach Datum</h4>
        ${timeBuckets.length ? '<div class="chart-wrap"><canvas id="chart-community-events"></canvas></div>' : _noData()}
      </div>
      <div class="chart-section"><h4>RSVP-Verteilung</h4>
        ${rsvpTotal ? '<div class="chart-wrap"><canvas id="chart-community-rsvp"></canvas></div>' : _noData()}
      </div>
    </div>`;
}

function renderAnalyticsDiscovery() {
  const sugs = Object.values(_allSugs);
  const acts = Object.values(_allActs);

  if (!sugs.length && !acts.length) return _noData();

  const catCounts = {};
  for (const a of acts) { if (a.category) catCounts[a.category] = (catCounts[a.category] || 0) + 1; }
  const topCats = Object.entries(catCounts).sort(([,a],[,b]) => b - a).slice(0, 8);

  const cityCounts = {};
  for (const a of acts) { if (a.city) cityCounts[a.city] = (cityCounts[a.city] || 0) + 1; }
  const topCities = Object.entries(cityCounts).sort(([,a],[,b]) => b - a).slice(0, 8);

  const providerCounts = {};
  for (const a of acts) { if (a.providerName) providerCounts[a.providerName] = (providerCounts[a.providerName] || 0) + 1; }
  const topProviders = Object.entries(providerCounts).sort(([,a],[,b]) => b - a).slice(0, 5);

  const submitted = sugs.filter(s => s.status === 'submitted').length;
  const approved  = sugs.filter(s => s.status === 'approved').length;
  const rejected  = sugs.filter(s => s.status === 'rejected').length;
  const draft     = sugs.filter(s => s.status === 'draft').length;

  const kpis = [
    _kpiCard(sugs.length, 'Vorschläge gesamt'),
    _kpiCard(submitted, 'Offen zur Prüfung'),
    _kpiCard(approved, 'Genehmigt', 'Vorschläge'),
    _kpiCard(rejected, 'Abgelehnt', 'Vorschläge'),
    _kpiCard(acts.length, 'Aktivitäten live', 'auf someday.'),
    _kpiCard(topCats.length, 'Kategorien aktiv'),
  ];

  return `
    <div class="kpi-grid">${kpis.join('')}</div>
    <div class="charts-row">
      <div class="chart-section"><h4>Vorschläge-Pipeline</h4>
        ${sugs.length ? '<div class="chart-wrap"><canvas id="chart-discovery-pipeline"></canvas></div>' : _noData()}
      </div>
      <div class="chart-section"><h4>Top-Kategorien (Aktivitäten)</h4>
        ${topCats.length ? '<div class="chart-wrap"><canvas id="chart-discovery-cats"></canvas></div>' : _noData()}
      </div>
    </div>
    ${topCities.length ? `
    <div class="chart-section"><h4>Aktivitäten nach Stadt</h4>
      <div class="chart-wrap"><canvas id="chart-discovery-cities"></canvas></div>
    </div>` : ''}
    ${topProviders.length ? `
    <div class="chart-section"><h4>Top-Anbieter</h4>
      <table style="width:100%;font-size:.875rem;border-collapse:collapse">
        <thead><tr>
          <th style="text-align:left;padding:6px 8px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)">Anbieter</th>
          <th style="text-align:right;padding:6px 8px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)">Aktivitäten</th>
        </tr></thead>
        <tbody>${topProviders.map(([name, count]) => `
          <tr>
            <td style="padding:7px 8px;border-bottom:1px solid var(--border)">${esc(name)}</td>
            <td style="text-align:right;padding:7px 8px;border-bottom:1px solid var(--border);font-weight:600">${count}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>` : ''}`;
}

function drawAnalyticsCharts() {
  if (typeof Chart === 'undefined') {
    console.error('[someday:analytics] Chart.js not loaded — charts will not render');
    return;
  }

  const C = {
    green:'#65DB70', greenD:'#27a63a', blue:'#3B82F6',
    purple:'#8B5CF6', pink:'#E8534A', amber:'#F59E0B', muted:'#68786d',
  };

  function mk(id, type, data, extra = {}) {
    const canvas = document.getElementById(id);
    if (!canvas) { console.warn('[someday:analytics] canvas not found:', id); return; }
    if (_charts[id]) { try { _charts[id].destroy(); } catch {} }
    try {
    _charts[id] = new Chart(canvas, {
      type, data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: type === 'doughnut', position: 'bottom', labels: { padding: 12, font: { size: 11 } } },
        },
        ...extra,
      },
    });
    } catch (e) { console.error('[someday:analytics] Chart init failed for', id, ':', e.message); }
  }

  const b2c = _analyticsB2C;
  const { from, to } = getAnalyticsDates();
  const isFiltered = !!(from && to);

  // Events over time bar
  if (_analyticsSubTab === 'overview' || _analyticsSubTab === 'community') {
    const buckets = b2c?.events?.timeBuckets || [];
    const chartId = _analyticsSubTab === 'overview' ? 'chart-overview-events' : 'chart-community-events';
    if (buckets.length) {
      mk(chartId, 'bar', {
        labels: buckets.map(b => b.label),
        datasets: [{ label: 'Events', data: buckets.map(b => b.count),
          backgroundColor: C.green + 'CC', borderColor: C.greenD, borderWidth: 1, borderRadius: 4 }],
      }, { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } });
    }
  }

  if (_analyticsSubTab === 'overview') {
    const sugs = Object.values(_allSugs);
    if (sugs.length) {
      const pipePairs = [
        ['Eingereicht', sugs.filter(s => s.status === 'submitted').length, C.blue],
        ['Genehmigt',   sugs.filter(s => s.status === 'approved').length,  C.green],
        ['Abgelehnt',   sugs.filter(s => s.status === 'rejected').length,  C.pink],
        ['Entwurf',     sugs.filter(s => s.status === 'draft').length,     C.muted],
      ].filter(([, v]) => v > 0);
      if (pipePairs.length) {
        mk('chart-overview-pipeline', 'doughnut', {
          labels: pipePairs.map(([l]) => l),
          datasets: [{ data: pipePairs.map(([, v]) => v),
            backgroundColor: pipePairs.map(([,, c]) => c), borderWidth: 2, borderColor: '#fff' }],
        });
      }
    }
  }

  if (_analyticsSubTab === 'community' && b2c) {
    const dabei      = isFiltered ? b2c.rsvps.dabeiPeriod      : b2c.rsvps.dabei;
    const vielleicht = isFiltered ? b2c.rsvps.vielleichtPeriod : b2c.rsvps.vielleicht;
    const nein       = isFiltered ? b2c.rsvps.neinPeriod       : b2c.rsvps.nein;
    const rsvpPairs  = [['Dabei', dabei, C.green], ['Vielleicht', vielleicht, C.amber], ['Nein', nein, C.pink]]
      .filter(([, v]) => v > 0);
    if (rsvpPairs.length) {
      mk('chart-community-rsvp', 'doughnut', {
        labels: rsvpPairs.map(([l]) => l),
        datasets: [{ data: rsvpPairs.map(([, v]) => v),
          backgroundColor: rsvpPairs.map(([,, c]) => c), borderWidth: 2, borderColor: '#fff' }],
      });
    }
  }

  if (_analyticsSubTab === 'discovery') {
    const sugs = Object.values(_allSugs);
    const acts = Object.values(_allActs);

    if (sugs.length) {
      const discoPairs = [
        ['Eingereicht', sugs.filter(s => s.status === 'submitted').length, C.blue],
        ['Genehmigt',   sugs.filter(s => s.status === 'approved').length,  C.green],
        ['Abgelehnt',   sugs.filter(s => s.status === 'rejected').length,  C.pink],
        ['Entwurf',     sugs.filter(s => s.status === 'draft').length,     C.muted],
      ].filter(([, v]) => v > 0);
      if (discoPairs.length) {
        mk('chart-discovery-pipeline', 'doughnut', {
          labels: discoPairs.map(([l]) => l),
          datasets: [{ data: discoPairs.map(([, v]) => v),
            backgroundColor: discoPairs.map(([,, c]) => c), borderWidth: 2, borderColor: '#fff' }],
        });
      }
    }

    const catCounts = {};
    for (const a of acts) { if (a.category) catCounts[a.category] = (catCounts[a.category] || 0) + 1; }
    const topCats = Object.entries(catCounts).sort(([,a],[,b]) => b - a).slice(0, 8);
    if (topCats.length) {
      mk('chart-discovery-cats', 'bar', {
        labels: topCats.map(([c]) => c),
        datasets: [{ label: 'Aktivitäten', data: topCats.map(([,n]) => n),
          backgroundColor: C.purple + 'CC', borderColor: C.purple, borderWidth: 1, borderRadius: 4 }],
      }, { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } });
    }

    const cityCounts = {};
    for (const a of acts) { if (a.city) cityCounts[a.city] = (cityCounts[a.city] || 0) + 1; }
    const topCities = Object.entries(cityCounts).sort(([,a],[,b]) => b - a).slice(0, 8);
    if (topCities.length) {
      mk('chart-discovery-cities', 'bar', {
        labels: topCities.map(([c]) => c),
        datasets: [{ label: 'Aktivitäten', data: topCities.map(([,n]) => n),
          backgroundColor: C.blue + 'CC', borderColor: C.blue, borderWidth: 1, borderRadius: 4 }],
      }, { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } });
    }
  }
}
</script>
